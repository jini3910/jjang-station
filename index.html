function normalizeScheduleName(value){
    return String(value || "")
    .replace(/\s+/g, "")
    .toLowerCase();
}

function parseScheduleTime(value){
    const text = String(value || "").trim();

    if(!text){
        return null;
    }

    const match = text.match(/^(\d{1,2}):?(\d{2})$/);

    if(!match){
        return null;
    }

    const hour = Number(match[1]);
    const minute = Number(match[2]);

    if(hour === 24 && minute === 0){
        return 1440;
    }

    if(hour < 0 || hour > 23 || minute < 0 || minute > 59){
        return null;
    }

    return hour * 60 + minute;
}

function formatScheduleMinutes(minutes){
    if(minutes === null || minutes === undefined || !Number.isFinite(minutes)){
        return "";
    }

    if(minutes >= 1440){
        return "24:00";
    }

    const hour = Math.floor(minutes / 60);
    const minute = minutes % 60;
    return String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
}

function isSameLocalDate(value, targetDate = new Date()){
    const date = new Date(value || "");

    if(!Number.isFinite(date.getTime())){
        return false;
    }

    return date.getFullYear() === targetDate.getFullYear() &&
        date.getMonth() === targetDate.getMonth() &&
        date.getDate() === targetDate.getDate();
}

function isScheduleUpdatedToday(schedule = data.staffSchedule){
    return Boolean(schedule && isSameLocalDate(schedule.updatedAt));
}

function getTodayScheduleForCurrentUser(){
    const schedule = data.staffSchedule || {};
    const loginName = getCurrentDisplayName();
    const targetName = normalizeScheduleName(loginName);
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    if(!getLoginId()){
        return {
            loginName:"",
            now,
            nowMinutes,
            entries:[],
            previous:null,
            current:null,
            next:null,
            reason:"login"
        };
    }

    const entries = (schedule.entries || [])
    .map((entry)=>({
        ...entry,
        startMinutes:parseScheduleTime(entry.start),
        endMinutes:parseScheduleTime(entry.end)
    }))
    .filter((entry)=>
        normalizeScheduleName(entry.employeeName) === targetName &&
        entry.area &&
        entry.startMinutes !== null &&
        entry.endMinutes !== null
    )
    .sort((a,b)=>a.startMinutes - b.startMinutes);

    if(entries.length === 0){
        return {
            loginName,
            now,
            nowMinutes,
            entries,
            previous:null,
            current:null,
            next:null,
            reason:"empty"
        };
    }

    let current = entries.find((entry)=>{
        const end = entry.endMinutes <= entry.startMinutes
            ? entry.endMinutes + 1440
            : entry.endMinutes;
        const adjustedNow = nowMinutes < entry.startMinutes && end > 1440
            ? nowMinutes + 1440
            : nowMinutes;

        return adjustedNow >= entry.startMinutes && adjustedNow < end;
    }) || null;

    let currentIndex = current ? entries.indexOf(current) : -1;
    let next = null;
    let previous = null;

    if(currentIndex >= 0){
        previous = entries[currentIndex - 1] || null;
        next = entries[currentIndex + 1] || null;
    }else{
        next = entries.find((entry)=>entry.startMinutes > nowMinutes) || null;
        const nextIndex = next ? entries.indexOf(next) : entries.length;
        previous = entries[nextIndex - 1] || entries[entries.length - 1] || null;
    }

    return {
        loginName,
        now,
        nowMinutes,
        entries,
        previous,
        current,
        next,
        reason:current ? "current" : "between"
    };
}

function createScheduleStation(label, entry, active = false){
    const station = document.createElement("div");
    station.className = "schedule-station" + (active ? " active" : "");

    const dot = document.createElement("div");
    dot.className = "schedule-dot";

    const labelEl = document.createElement("div");
    labelEl.className = "schedule-label";
    labelEl.innerText = label;

    const area = document.createElement("div");
    area.className = "schedule-area";
    area.innerText = entry ? entry.area : "없음";

    const time = document.createElement("div");
    time.className = "schedule-time";
    time.innerText = entry &&
        Number.isFinite(entry.startMinutes) &&
        Number.isFinite(entry.endMinutes)
        ? formatScheduleMinutes(entry.startMinutes) + " ~ " + formatScheduleMinutes(entry.endMinutes)
        : "";

    station.appendChild(dot);
    station.appendChild(labelEl);
    station.appendChild(area);
    station.appendChild(time);

    return station;
}

function renderScheduleNowWidget(root){
    if(currentView !== "genres"){
        return;
    }

    if(!getScheduleHomeVisible()){
        return;
    }

    if(!isScheduleUpdatedToday(data.staffSchedule)){
        return;
    }

    const state = getTodayScheduleForCurrentUser();

    if(state.reason === "login" || state.reason === "empty"){
        return;
    }

    const card = document.createElement("div");
    card.className = "schedule-now-card";

    const head = document.createElement("div");
    head.className = "schedule-now-head";
    head.innerHTML =
        "<b>오늘 담당구역</b><span>" +
        formatScheduleMinutes(state.nowMinutes) +
        " 기준</span>";
    card.appendChild(head);

    const route = document.createElement("div");
    route.className = "schedule-route";
    route.appendChild(createScheduleStation("이전", state.previous, false));
    route.appendChild(createScheduleStation("현재", state.current || {
        area:"담당 없음",
        startMinutes:state.nowMinutes,
        endMinutes:state.nowMinutes
    }, true));
    route.appendChild(createScheduleStation("다음", state.next, false));
    card.appendChild(route);

    root.appendChild(card);
}

async function uploadScheduleImage(input){
    if(!requireScheduleEdit()){
        return;
    }

    const file = input && input.files && input.files[0];

    if(!file){
        return;
    }

    const interval = showLoading("시간표 이미지 저장 중...");

    try{
        const ext = file.type === "image/png"
            ? ".png"
            : file.type === "image/webp"
                ? ".webp"
                : ".jpg";
        data.staffSchedule.sourceImage = await uploadOriginalFileToStorage(
            file,
            storageImagePath("schedule_original") + ext
        );
        applyAuditFields(data.staffSchedule, "sourceImageUpdated");
        applyAuditFields(data.staffSchedule, "updated");
        await saveData(()=>render(false));
    }catch(err){
        console.error(err);
        alert("시간표 이미지 저장 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}

const DEFAULT_SCHEDULE_AREAS = [
    "오픈",
    "프라이즈",
    "휴식",
    "잼나/조플",
    "코코짱",
    "카니발 / VR",
    "UFO",
    "미니",
    "마감"
];

const DEFAULT_SCHEDULE_COLORS = [
    "#fff1b8",
    "#ffd6d6",
    "#d9e8ff",
    "#d8f5df",
    "#ffe0bd",
    "#eadcff",
    "#d7f4f2",
    "#f2d9e6",
    "#dddddd"
];

function getScheduleAreaColor(area){
    const schedule = data.staffSchedule || {};
    const colors = Array.isArray(schedule.areaColors) ? schedule.areaColors : [];
    const saved = colors.find((item)=>item && item.name === area);

    if(saved && saved.color){
        return saved.color;
    }

    const areas = getScheduleAreas(schedule);
    const index = Math.max(0, areas.indexOf(area));
    return DEFAULT_SCHEDULE_COLORS[index % DEFAULT_SCHEDULE_COLORS.length];
}

function setScheduleAreaColor(area, color){
    if(!data.staffSchedule){
        return;
    }

    if(!Array.isArray(data.staffSchedule.areaColors)){
        data.staffSchedule.areaColors = [];
    }

    const safeArea = sanitizeText(area || "");
    const safeColor = /^#[0-9a-f]{6}$/i.test(String(color || "")) ? color : "";

    if(!safeArea || !safeColor){
        return;
    }

    const existing = data.staffSchedule.areaColors.find((item)=>item && item.name === safeArea);

    if(existing){
        existing.color = safeColor;
    }else{
        data.staffSchedule.areaColors.push({
            name:safeArea,
            color:safeColor
        });
    }
}

function removeScheduleAreaColor(area){
    if(!data.staffSchedule || !Array.isArray(data.staffSchedule.areaColors)){
        return;
    }

    data.staffSchedule.areaColors = data.staffSchedule.areaColors
    .filter((item)=>item && item.name !== area);
}

function getScheduleTextColor(hex){
    const value = String(hex || "").replace("#", "");

    if(!/^[0-9a-f]{6}$/i.test(value)){
        return "#222";
    }

    const r = parseInt(value.slice(0, 2), 16);
    const g = parseInt(value.slice(2, 4), 16);
    const b = parseInt(value.slice(4, 6), 16);
    const brightness = (r * 299 + g * 587 + b * 114) / 1000;
    return brightness < 135 ? "#fff" : "#222";
}

function getScheduleSlots(){
    const slots = [];
    const start = 10 * 60;
    const end = 24 * 60;
    const step = 60;

    for(let minutes = start; minutes < end; minutes += step){
        slots.push({
            start:minutes,
            end:minutes + step,
            label:formatScheduleMinutes(minutes) + "\n~ " + formatScheduleMinutes(minutes + step)
        });
    }

    return slots;
}

function getScheduleHalfSlots(slots){
    const halves = [];

    slots.forEach((slot)=>{
        halves.push({
            start:slot.start,
            end:slot.start + 30
        });
        halves.push({
            start:slot.start + 30,
            end:slot.end
        });
    });

    return halves;
}

function getScheduleEmployees(schedule){
    const names = Array.isArray(schedule.employees) ? [...schedule.employees] : [];

    (schedule.entries || []).forEach((entry)=>{
        if(entry.employeeName && !names.includes(entry.employeeName)){
            names.push(entry.employeeName);
        }
    });

    return names;
}

function getScheduleRows(schedule){
    const rows = Array.isArray(schedule.rows) && schedule.rows.length
        ? [...schedule.rows]
        : getScheduleEmployees(schedule);

    (schedule.entries || []).forEach((entry)=>{
        if(entry.employeeName && !rows.includes(entry.employeeName)){
            rows.push(entry.employeeName);
        }
    });

    return rows;
}

function createEmptyScheduleRowName(rows){
    let index = 1;
    let name = "__empty_row_" + index;

    while(rows.includes(name)){
        index++;
        name = "__empty_row_" + index;
    }

    return name;
}

function getScheduleRowDisplayName(rowName){
    return String(rowName || "").startsWith("__empty_row_") ? "" : rowName;
}

function getScheduleAreas(schedule){
    const areas = Array.isArray(schedule.areas) && schedule.areas.length
        ? [...schedule.areas]
        : [...DEFAULT_SCHEDULE_AREAS];

    (schedule.entries || []).forEach((entry)=>{
        if(entry.area && !areas.includes(entry.area)){
            areas.push(entry.area);
        }
    });

    return areas;
}

function createScheduleCellMap(schedule, slots){
    const map = {};
    const halves = getScheduleHalfSlots(slots);

    (schedule.entries || []).forEach((entry)=>{
        const start = parseScheduleTime(entry.start);
        const end = parseScheduleTime(entry.end);

        if(!entry.employeeName || !entry.area || start === null || end === null){
            return;
        }

        const adjustedEnd = end <= start ? end + 1440 : end;

        halves.forEach((half)=>{
            if(half.start >= start && half.start < adjustedEnd){
                map[entry.employeeName + "|" + half.start] = {
                    area:entry.area,
                    note:entry.note || ""
                };
            }
        });
    });

    return map;
}

function getScheduleHalfValue(board, employee, halfStart){
    const half = Array.from(
        board.querySelectorAll(".schedule-half[data-employee][data-start]")
    ).find((item)=>
        item.dataset.employee === employee &&
        item.dataset.start === String(halfStart)
    );

    return half ? half.dataset.area || "" : "";
}

function collectScheduleEntriesFromBoard(board, employees, slots){
    const entries = [];
    const halves = getScheduleHalfSlots(slots);

    employees.forEach((employee)=>{
        if(!getScheduleRowDisplayName(employee)){
            return;
        }

        let activeArea = "";
        let activeStart = null;

        halves.forEach((half, index)=>{
            const area = getScheduleHalfValue(board, employee, half.start);
            const nextHalf = halves[index + 1];

            if(area !== activeArea && activeArea){
                entries.push({
                    id:createScheduleEntry().id,
                    employeeName:employee,
                    start:formatScheduleMinutes(activeStart),
                    end:formatScheduleMinutes(half.start),
                    area:activeArea,
                    note:""
                });
            }

            if(area !== activeArea){
                activeArea = area;
                activeStart = area ? half.start : null;
            }

            if(area && !nextHalf){
                entries.push({
                    id:createScheduleEntry().id,
                    employeeName:employee,
                    start:formatScheduleMinutes(activeStart),
                    end:formatScheduleMinutes(half.end),
                    area:activeArea,
                    note:""
                });
                activeArea = "";
                activeStart = null;
            }
        });
    });

    return entries;
}

function setScheduleHalf(half, area){
    if(!half){
        return;
    }

    const value = sanitizeText(area || "");
    half.dataset.area = value;
    half.innerText = value || "";
    half.classList.toggle("filled", !!value);
    half.classList.toggle("rest", value === "휴식");

    if(value){
        const color = getScheduleAreaColor(value);
        half.style.background = color;
        half.style.color = getScheduleTextColor(color);
    }else{
        half.style.background = "";
        half.style.color = "";
    }

    updateScheduleSlotVisual(half.closest(".schedule-board-cell.slot"));
}

function updateScheduleSlotVisual(slotCell){
    if(!slotCell){
        return;
    }

    const halves = Array.from(slotCell.querySelectorAll(".schedule-half"));
    const firstArea = halves[0] ? halves[0].dataset.area || "" : "";
    const secondArea = halves[1] ? halves[1].dataset.area || "" : "";

    slotCell.classList.toggle(
        "full-block",
        !!firstArea && firstArea === secondArea
    );
}

function setScheduleBlock(targetHalf, area, duration){
    if(!targetHalf){
        return;
    }

    const parent = targetHalf.closest(".schedule-board-cell.slot");

    if(duration === "60" && parent){
        parent.querySelectorAll(".schedule-half").forEach((half)=>{
            setScheduleHalf(half, area);
        });
        return;
    }

    setScheduleHalf(targetHalf, area);
}

function clearScheduleBlock(targetHalf){
    if(!targetHalf){
        return;
    }

    const parent = targetHalf.closest(".schedule-board-cell.slot");

    if(parent && parent.classList.contains("full-block")){
        parent.querySelectorAll(".schedule-half").forEach((half)=>{
            setScheduleHalf(half, "");
        });
        return;
    }

    setScheduleHalf(targetHalf, "");
}

function createScheduleChip(type, value, selectedState, selectedLabel){
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "schedule-chip";
    chip.draggable = canEditSchedule();
    chip.dataset.type = type;
    chip.dataset.value = value;
    chip.innerText = value;

    const selectChip = ()=>{
        if(!canEditSchedule()){
            return;
        }

        selectedState.type = type;
        selectedState.value = value;
        selectedLabel.innerText = "선택됨: " + value;
        document.querySelectorAll(".schedule-chip.selected").forEach((item)=>{
            item.classList.remove("selected");
        });
        chip.classList.add("selected");
    };

    chip.onclick = selectChip;
    chip.ondragstart = (event)=>{
        if(!canEditSchedule()){
            event.preventDefault();
            return;
        }

        event.dataTransfer.setData("text/plain", JSON.stringify({
            type,
            value,
            duration:selectedState.duration || "60"
        }));
        selectChip();
    };

    return chip;
}

function renderSchedulePalette(title, type, values, selectedState, selectedLabel, onDelete, onColorChange){
    const palette = document.createElement("div");
    palette.className = "schedule-palette";

    const heading = document.createElement("h3");
    heading.innerText = title;
    palette.appendChild(heading);

    const list = document.createElement("div");
    list.className = "schedule-chip-list";

    values.forEach((value)=>{
        const wrap = document.createElement("div");
        wrap.className = "schedule-chip-wrap";
        wrap.appendChild(createScheduleChip(type, value, selectedState, selectedLabel));

        if(canEditSchedule()){
            if(type === "area"){
                const colorInput = document.createElement("input");
                colorInput.type = "color";
                colorInput.className = "schedule-color-input";
                colorInput.value = getScheduleAreaColor(value);
                colorInput.title = value + " 색상";
                colorInput.onchange = ()=>{
                    onColorChange(value, colorInput.value);
                };
                wrap.appendChild(colorInput);
            }

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "schedule-chip-delete";
            deleteButton.innerText = "×";
            deleteButton.onclick = ()=>{
                onDelete(value);
            };
            wrap.appendChild(deleteButton);
        }

        list.appendChild(wrap);
    });

    palette.appendChild(list);
    return palette;
}

function applyScheduleDropToCell(half, payload, selectedState){
    if(!half || !payload || !canEditSchedule()){
        return;
    }

    if(payload.type === "area"){
        setScheduleBlock(
            half,
            payload.value,
            payload.duration || (selectedState && selectedState.duration) || "60"
        );
    }
}

            cell.className = "schedule-board-cell slot";
            cell.dataset.start = String(slot.start);
            cell.dataset.end = String(slot.end);

            [slot.start, slot.start + 30].forEach((halfStart)=>{
                const half = document.createElement("div");
                const saved = cellMap[employee + "|" + halfStart];
                half.className = "schedule-half";
                half.dataset.employee = employee;
                half.dataset.start = String(halfStart);
                half.dataset.end = String(halfStart + 30);
                half.title = formatScheduleMinutes(halfStart) + " ~ " + formatScheduleMinutes(halfStart + 30);
                setScheduleHalf(half, saved ? saved.area : "");

                half.ondragover = (event)=>{
                    event.preventDefault();
                    half.classList.add("drop-ready");
                };

                half.ondragleave = ()=>{
                    half.classList.remove("drop-ready");
                };

                half.ondrop = (event)=>{
                    event.preventDefault();
                    half.classList.remove("drop-ready");

                    if(selectedState.deleteMode || selectedState.rowDeleteMode){
                        return;
                    }

                    try{
                        applyScheduleDropToCell(
                            half,
                            JSON.parse(event.dataTransfer.getData("text/plain")),
                            selectedState
                        );
                    }catch(err){
                        applyScheduleDropToCell(half, selectedState, selectedState);
                    }
                };

                half.onclick = ()=>{
                    if(!canEditSchedule()){
                        return;
                    }

                    if(selectedState.rowDeleteMode){
                        deleteScheduleRow();
                        return;
                    }

                    if(selectedState.deleteMode){
                        clearScheduleBlock(half);
                        return;
                    }

                    if(selectedState.type === "area" && selectedState.value){
                        setScheduleBlock(half, selectedState.value, selectedState.duration);
                    }
                };

                half.ondblclick = (event)=>{
                    event.stopPropagation();

                    if(!canEditSchedule()){
                        return;
                    }

                    clearScheduleBlock(half);
                };

                cell.appendChild(half);
            });

            updateScheduleSlotVisual(cell);
            board.appendChild(cell);
        });
    });

    applyScheduleZoom();
    boardWrap.appendChild(board);
    workspace.appendChild(boardWrap);
    editor.appendChild(workspace);

    if(canEditSchedule()){
        const actions = document.createElement("div");
        actions.className = "folder-create-actions";

        actions.appendChild(createButton("btn-add folder-create-btn", "+ 행 추가", ()=>{
            const rowName = createEmptyScheduleRowName(rows);
            rows.push(rowName);
            data.staffSchedule.rows = rows.filter(Boolean);
            applyAuditFields(data.staffSchedule, "updated");
            saveData(()=>render(false));
        }));

        actions.appendChild(createButton("btn-add folder-create-btn", "+ 직원칩", ()=>{
            const name = sanitizeText(prompt("직원 이름 입력") || "");

            if(!name){
                return;
            }

            if(!data.staffSchedule.employees.includes(name)){
                data.staffSchedule.employees.push(name);
            }

            applyAuditFields(data.staffSchedule, "updated");
            saveData(()=>render(false));
        }));

        actions.appendChild(createButton("btn-add folder-create-btn", "+ 담당구역", ()=>{
            const area = sanitizeText(prompt("담당구역 입력") || "");

            if(!area){
                return;
            }

            if(!data.staffSchedule.areas.includes(area)){
                data.staffSchedule.areas.push(area);
            }

            applyAuditFields(data.staffSchedule, "updated");
            saveData(()=>render(false));
        }));

        actions.appendChild(createButton("btn-save folder-create-btn", "저장", ()=>{
            data.staffSchedule.employees = employees.filter(Boolean);
            data.staffSchedule.rows = rows.filter(Boolean);
            data.staffSchedule.areas = areas.filter(Boolean);
            data.staffSchedule.entries = collectScheduleEntriesFromBoard(
                board,
                rows,
                slots
            );
            data.staffSchedule.zoom = Number(zoomInput.value) || 100;
            applyAuditFields(data.staffSchedule, "updated");
            saveData(()=>{
                alert("시간표 저장 완료");
                render(false);
            });
        }));

        editor.appendChild(actions);
    }

    const backActions = document.createElement("div");
    backActions.className = "folder-create-actions";
    backActions.appendChild(createButton("btn-back folder-create-btn", "뒤로가기", ()=>{
        currentView = "genres";
        render();
    }));
    editor.appendChild(backActions);

    root.appendChild(editor);
}

function formatActionTime(value){
    if(!value){
        return "";
    }

    const date = new Date(value);

    if(!Number.isFinite(date.getTime())){
        return "";
    }

    const pad = (number)=>String(number).padStart(2, "0");

    return date.getFullYear() + "." +
        pad(date.getMonth() + 1) + "." +
        pad(date.getDate()) + " " +
        pad(date.getHours()) + ":" +
        pad(date.getMinutes()) + ":" +
        pad(date.getSeconds());
}

    badge.innerText = label + ": " + timeText + (actorName ? " / " + actorName : "");

}

function moveGenreByVisibleOrder(genre, direction, visibleGenres, activeGroup){
    const currentVisibleIndex = visibleGenres.indexOf(genre);
    const targetGenre = visibleGenres[currentVisibleIndex + direction];

    if(!targetGenre){
        return;
    }

    const orderList = activeGroup ? activeGroup.genres : data.genres;
    const currentIndex = orderList.indexOf(genre);
    const targetIndex = orderList.indexOf(targetGenre);

    if(currentIndex < 0 || targetIndex < 0){
        return;
    }

    [orderList[currentIndex], orderList[targetIndex]] =
        [orderList[targetIndex], orderList[currentIndex]];

    saveData(()=>render(false));
}

function moveValueBeforeOrAfter(list, sourceValue, targetValue, placeAfter){
    if(!Array.isArray(list) || sourceValue === targetValue){
        return false;
    }

    const sourceIndex = list.indexOf(sourceValue);
    let targetIndex = list.indexOf(targetValue);

    if(sourceIndex < 0 || targetIndex < 0){
        return false;
    }

    list.splice(sourceIndex, 1);

    if(sourceIndex < targetIndex){
        targetIndex--;
    }

    list.splice(targetIndex + (placeAfter ? 1 : 0), 0, sourceValue);
    return true;
}

function attachCardReorderDrag(trigger, wrap, options){
    if(
        !trigger ||
        !wrap ||
        !options ||
        !options.container ||
        (!options.onDrop && !options.onOrder)
    ){
        return;
    }

    let startX = 0;
    let startY = 0;
    let dragging = false;
    let dropTarget = null;
    let placeAfter = false;
    let ghost = null;
    let ghostOffsetX = 0;
    let ghostOffsetY = 0;
    let activePointerId = null;
    let longPressTimer = null;
    let touchMode = false;

    wrap.classList.add("reorder-enabled");

    const clearLongPressTimer = ()=>{
        if(longPressTimer){
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
    };

    const moveGhost = (event)=>{
        if(!ghost){
            return;
        }

        ghost.style.transform =
            "translate3d(" +
            Math.round(event.clientX - ghostOffsetX) +
            "px," +
            Math.round(event.clientY - ghostOffsetY) +
            "px,0)";
    };

    const removeGhost = ()=>{
        if(ghost){
            ghost.remove();
            ghost = null;
        }
    };

    const lockTouchSelection = ()=>{
        document.body.classList.add("reorder-touch-lock");
        document.body.style.userSelect = "none";
        document.body.style.webkitUserSelect = "none";
        document.body.style.webkitTouchCallout = "none";
    };

    const unlockTouchSelection = ()=>{
        document.body.classList.remove("reorder-touch-lock");
        document.body.style.userSelect = "";
        document.body.style.webkitUserSelect = "";
        document.body.style.webkitTouchCallout = "";
    };

    const beginDrag = (event)=>{
        if(dragging){
            return;
        }

        dragging = true;
        lockTouchSelection();
        wrap.classList.add("dragging");
        options.container.classList.add("reorder-jiggle");

        const rect = wrap.getBoundingClientRect();
        ghostOffsetX = event.clientX - rect.left;
        ghostOffsetY = event.clientY - rect.top;
        ghost = wrap.cloneNode(true);
        ghost.classList.remove("dragging", "drag-over-before", "drag-over-after");
        ghost.classList.add("reorder-ghost");
        ghost.style.width = rect.width + "px";
        ghost.style.height = rect.height + "px";
        document.body.appendChild(ghost);
        moveGhost(event);

        if(trigger.setPointerCapture && activePointerId !== null){
            try{
                trigger.setPointerCapture(activePointerId);
            }catch(err){
                console.warn("pointer capture failed", err);
            }
        }
    };

    const finish = (event)=>{
        clearLongPressTimer();

        if(
            trigger.hasPointerCapture &&
            event &&
            trigger.hasPointerCapture(event.pointerId)
        ){
            trigger.releasePointerCapture(event.pointerId);
        }

        unlockTouchSelection();
        options.container.classList.remove("reorder-jiggle");
        removeGhost();

        if(!dragging){
            activePointerId = null;
            unlockTouchSelection();
            return;
        }

        dragging = false;
        wrap.classList.remove("dragging");
        clearReorderDropMarkers(options.container);
        trigger.dataset.dragMoved = "1";
        wrap.dataset.reorderMoved = "1";

        setTimeout(()=>{
            delete trigger.dataset.dragMoved;
            delete wrap.dataset.reorderMoved;
        }, 0);

        if(dropTarget && dropTarget !== wrap && options.onDrop){
            options.onDrop(
                options.key,
                dropTarget.dataset.reorderKey,
                placeAfter
            );
        }else if(dropTarget && options.onOrder){
            const orderedKeys = Array.from(
                options.container.querySelectorAll(".item-wrapper[data-reorder-type='" + options.type + "']")
            ).map((item)=>item.dataset.reorderKey)
            .filter(Boolean);

            options.onOrder(orderedKeys);
        }

        activePointerId = null;
    };

    const updateDropTarget = (event)=>{
        clearReorderDropMarkers(options.container);

        const underPointer = document.elementFromPoint(event.clientX, event.clientY);
        const target = underPointer
            ? underPointer.closest(".item-wrapper[data-reorder-type='" + options.type + "']")
            : null;

        if(!target || !options.container.contains(target)){
            dropTarget = null;
            return;
        }

        if(target === wrap){
            dropTarget = null;
            return;
        }

        const rect = target.getBoundingClientRect();
        const sameRowPointer = event.clientY >= rect.top && event.clientY <= rect.bottom;
        placeAfter = sameRowPointer
            ? event.clientX > rect.left + rect.width / 2
            : event.clientY > rect.top + rect.height / 2;
        target.classList.add(placeAfter ? "drag-over-after" : "drag-over-before");
        dropTarget = target;
    };

    trigger.onpointerdown = (event)=>{
        if(
            !canEditCurrentStore() ||
            event.button !== 0 ||
            isReorderInteractiveTarget(event.target)
        ){
            return;
        }

        startX = event.clientX;
        startY = event.clientY;
        dragging = false;
        dropTarget = null;
        placeAfter = false;
        activePointerId = event.pointerId;
        touchMode = isCoarsePointer() || event.pointerType === "touch";
        clearLongPressTimer();

        if(touchMode){
            lockTouchSelection();
            const startEvent = {
                clientX:event.clientX,
                clientY:event.clientY
            };

            longPressTimer = setTimeout(()=>{
                beginDrag(startEvent);
            }, 520);
        }else if(trigger.setPointerCapture){
            try{
                trigger.setPointerCapture(event.pointerId);
            }catch(err){
                console.warn("pointer capture failed", err);
            }
        }
    };

    trigger.onpointermove = (event)=>{
        if(activePointerId !== event.pointerId){
            return;
        }

        const moved = Math.hypot(event.clientX - startX, event.clientY - startY);

        if(!dragging){
            if(touchMode){
                if(moved > 10){
                    clearLongPressTimer();
                    unlockTouchSelection();
                    activePointerId = null;
                }
                return;
            }

            if(moved < 7){
                return;
            }

            beginDrag(event);
        }

        event.preventDefault();
        moveGhost(event);
        updateDropTarget(event);
    };

    trigger.onpointerup = finish;
    trigger.onpointercancel = finish;
    trigger.oncontextmenu = (event)=>{
        if(canEditCurrentStore() && !isReorderInteractiveTarget(event.target)){
            event.preventDefault();
        }
    };
}

function getOrderedMachinesForGenre(genre){
    const machines = data.machines[genre] || {};
    const machineKeys = Object.keys(machines).sort(naturalMachineCompare);

    if(!data.machineOrder || typeof data.machineOrder !== "object" || Array.isArray(data.machineOrder)){
        data.machineOrder = {};
    }

    if(!Array.isArray(data.machineOrder[genre])){
        data.machineOrder[genre] = machineKeys;
    }else{
        data.machineOrder[genre] = data.machineOrder[genre]
        .filter((machine)=>machineKeys.includes(machine));

        machineKeys.forEach((machine)=>{
            if(!data.machineOrder[genre].includes(machine)){
                data.machineOrder[genre].push(machine);
            }
        });
    }

    return data.machineOrder[genre].filter((machine)=>machineKeys.includes(machine));
}

function mergeVisibleOrderIntoList(list, visibleOrder){
    const visibleSet = new Set(visibleOrder);
    let cursor = 0;

    return list.map((value)=>{
        if(!visibleSet.has(value)){
            return value;
        }

        const nextValue = visibleOrder[cursor];
        cursor++;
        return nextValue;
    });
}

function applyGenreOrderFromDrag(orderedGenres, activeGroup){
    const orderList = activeGroup ? activeGroup.genres : data.genres;
    const visibleOrder = orderedGenres.filter((genre)=>orderList.includes(genre));
    const nextOrder = mergeVisibleOrderIntoList(orderList, visibleOrder);

    if(JSON.stringify(orderList) === JSON.stringify(nextOrder)){
        return;
    }

    if(activeGroup){
        activeGroup.genres = nextOrder;
    }else{
        data.genres = nextOrder;
    }

    saveData(()=>render(false));
}

function applyGenreGroupOrderFromDrag(orderedGroupIds){
    const visibleOrder = orderedGroupIds.filter((groupId)=>{
        return (data.genreGroups || []).some((group)=>group.id === groupId);
    });
    const visibleSet = new Set(visibleOrder);
    let cursor = 0;
    const nextGroups = (data.genreGroups || []).map((group)=>{
        if(!visibleSet.has(group.id)){
            return group;
        }

        const nextId = visibleOrder[cursor];
        cursor++;
        return data.genreGroups.find((entry)=>entry.id === nextId) || group;
    });

    if(JSON.stringify((data.genreGroups || []).map((group)=>group.id)) === JSON.stringify(nextGroups.map((group)=>group.id))){
        return;
    }

    data.genreGroups = nextGroups;
    saveData(()=>render(false));
}

function applyMachineOrderFromDrag(orderedMachines){
    const currentOrder = getOrderedMachinesForGenre(currentGenre);
    const visibleOrder = orderedMachines.filter((machine)=>currentOrder.includes(machine));
    const nextOrder = mergeVisibleOrderIntoList(currentOrder, visibleOrder);

    if(JSON.stringify(currentOrder) === JSON.stringify(nextOrder)){
        return;
    }

    data.machineOrder[currentGenre] = nextOrder;
    saveData(()=>render(false));
}

function reorderGenreByDrag(sourceGenre, targetGenre, placeAfter, activeGroup){
    const orderList = activeGroup ? activeGroup.genres : data.genres;

    if(moveValueBeforeOrAfter(orderList, sourceGenre, targetGenre, placeAfter)){
        saveData(()=>render(false));
    }
}

function reorderGenreGroupByDrag(sourceGroupId, targetGroupId, placeAfter){
    const orderList = data.genreGroups || [];
    const sourceIndex = orderList.findIndex((group)=>group.id === sourceGroupId);
    let targetIndex = orderList.findIndex((group)=>group.id === targetGroupId);

    if(sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex){
        return;
    }

    const [sourceGroup] = orderList.splice(sourceIndex, 1);

    if(sourceIndex < targetIndex){
        targetIndex--;
    }

    orderList.splice(targetIndex + (placeAfter ? 1 : 0), 0, sourceGroup);
    saveData(()=>render(false));
}

function reorderMachineByDrag(sourceMachine, targetMachine, placeAfter){
    const orderList = getOrderedMachinesForGenre(currentGenre);

    if(moveValueBeforeOrAfter(orderList, sourceMachine, targetMachine, placeAfter)){
        data.machineOrder[currentGenre] = orderList;
        saveData(()=>render(false));
    }
}

function normalizeMachineSearchText(value){
    return String(value || "")
    .toLowerCase()
    .replace(/\s+/g, "");
}

function getMachineSearchText(machineData){
    const parts = [
        machineData.memo
    ];

    (machineData.evidencePhotos || []).forEach((photoItem)=>{
        parts.push(photoItem && photoItem.memo);
    });

    if(canViewAdminOnlyItems()){
        parts.push(machineData.adminMemo);

        (machineData.adminEvidencePhotos || []).forEach((photoItem)=>{
            parts.push(photoItem && photoItem.memo);
        });
    }

    return parts.filter(Boolean).join(" ");
}

function getMachineSearchResults(query){
    const keyword = normalizeMachineSearchText(query);

    if(!keyword){
        return [];
    }

    const results = [];

    data.genres.forEach((genre)=>{
        if(!canViewAdminOnlyItems() && isAdminOnlyGenre(genre)){
            return;
        }

        const machines = data.machines[genre] || {};
        const group = (data.genreGroups || []).find((item)=>{
            return (item.genres || []).includes(genre);
        });

        if(group && group.adminOnly && !canViewAdminOnlyItems()){
            return;
        }

        Object.keys(machines)
        .sort(naturalMachineCompare)
        .forEach((machine)=>{
            const machineData = machines[machine] || {};

            if(!canViewAdminOnlyItems() && isAdminOnlyMachine(machineData)){
                return;
            }

            const memoText = getMachineSearchText(machineData);
            const searchable = normalizeMachineSearchText(memoText);

            if(!searchable.includes(keyword)){
                return;
            }

            const path = group
                ? "폴더 목록 > " + group.name + " > " + genre + " > " + machine + "번"
                : "폴더 목록 > " + genre + " > " + machine + "번";

            results.push({
                label:machine + "번",
                path:path,
                genre:genre,
                machine:machine,
                memo:memoText
            });
        });
    });

    return results;
}

function openMachineSearchResult(result){
    currentGenre = result.genre;
    currentMachine = result.machine;
    currentGenreGroup = null;
    currentView = "detail";
    render();
}

function renderMachineSearchResults(container, query){
    container.innerHTML = "";

    const results = getMachineSearchResults(query);

    if(!query){
        return;
    }

    if(results.length === 0){
        const empty = document.createElement("p");
        empty.className = "sub-text";
        empty.innerText = "검색 결과가 없습니다.";
        container.appendChild(empty);
        return;
    }

    results.slice(0, 50).forEach((result)=>{
        const item = document.createElement("button");
        item.type = "button";
        item.className = "folder-search-item";
        item.innerText = "정답지: " + result.label;

        const path = document.createElement("span");
        path.className = "folder-path";
        path.innerText = result.path;
        item.appendChild(path);

        const memo = document.createElement("span");
        memo.className = "folder-path";
        memo.innerText = result.memo.slice(0, 120);
        item.appendChild(memo);

        item.onclick = ()=>{
            openMachineSearchResult(result);
        };

        container.appendChild(item);
    });
}

function getEvidenceCollection(machine, collectionKey){
    const safeKey = collectionKey === "adminEvidencePhotos"
        ? "adminEvidencePhotos"
        : "evidencePhotos";

    if(!machine || typeof machine !== "object"){
        return [];
    }

    if(!Array.isArray(machine[safeKey])){
        machine[safeKey] = [];
    }

    return machine[safeKey];
}

function hasTimelineSnapshotContent(snapshot){
    return Boolean(
        snapshot &&
        (
            snapshot.photo ||
            String(snapshot.memo || "").trim() ||
            String(snapshot.adminMemo || "").trim()
        )
    );
}

function createMachineTimelineSnapshot(machine, reason = ""){
    const auditUser = getCurrentAuditUser();

    return {
        id:createTimelineId(),
        photo:machine.photo || "",
        photoUpdatedAt:machine.photoUpdatedAt || "",
        photoUpdatedByName:machine.photoUpdatedByName || "",
        memo:machine.memo || "",
        memoUpdatedAt:machine.memoUpdatedAt || "",
        memoUpdatedByName:machine.memoUpdatedByName || "",
        adminMemo:machine.adminMemo || "",
        adminMemoUpdatedAt:machine.adminMemoUpdatedAt || "",
        adminMemoUpdatedByName:machine.adminMemoUpdatedByName || "",
        createdAt:getTimelineEntryPrimaryTime(machine) || new Date().toISOString(),
        archivedAt:new Date().toISOString(),
        createdBy:auditUser.id,
        createdByName:auditUser.name,
        reason:reason || "기록"
    };
}

function getTimelineEntryPrimaryTime(entry){
    const candidates = [
        entry && entry.photoUpdatedAt,
        entry && entry.memoUpdatedAt,
        entry && entry.adminMemoUpdatedAt,
        entry && entry.createdAt
    ]
    .map((value)=>new Date(value || "").getTime())
    .filter((time)=>Number.isFinite(time));

    if(candidates.length === 0){
        return "";
    }

    return new Date(Math.max(...candidates)).toISOString();
}

function getTimelineEntryTimeText(entry){
    const parts = [];

    if(entry.photoUpdatedAt){
        parts.push(
            "사진: " +
            formatActionTime(entry.photoUpdatedAt) +
            (entry.photoUpdatedByName ? " / " + entry.photoUpdatedByName : "")
        );
    }

    if(entry.memoUpdatedAt){
        parts.push(
            "메모: " +
            formatActionTime(entry.memoUpdatedAt) +
            (entry.memoUpdatedByName ? " / " + entry.memoUpdatedByName : "")
        );
    }

    if(canViewAdminOnlyItems() && entry.adminMemoUpdatedAt){
        parts.push(
            "관리자 메모: " +
            formatActionTime(entry.adminMemoUpdatedAt) +
            (entry.adminMemoUpdatedByName ? " / " + entry.adminMemoUpdatedByName : "")
        );
    }

    if(parts.length === 0){
        parts.push(formatActionTime(entry.createdAt) || "시간 없음");
    }

    return parts.join("\n");
}

function isSameTimelineSnapshot(a, b){
    return Boolean(
        a &&
        b &&
        (a.photo || "") === (b.photo || "") &&
        (a.memo || "") === (b.memo || "") &&
        (a.adminMemo || "") === (b.adminMemo || "")
    );
}

function addMachineTimelineSnapshot(machine, reason = ""){
    if(!machine || typeof machine !== "object"){
        return false;
    }

    if(!Array.isArray(machine.timeline)){
        machine.timeline = [];
    }

    const snapshot = createMachineTimelineSnapshot(machine, reason);

    if(!hasTimelineSnapshotContent(snapshot)){
        return false;
    }

    const lastSnapshot = machine.timeline[0];

    if(isSameTimelineSnapshot(lastSnapshot, snapshot)){
        return false;
    }

    machine.timeline.unshift(snapshot);
    machine.timeline = machine.timeline.slice(0, TIMELINE_LIMIT);
    return true;
}

function deleteMachineTimelineEntry(machine, entryId){
    if(!requireStoreEdit()){
        return;
    }

    if(!machine || !Array.isArray(machine.timeline)){
        return;
    }

    if(!confirm("이 타임라인 기록을 삭제할까요?")){
        return;
    }

    machine.timeline = machine.timeline.filter((entry)=>entry && entry.id !== entryId);

    saveData(()=>{
        closeTimelineModal();
        render(false);

        const latestMachine =
            data.machines[currentGenre] &&
            data.machines[currentGenre][currentMachine];

        if(latestMachine){
            openMachineTimelineModal(latestMachine);
        }
    });
}

    const guide = document.createElement("p");
    guide.className = "timeline-guide";
    guide.innerText = "삭제하지 않으면 기간 제한 없이 보관되며, 정답지마다 최근 " + TIMELINE_LIMIT + "개까지 유지됩니다.";
    section.appendChild(guide);

    const list = document.createElement("div");
    list.className = "timeline-list";

        empty.innerText = "아직 기록 없음";
        list.appendChild(empty);
    }else{

        .slice()
        .sort((a,b)=>{
            const bTime = new Date(getTimelineEntryPrimaryTime(b) || 0).getTime();
            const aTime = new Date(getTimelineEntryPrimaryTime(a) || 0).getTime();
            return bTime - aTime;
        })
        .forEach((entry)=>{

                img.alt = "타임라인 사진";
                img.onclick = ()=>openModal(entry.photo);
                img.onerror = ()=>{
                    photo.innerHTML = "";
                    const emptyPhoto = document.createElement("div");
                    emptyPhoto.className = "timeline-empty-photo";
                    emptyPhoto.innerText = "사진 없음";
                    photo.appendChild(emptyPhoto);

                const emptyPhoto = document.createElement("div");
                emptyPhoto.className = "timeline-empty-photo";
                emptyPhoto.innerText = "사진 없음";
                photo.appendChild(emptyPhoto);
            }

            const content = document.createElement("div");
            content.className = "timeline-content";

            const time = document.createElement("div");
            time.className = "timeline-time";
            time.innerText = (entry.reason ? entry.reason + " · " : "") +
                (formatActionTime(entry.createdAt) || "시간 없음") +
                (entry.createdByName ? " / " + entry.createdByName : "");

            content.appendChild(time);

            const memo = document.createElement("p");
            memo.className = "timeline-memo";
            memo.innerText = entry.memo || "공개 메모 없음";
            content.appendChild(memo);

                const adminMemo = document.createElement("p");
                adminMemo.className = "timeline-memo timeline-admin-memo";
                adminMemo.innerText = entry.adminMemo;
                content.appendChild(adminMemo);
            }

            if(canEditCurrentStore()){
                const actions = document.createElement("div");
                actions.className = "timeline-item-actions";

                const deleteButton = createButton("timeline-delete", "삭제", ()=>{
                    deleteMachineTimelineEntry(machine, entry.id);
                });

                actions.appendChild(deleteButton);
                content.appendChild(actions);
            }

            item.appendChild(photo);

        });

function renderTrash(root){
    const now = Date.now();

    const title = document.createElement("h2");
    title.innerText = "🗑️ 휴지통";
    root.appendChild(title);

    const guide = document.createElement("p");
    guide.className = "sub-text";
    guide.innerText = "30일 후 자동 삭제";
    root.appendChild(guide);

    if(!data.trash || data.trash.length === 0){
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.innerText = "휴지통 비어있음";
        root.appendChild(empty);
    }else{
        const trashContainer = document.createElement("div");

        if(canEditCurrentStore()){
            const bulkActions = document.createElement("div");
            bulkActions.className = "trash-bulk-actions";

            bulkActions.appendChild(createAdminButton("선택 복구", ()=>{
                restoreSelectedTrashItems(false);
            }));

            bulkActions.appendChild(createAdminButton("전체 복구", ()=>{
                restoreSelectedTrashItems(true);
            }));

            const selectedDeleteButton = createAdminButton("선택 영구삭제", ()=>{
                deleteSelectedTrashItems(false);
            });
            selectedDeleteButton.style.background = "#d9534f";
            selectedDeleteButton.style.color = "white";
            bulkActions.appendChild(selectedDeleteButton);

            const allDeleteButton = createAdminButton("전체 영구삭제", ()=>{
                deleteSelectedTrashItems(true);
            });
            allDeleteButton.style.background = "#b52b27";
            allDeleteButton.style.color = "white";
            bulkActions.appendChild(allDeleteButton);

            root.appendChild(bulkActions);
        }

        data.trash.forEach((item, index)=>{
            const deletedTime = new Date(item.deletedAt).getTime();
            const daysLeft = Math.max(0, Math.ceil((TRASH_LIMIT_MS - (now - deletedTime)) / (24 * 60 * 60 * 1000)));

            let itemType = "📸 사진";

            if(item.type === "genre"){
                itemType = "📁 폴더";
            }else if(item.type === "machine"){
                itemType = "🤖 기계";
            }

            const trashItem = document.createElement("div");
            trashItem.className = "trash-item";

            const selectWrap = document.createElement("label");
            selectWrap.className = "trash-select";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "trash-check";
            checkbox.value = String(index);

            const info = document.createElement("div");

            const itemTitle = document.createElement("div");
            itemTitle.className = "trash-title";
            itemTitle.innerText = itemType + " - " + (item.name || "");

            const date = document.createElement("div");
            date.className = "trash-date";
            date.innerText = "삭제: " + new Date(item.deletedAt).toLocaleString("ko-KR");

            const dday = document.createElement("div");
            dday.className = "trash-dday";
            dday.innerText = daysLeft + "일 후 자동 삭제";

            info.appendChild(itemTitle);
            info.appendChild(date);
            info.appendChild(dday);
            selectWrap.appendChild(checkbox);
            selectWrap.appendChild(info);

            const buttons = document.createElement("div");
            buttons.className = "trash-buttons";

            buttons.appendChild(createAdminButton("복구", ()=>{
                restoreTrashItem(index);
            }));

            const deleteButton = createAdminButton("영구삭제", ()=>{
                deleteTrashItem(index);
            });
            deleteButton.style.background = "#d9534f";
            deleteButton.style.color = "white";
            buttons.appendChild(deleteButton);

            if(canEditCurrentStore()){
                trashItem.appendChild(selectWrap);
            }else{
                trashItem.appendChild(info);
            }
            if(canEditCurrentStore()){
                trashItem.appendChild(buttons);
            }
            trashContainer.appendChild(trashItem);
        });

        root.appendChild(trashContainer);
    }

    root.appendChild(createButton("btn-back", "뒤로가기", ()=>{
        history.back();
    }));
}

function createFigureCatalogId(){
    return "figure_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2, 8);
}

function getFigureEntry(entryId){
    return (appData.figureCatalog || []).find((entry)=>entry.id === entryId) || null;
}

function updateFigureEntryAudit(entry){
    const auditUser = getCurrentAuditUser();

    entry.updatedAt = new Date().toISOString();
    entry.updatedBy = auditUser.id;
    entry.updatedByName = auditUser.name;
    entry.updatedRole = getCurrentUserRole().role || "";
    entry.updatedStoreId = currentStoreId;
    entry.updatedStoreName = getCurrentStoreName();
}

function getFigureSearchText(entry){
    return [
        entry.name,
        entry.nw,
        entry.gw,
        entry.code,
        entry.extraKeywords,
        entry.keywords,
        entry.memo,
        entry.updatedStoreName
    ].join(" ");
}

function getFigureAuditText(entry){
    if(!entry.updatedAt){
        return "수정 기록 없음";
    }

    return formatActionTime(entry.updatedAt) +
        " / " +
        (entry.updatedByName || entry.updatedBy || "unknown") +
        " / " +
        (entry.updatedStoreName || entry.updatedStoreId || "지점 없음");
}

function figureEntryMatches(entry, query){
    const keyword = normalizeLoginId(query).replace(/_/g, "");

    if(!keyword){
        return true;
    }

    const target = normalizeLoginId([
        getFigureSearchText(entry)
    ].join(" ")).replace(/_/g, "");

    return target.includes(keyword);
}

function renderFigureImageBox(label, src){
    const box = document.createElement("div");
    box.className = "figure-image-box";

    const tag = document.createElement("span");
    tag.className = "figure-image-label";
    tag.innerText = label;
    box.appendChild(tag);

    if(src){
        const img = document.createElement("img");
        img.src = src;
        img.alt = label;
        img.onclick = ()=>openModal(src);
        box.appendChild(img);
    }else{
        const empty = document.createElement("p");
        empty.innerText = "사진 없음";
        box.appendChild(empty);
    }

    return box;
}

function renderFigureCatalogResults(container, emptyMessage, query){
    container.innerHTML = "";

    const entries = (appData.figureCatalog || [])
    .filter((entry)=>figureEntryMatches(entry, query))
    .sort((a,b)=>String(a.name || "").localeCompare(String(b.name || ""), "ko-KR"));

    emptyMessage.style.display = entries.length === 0 ? "block" : "none";

    entries.forEach((entry)=>{
        container.appendChild(createFigureCatalogCard(entry));
    });
}

function getBoardCategories(){
    if(!Array.isArray(appData.boardCategories) || appData.boardCategories.length === 0){
        appData.boardCategories = [
            {
                id:"notice",
                name:"공지",
                locked:true
            },
            {
                id:"daily",
                name:"일일공지",
                locked:true
            }
        ];
    }

    return appData.boardCategories;
}

function getBoardCategory(categoryId){
    return getBoardCategories().find((category)=>category.id === categoryId) || getBoardCategories()[0];
}

function hasBoardCategory(categoryId){
    return getBoardCategories().some((category)=>category.id === categoryId);
}

function getBoardCategoryLabel(category){
    const item = getBoardCategory(category);
    return item ? item.name : "공지";
}

function createBoardCategoryId(){
    return "board_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2, 7);
}

function normalizeCurrentBoardCategory(){
    const categories = getBoardCategories();

    if(!categories.some((category)=>category.id === boardCategory)){
        boardCategory = categories[0] ? categories[0].id : "notice";
        localStorage.setItem("boardCategory", boardCategory);
    }
}

function getBoardScopeLabel(post){
    return post.scope === "all"
        ? "전지점"
        : (appData.storeNames[post.storeId] || getCurrentStoreName());
}

function canWriteBoard(){
    return canEditCurrentStore();
}

function canEditBoardPost(post){
    if(isGameMaster()){
        return true;
    }

    return canEditCurrentStore() &&
        post.scope !== "all" &&
        (!post.storeId || post.storeId === currentStoreId);
}

function getBoardPost(postId){
    return (appData.boardPosts || []).find((item)=>item.id === postId) || null;
}

function getVisibleBoardPosts(){
    normalizeCurrentBoardCategory();

    return (appData.boardPosts || [])
    .filter((post)=>{
        if(post.category !== boardCategory){
            return false;
        }

        if(post.adminOnly && !canViewAdminOnlyItems()){
            return false;
        }

        return post.scope === "all" || post.storeId === currentStoreId;
    })
    .sort((a,b)=>{
        return new Date(b.updatedAt || b.createdAt).getTime() -
            new Date(a.updatedAt || a.createdAt).getTime();
    });
}

function addBoardCategory(){
    if(!canWriteBoard()){
        return;
    }

    let name = prompt("새 게시판 카테고리 이름을 입력하세요.");

    if(name === null){
        return;
    }

    name = sanitizeText(name);

    if(!name){
        alert("카테고리 이름을 입력하세요.");
        return;
    }

    const exists = getBoardCategories().some((category)=>category.name === name);

    if(exists){
        alert("이미 있는 카테고리입니다.");
        return;
    }

    const category = {
        id:createBoardCategoryId(),
        name:name,
        locked:false
    };

    appData.boardCategories.push(category);
    boardCategory = category.id;
    localStorage.setItem("boardCategory", boardCategory);
    saveData(()=>render(false));
}

function renameBoardCategory(){
    if(!canWriteBoard()){
        return;
    }

    const category = getBoardCategory(boardCategory);

    if(!category){
        return;
    }

    let name = prompt("카테고리 이름 수정", category.name);

    if(name === null){
        return;
    }

    name = sanitizeText(name);

    if(!name){
        alert("카테고리 이름을 입력하세요.");
        return;
    }

    category.name = name;
    saveData(()=>render(false));
}

function deleteBoardCategory(){
    if(!canWriteBoard()){
        return;
    }

    const category = getBoardCategory(boardCategory);

    if(!category || category.locked){
        alert("기본 카테고리는 삭제할 수 없습니다.");
        return;
    }

    if(!confirm(category.name + " 카테고리를 삭제할까요?\n이 카테고리의 글은 공지로 이동됩니다.")){
        return;
    }

    appData.boardPosts.forEach((post)=>{
        if(post.category === category.id){
            post.category = "notice";
        }
    });

    appData.boardCategories = getBoardCategories().filter((item)=>item.id !== category.id);
    boardCategory = "notice";
    localStorage.setItem("boardCategory", boardCategory);
    saveData(()=>render(false));
}

function getBoardPostImages(post){

function createBoardImageGrid(images){

function createBoardComposer(post = null){
    const form = document.createElement("div");
    form.className = "board-composer";

    const row = document.createElement("div");
    row.className = "board-composer-row";

    const category = document.createElement("select");
    category.innerHTML = getBoardCategories()
    .map((item)=>`<option value="${item.id}">${item.name}</option>`)
    .join("");
    category.value = post ? post.category : boardCategory;

    const scope = document.createElement("select");
    scope.innerHTML = `
        <option value="store">현재 지점</option>
        <option value="all">전지점</option>
    `;
    scope.value = post ? post.scope : (isGameMaster() ? "all" : "store");
    scope.disabled = !isGameMaster();

    row.appendChild(category);
    row.appendChild(scope);

    const adminOnlyLabel = document.createElement("label");
    adminOnlyLabel.className = "board-admin-option";

    const adminOnlyInput = document.createElement("input");
    adminOnlyInput.type = "checkbox";
    adminOnlyInput.checked = post ? post.adminOnly === true : false;

    const adminOnlyText = document.createElement("span");
    adminOnlyText.innerText = "관리자만 보기";

    adminOnlyLabel.appendChild(adminOnlyInput);
    adminOnlyLabel.appendChild(adminOnlyText);

    const title = document.createElement("input");
    title.type = "text";
    title.placeholder = "제목";
    title.value = post ? post.title : "";

    const body = document.createElement("textarea");
    body.placeholder = getBoardCategoryLabel(category.value) === "일일공지"
        ? "오늘 처리할 일, 전달사항, 마감 전 확인할 내용을 적어주세요."
        : "중요한 룰, 고정 공지, 운영 기준을 적어주세요.";
    body.value = post ? post.body : "";

    const attachmentTools = document.createElement("div");
    attachmentTools.className = "board-attachment-tools";

    const existingImages = getBoardPostImages(post).map((image)=>({...image}));
    const attachmentList = document.createElement("div");
    attachmentList.className = "board-attachment-list";

    const renderAttachments = ()=>{
        attachmentList.innerHTML = "";

        existingImages.forEach((image, index)=>{
            const item = document.createElement("div");
            item.className = "board-attachment-item";

            const img = document.createElement("img");
            img.src = image.url;
            img.alt = "첨부 이미지";
            img.onclick = ()=>openModal(image.url);

            const remove = createButton("", "×", ()=>{
                existingImages.splice(index, 1);
                renderAttachments();
            });

            item.appendChild(img);
            item.appendChild(remove);
            attachmentList.appendChild(item);
        });
    };

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.multiple = true;

    attachmentTools.appendChild(fileInput);
    attachmentTools.appendChild(attachmentList);
    renderAttachments();

    category.onchange = ()=>{
        body.placeholder = getBoardCategoryLabel(category.value) === "일일공지"
            ? "오늘 처리할 일, 전달사항, 마감 전 확인할 내용을 적어주세요."
            : "중요한 룰, 고정 공지, 운영 기준을 적어주세요.";
    };

    const saveButton = createButton("btn-save", post ? "게시글 저장" : "게시글 등록", async()=>{
        const nextTitle = sanitizeText(title.value);
        const nextBody = String(body.value || "").trim();

        if(!nextTitle){
            alert("제목을 입력하세요.");
            return;
        }

        if(!nextBody){
            alert("내용을 입력하세요.");
            return;
        }

        await saveBoardPost({
            post,
            category:category.value,
            scope:scope.value,
            adminOnly:canViewAdminOnlyItems() && adminOnlyInput.checked,
            title:nextTitle,
            body:nextBody,
            existingImages,
            files:Array.from(fileInput.files || [])
        });
    });

    form.appendChild(row);
    if(canViewAdminOnlyItems()){
        form.appendChild(adminOnlyLabel);
    }
    form.appendChild(title);
    form.appendChild(body);
    form.appendChild(attachmentTools);
    form.appendChild(saveButton);

    return form;
}

async function saveBoardPost(values){
    if(!canWriteBoard()){
        alert("게시글 작성 권한이 없습니다.");
        return;
    }

    const now = new Date().toISOString();
    const account = getCurrentAccount();
    const auditUser = getCurrentAuditUser();
    const scope = isGameMaster() && values.scope === "all" ? "all" : "store";
    const storeId = scope === "all" ? "" : currentStoreId;
    const images = (values.existingImages || []).filter((image)=>image && image.url);
    const files = values.files || [];
    let interval = null;

    try{
        if(files.length > 0){
            interval = showLoading("게시글 이미지 업로드 중... 0%");

            for(let i = 0; i < files.length; i++){
                const url = await compressAndUploadImage(files[i], "board");
                images.push({
                    url,
                    createdAt:new Date().toISOString()
                });

                const percent = Math.round(((i + 1) / files.length) * 100);
                document.getElementById("progress-fill").style.width = percent + "%";
                document.getElementById("loading-text").innerText =
                    "게시글 이미지 업로드 중... " + percent + "%";
            }
        }

        if(values.post){
            if(!canEditBoardPost(values.post)){
                alert("게시글 수정 권한이 없습니다.");
                return;
            }

            values.post.category = hasBoardCategory(values.category) ? values.category : "notice";
            values.post.scope = scope;
            values.post.storeId = storeId;
            values.post.adminOnly = values.adminOnly === true;
            values.post.title = values.title;
            values.post.body = values.body;
            values.post.images = images;
            values.post.updatedAt = now;
            values.post.updatedBy = auditUser.id;
            values.post.updatedByName = auditUser.name;
            currentBoardPostId = values.post.id;
        }else{
            const post = {
                id:createBoardPostId(),
                category:hasBoardCategory(values.category) ? values.category : "notice",
                scope:scope,
                storeId:storeId,
                adminOnly:values.adminOnly === true,
                title:values.title,
                body:values.body,
                images,
                createdAt:now,
                updatedAt:now,
                authorId:auditUser.id || (account && account.loginId) || "unknown",
                authorName:auditUser.name,
                updatedBy:auditUser.id,
                updatedByName:auditUser.name,
                authorRole:getCurrentUserRole().role || "",
                authorStoreId:currentStoreId,
                authorStoreName:getCurrentStoreName()
            };

            appData.boardPosts.push(post);
            currentBoardPostId = post.id;
        }

        boardCategory = hasBoardCategory(values.category) ? values.category : "notice";
        localStorage.setItem("boardCategory", boardCategory);
        currentView = "boardDetail";

        await saveData(()=>render(false));
    }catch(err){
        console.error(err);
        alert("게시글 저장 실패: " + err.message);
    }finally{
        if(interval){
            hideLoading(interval);
        }
    }
}

function createBuildItemId(){
    return "build_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2, 8);
}

function getCurrentBuildBoard(){
    if(!appData.buildBoards || typeof appData.buildBoards !== "object"){
        appData.buildBoards = {};
    }

    if(!appData.buildBoards[currentStoreId] || typeof appData.buildBoards[currentStoreId] !== "object"){
        appData.buildBoards[currentStoreId] = {
            width:2400,
            height:1600,
            items:[],
            strokes:[],
            updatedAt:"",
            updatedByName:""
        };
    }

    const board = appData.buildBoards[currentStoreId];

    board.width = Number(board.width) || 2400;
    board.height = Number(board.height) || 1600;

    if(!Array.isArray(board.sheets) || board.sheets.length === 0){
        board.sheets = [{
            id:createBuildSheetId(),
            name:"시트1",
            items:Array.isArray(board.items) ? board.items : [],
            strokes:Array.isArray(board.strokes) ? board.strokes : []
        }];
    }

    board.sheets.forEach((sheet, index)=>{
        if(!sheet.id){
            sheet.id = createBuildSheetId();
        }

        if(!sheet.name){
            sheet.name = "시트" + (index + 1);
        }

        if(!Array.isArray(sheet.items)){
            sheet.items = [];
        }

        if(!Array.isArray(sheet.strokes)){
            sheet.strokes = [];
        }
    });

    if(!board.activeSheetId || !board.sheets.some((sheet)=>sheet.id === board.activeSheetId)){
        board.activeSheetId = board.sheets[0].id;
    }

    const activeSheet = getCurrentBuildSheet(board);
    board.items = activeSheet.items;
    board.strokes = activeSheet.strokes;

    board.items.forEach((item, index)=>{
        if(!Number.isFinite(Number(item.z))){
            item.z = index + 1;
        }

        if(typeof item.id !== "string" || !item.id){
            item.id = createBuildItemId();
        }

        if(typeof item.type !== "string" || !item.type){
            item.type = "folder";
        }

        if(item.type === "shape" && typeof item.shape !== "string"){
            item.shape = "rect";
        }

        [
            "genre",
            "groupId",
            "machine",
            "text",
            "photo",
            "color",
            "createdAt",
            "createdByName",
            "updatedAt",
            "updatedByName"
        ].forEach((key)=>{
            if(typeof item[key] !== "string"){
                item[key] = "";
            }
        });

        if(!["left", "center", "right"].includes(item.textAlign)){
            item.textAlign = "";
        }

        if(!["top", "middle", "bottom"].includes(item.textVAlign)){
            item.textVAlign = "";
        }

        item.x = Number.isFinite(Number(item.x)) ? Number(item.x) : 0;
        item.y = Number.isFinite(Number(item.y)) ? Number(item.y) : 0;
        item.w = Number.isFinite(Number(item.w)) ? Number(item.w) : 150;
        item.h = Number.isFinite(Number(item.h)) ? Number(item.h) : 58;
        item.rotation = Number.isFinite(Number(item.rotation)) ? Number(item.rotation) : 0;
        item.lineX1 = Number.isFinite(Number(item.lineX1)) ? Number(item.lineX1) : 0;
        item.lineY1 = Number.isFinite(Number(item.lineY1)) ? Number(item.lineY1) : Math.max(1, item.h / 2);
        item.lineX2 = Number.isFinite(Number(item.lineX2)) ? Number(item.lineX2) : item.w;
        item.lineY2 = Number.isFinite(Number(item.lineY2)) ? Number(item.lineY2) : Math.max(1, item.h / 2);
        item.outlineOnly = item.outlineOnly === true;
    });

    ensureBuildHistoryBaseline(board);

    return board;
}

function getBuildHistoryKey(){
    return currentStoreId || "default";
}

function cloneBuildBoardSnapshot(board){
    const source = board || getCurrentBuildBoard();
    const snapshot = {
        width:Number(source.width) || 2400,
        height:Number(source.height) || 1600,
        activeSheetId:source.activeSheetId || "",
        sheets:JSON.parse(JSON.stringify(source.sheets || [])),
        updatedAt:source.updatedAt || "",
        updatedBy:source.updatedBy || "",
        updatedByName:source.updatedByName || ""
    };

    return snapshot;
}

function serializeBuildSnapshot(snapshot){
    return JSON.stringify(snapshot || {});
}

function ensureBuildHistoryBaseline(board){
    const key = getBuildHistoryKey();

    if(!buildHistoryBaselines[key]){
        buildHistoryBaselines[key] = cloneBuildBoardSnapshot(board);
    }
}

function pushBuildHistoryBeforeSave(board){
    if(buildHistoryApplying){
        return;
    }

    const key = getBuildHistoryKey();
    const currentSnapshot = cloneBuildBoardSnapshot(board);
    const previousSnapshot = buildHistoryBaselines[key] || currentSnapshot;

    if(serializeBuildSnapshot(previousSnapshot) === serializeBuildSnapshot(currentSnapshot)){
        return;
    }

    if(!buildUndoStacks[key]){
        buildUndoStacks[key] = [];
    }

    buildUndoStacks[key].push(previousSnapshot);

    if(buildUndoStacks[key].length > 60){
        buildUndoStacks[key].shift();
    }

    buildRedoStacks[key] = [];
}

function setBuildHistoryBaseline(board){
    buildHistoryBaselines[getBuildHistoryKey()] = cloneBuildBoardSnapshot(board);
    updateBuildHistoryButtons();
}

function restoreBuildBoardSnapshot(snapshot){
    if(!snapshot){
        return null;
    }

    if(!appData.buildBoards || typeof appData.buildBoards !== "object"){
        appData.buildBoards = {};
    }

    appData.buildBoards[currentStoreId] = JSON.parse(JSON.stringify(snapshot));
    buildSelectedItemId = "";
    buildPendingTextEditItemId = "";
    buildCreateTool = null;
    buildCreating = false;
    clearBuildCreatePreview();

    return getCurrentBuildBoard();
}

function updateBuildHistoryButtons(){
    const key = getBuildHistoryKey();
    const undoButton = document.getElementById("build-undo-button");
    const redoButton = document.getElementById("build-redo-button");

    if(undoButton){
        undoButton.disabled = !buildUndoStacks[key] || buildUndoStacks[key].length === 0;
    }

    if(redoButton){
        redoButton.disabled = !buildRedoStacks[key] || buildRedoStacks[key].length === 0;
    }
}

function undoBuildBoard(){
    if(!requireStoreEdit()){
        return;
    }

    const key = getBuildHistoryKey();
    const undoStack = buildUndoStacks[key] || [];

    if(undoStack.length === 0){
        alert("되돌릴 작업이 없습니다.");
        return;
    }

    const currentSnapshot = cloneBuildBoardSnapshot(getCurrentBuildBoard());
    const previousSnapshot = undoStack.pop();

    if(!buildRedoStacks[key]){
        buildRedoStacks[key] = [];
    }

    buildRedoStacks[key].push(currentSnapshot);
    buildHistoryApplying = true;
    const board = restoreBuildBoardSnapshot(previousSnapshot);

    saveBuildBoard(()=>{
        buildHistoryApplying = false;
        setBuildHistoryBaseline(board);
        render(false);
    });
}

function redoBuildBoard(){
    if(!requireStoreEdit()){
        return;
    }

    const key = getBuildHistoryKey();
    const redoStack = buildRedoStacks[key] || [];

    if(redoStack.length === 0){
        alert("앞으로 되돌릴 작업이 없습니다.");
        return;
    }

    const currentSnapshot = cloneBuildBoardSnapshot(getCurrentBuildBoard());
    const nextSnapshot = redoStack.pop();

    if(!buildUndoStacks[key]){
        buildUndoStacks[key] = [];
    }

    buildUndoStacks[key].push(currentSnapshot);
    buildHistoryApplying = true;
    const board = restoreBuildBoardSnapshot(nextSnapshot);

    saveBuildBoard(()=>{
        buildHistoryApplying = false;
        setBuildHistoryBaseline(board);
        render(false);
    });
}

function isBuildTextInputTarget(target){
    if(!target){
        return false;
    }

    const tagName = target.tagName ? target.tagName.toLowerCase() : "";

    return tagName === "input" ||
        tagName === "textarea" ||
        tagName === "select" ||
        target.isContentEditable ||
        !!target.closest(".build-item-text.editing");

function handleBuildUndoRedoShortcut(event){
    if(event.defaultPrevented){
        return false;
    }

    if(currentView !== "build"){
        return false;
    }

    if(!(event.ctrlKey || event.metaKey)){
        return false;
    }

    if(isBuildTextInputTarget(event.target)){
        return false;
    }

    const key = event.key.toLowerCase();

    if(event.shiftKey && key === "z"){
        event.preventDefault();
        redoBuildBoard();
        return true;
    }

    if(key === "z"){
        event.preventDefault();
        undoBuildBoard();
        return true;
    }

    if(key === "y"){
        event.preventDefault();
        redoBuildBoard();
        return true;
    }

    return false;
}

function getBuildPoint(event, canvas){
    const rect = canvas.getBoundingClientRect();

    return {
        x:Math.max(0, Math.min(canvas.offsetWidth, (event.clientX - rect.left) / buildZoom)),
        y:Math.max(0, Math.min(canvas.offsetHeight, (event.clientY - rect.top) / buildZoom))
    };
}

function applyBuildTransform(){
    const canvas = document.getElementById("build-canvas");
    const label = document.getElementById("build-zoom-label");

    if(canvas){
        canvas.style.transform =
            "translate(" + buildPanX + "px, " + buildPanY + "px) scale(" + buildZoom + ")";
    }

    if(label){
        label.innerText = Math.round(buildZoom * 100) + "%";
    }
}

function zoomBuildView(nextZoom, centerX, centerY){
    const viewport = document.getElementById("build-viewport");
    const oldZoom = buildZoom;
    const clampedZoom = Math.max(0.15, Math.min(2.5, nextZoom));

    if(!viewport || clampedZoom === oldZoom){
        buildZoom = clampedZoom;
        applyBuildTransform();
        return;
    }

    const rect = viewport.getBoundingClientRect();
    const viewportX = centerX - rect.left;
    const viewportY = centerY - rect.top;
    const boardX = (viewportX - buildPanX) / oldZoom;
    const boardY = (viewportY - buildPanY) / oldZoom;

    buildZoom = clampedZoom;
    buildPanX = viewportX - boardX * buildZoom;
    buildPanY = viewportY - boardY * buildZoom;
    applyBuildTransform();
}

function fitBuildView(){
    const viewport = document.getElementById("build-viewport");
    const board = getCurrentBuildBoard();

    if(!viewport){
        return;
    }

    const fitX = (viewport.clientWidth - 80) / board.width;
    const fitY = (viewport.clientHeight - 80) / board.height;

    buildZoom = Math.max(0.15, Math.min(1, fitX, fitY));
    buildPanX = Math.max(30, (viewport.clientWidth - board.width * buildZoom) / 2);
    buildPanY = Math.max(30, (viewport.clientHeight - board.height * buildZoom) / 2);
    applyBuildTransform();
}

function resetBuildView(){
    buildZoom = 1;
    buildPanX = 40;
    buildPanY = 40;
    applyBuildTransform();
}

    if(canvas){
        canvas.classList.toggle("draw-mode", buildMode === "draw");
        canvas.classList.toggle("edit-mode", buildMode === "edit");
    }

    if(viewBtn){
        viewBtn.classList.toggle("active", buildMode === "view");
    }

    if(editBtn){

function renderBuildStrokes(svg, board){
    svg.innerHTML = "";

    board.strokes.forEach((stroke)=>{
        if(!stroke || !Array.isArray(stroke.points) || stroke.points.length === 0){
            return;
        }

        const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        polyline.setAttribute("points", stroke.points.map((point)=>point.x + "," + point.y).join(" "));
        polyline.setAttribute("fill", "none");
        polyline.setAttribute("stroke", stroke.color || "#ff2d2d");
        polyline.setAttribute("stroke-width", String(Number(stroke.size) || 6));
        polyline.setAttribute("stroke-opacity", String(Number(stroke.opacity) || 1));
        polyline.setAttribute("stroke-linecap", "round");
        polyline.setAttribute("stroke-linejoin", "round");
        svg.appendChild(polyline);
    });
}

function getBuildDrawCursor(canvas){
    if(!canvas){
        return null;
    }

    let cursor = canvas.querySelector(".build-draw-cursor");

    if(!cursor){
        cursor = document.createElement("div");
        cursor.className = "build-draw-cursor";
        canvas.appendChild(cursor);
    }

    return cursor;
}

function updateBuildDrawCursor(event, canvas){
    if(!canvas || buildMode !== "draw" || !event){
        return;
    }

    const cursor = getBuildDrawCursor(canvas);
    const point = getBuildPoint(event, canvas);
    const size = Math.max(1, Number(buildDrawSize) || 1);

    if(!cursor){
        return;
    }

    cursor.style.width = size + "px";
    cursor.style.height = size + "px";
    cursor.style.left = (point.x - size / 2) + "px";
    cursor.style.top = (point.y - size / 2) + "px";
    cursor.classList.toggle("eraser", buildDrawColor === "#fffdf7");
    cursor.style.display = "block";
}

function hideBuildDrawCursor(canvas){
    const targetCanvas = canvas || document.getElementById("build-canvas");
    const cursor = targetCanvas ? targetCanvas.querySelector(".build-draw-cursor") : null;

    if(cursor){
        cursor.style.display = "none";
    }
}
