function getBuildLibraryRows(){
    const rows = [];
    const groupedGenres = getGroupedGenres();

    (data.genreGroups || [])
    .filter((group)=>canViewAdminOnlyItems() || !group.adminOnly)
    .forEach((group)=>{
        const key = "group:" + group.id;
        const isOpen = isBuildLibraryOpen(key);

        rows.push({
            kind:"group",
            key:key,
            open:isOpen,
            title:group.name,
            subText:(group.genres || []).length + "개 폴더",
            color:group.color || "#f0dcff",
            icon:isOpen ? "▾" : "▸",
            payload:{
                type:"group",
                groupId:group.id,
                text:group.name,
                color:group.color || "#f0dcff"
            }
        });

        if(isOpen){
            (group.genres || [])
            .filter((genre)=>data.genres.includes(genre))
            .filter((genre)=>canViewAdminOnlyItems() || !isAdminOnlyGenre(genre))
            .forEach((genre)=>{
                rows.push(createBuildFolderRow(genre, 1));
            });
        }
    });

    (data.genres || [])
    .filter((genre)=>!groupedGenres.has(genre))
    .filter((genre)=>canViewAdminOnlyItems() || !isAdminOnlyGenre(genre))
    .forEach((genre)=>{
        rows.push(createBuildFolderRow(genre, 0));
    });

    return rows;
}

function createBuildFolderRow(genre, depth){
    const machines = data.machines[genre] || {};
    const key = "folder:" + genre;
    const isOpen = isBuildLibraryOpen(key);

    const row = {
        kind:"folder",
        key:key,
        depth:depth || 0,
        open:isOpen,
        title:genre,
        subText:Object.keys(machines).length + "개 정답지",
        color:data.genreColors && data.genreColors[genre] ? data.genreColors[genre] : "#fff7c8",
        icon:isOpen ? "▾" : "▸",
        payload:{
            type:"folder",
            genre:genre,
            text:genre,
            color:data.genreColors && data.genreColors[genre] ? data.genreColors[genre] : "#fff7c8"
        },
        children:[]
    };

    if(isOpen){
        row.children = Object.keys(machines)
        .sort(naturalMachineCompare)
        .filter((machine)=>canViewAdminOnlyItems() || !isAdminOnlyMachine(machines[machine]))
        .map((machine)=>{
            const machineData = machines[machine] || {};

            return {
                kind:"machine",
                key:"machine:" + genre + ":" + machine,
                depth:(depth || 0) + 1,
                title:machine + "번",
                subText:genre,
                photo:machineData.photo || "",
                payload:{
                    type:"machine",
                    genre:genre,
                    machine:machine,
                    text:machine + "번",
                    photo:machineData.photo || "",
                    color:"#ffffff"
                }
            };
        });
    }

    return row;
}

function flattenBuildLibraryRows(rows){
    const flattened = [];

    const visit = (row)=>{
        flattened.push(row);

        if(Array.isArray(row.children)){
            row.children.forEach(visit);
        }
    };

    rows.forEach(visit);

    return flattened;
}

            w:40,
            h:18
        };
    }

    return {
        w:40,
        h:40
    };
}

function getBuildCreateDefault(tool){
    if(tool && tool.type === "text"){
        return {
            w:200,
            h:110
        };
    }

    if(tool && tool.shape === "line"){
        return {
            w:180,
            h:18
        };
    }

    return {
        w:160,
        h:120
    };
}

function getBuildCreateBox(startX, startY, endX, endY, tool){
    const min = getBuildCreateMinimum(tool);
    const fallback = getBuildCreateDefault(tool);

    if(tool && tool.shape === "line"){
        const rawDx = endX - startX;
        const rawDy = endY - startY;
        const isTiny = Math.abs(rawDx) < min.w && Math.abs(rawDy) < min.w;
        const finalEndX = isTiny ? startX + fallback.w : endX;
        const finalEndY = isTiny ? startY : endY;
        const padding = 10;
        const x = Math.min(startX, finalEndX) - padding;
        const y = Math.min(startY, finalEndY) - padding;
        const w = Math.max(min.w, Math.abs(finalEndX - startX) + padding * 2);
        const h = Math.max(18, Math.abs(finalEndY - startY) + padding * 2);

        return {
            x:Math.round(Math.max(0, x)),
            y:Math.round(Math.max(0, y)),
            w:Math.round(w),
            h:Math.round(h),
            lineX1:Math.round(startX - x),
            lineY1:Math.round(startY - y),
            lineX2:Math.round(finalEndX - x),
            lineY2:Math.round(finalEndY - y)
        };
    }

    let x = Math.min(startX, endX);
    let y = Math.min(startY, endY);
    let w = Math.abs(endX - startX);
    let h = Math.abs(endY - startY);

    if(w < min.w && h < min.h){
        x = startX;
        y = startY;
        w = fallback.w;
        h = fallback.h;
    }else{
        w = Math.max(min.w, w);
        h = Math.max(min.h, h);
    }

    return {
        x:Math.round(Math.max(0, x)),
        y:Math.round(Math.max(0, y)),
        w:Math.round(w),
        h:Math.round(h)
    };
}

function getBuildFavoriteColors(){
    try{
        const saved = JSON.parse(localStorage.getItem("buildFavoriteColors") || "[]");

        if(Array.isArray(saved) && saved.length){
            return saved.filter((color)=>/^#[0-9a-fA-F]{6}$/.test(color)).slice(0, 10);
        }
    }catch(err){
    }

    return ["#ff2d2d", "#1976d2", "#2e7d32", "#111111", "#ffd54f"];
}

function normalizeBuildColor(value){
    const text = String(value || "").trim();

    if(/^#[0-9a-fA-F]{6}$/.test(text)){
        return text;
    }

    const rgb = text.match(/^rgb\s*\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i);

    if(rgb){
        const parts = rgb.slice(1).map((part)=>Math.max(0, Math.min(255, Number(part) || 0)));
        return "#" + parts.map((part)=>part.toString(16).padStart(2, "0")).join("");
    }

    return "";
}

function rgbTextFromHex(color){
    const normalized = normalizeBuildColor(color);

    if(!normalized){
        return "";
    }

    const value = normalized.slice(1);
    return "rgb(" +
        parseInt(value.slice(0, 2), 16) + "," +
        parseInt(value.slice(2, 4), 16) + "," +
        parseInt(value.slice(4, 6), 16) + ")";
}

function saveBuildFavoriteColor(color){
    color = normalizeBuildColor(color);

    if(!color){
        return;
    }

    const colors = getBuildFavoriteColors().filter((item)=>item.toLowerCase() !== color.toLowerCase());
    colors.unshift(color);
    localStorage.setItem("buildFavoriteColors", JSON.stringify(colors.slice(0, 10)));
    render(false);
}

function resizeBuildItemFromHandle(item, el, direction, event){
    const dx = (event.clientX - buildResizeStartX) / buildZoom;
    const dy = (event.clientY - buildResizeStartY) / buildZoom;
    const minW = item.shape === "line" ? 40 : 80;
    const minH = item.shape === "line" ? 16 : 42;

    let nextX = buildResizeStartItemX;
    let nextY = buildResizeStartItemY;
    let nextW = buildResizeStartW;
    let nextH = buildResizeStartH;

    if(direction.includes("e")){
        nextW = buildResizeStartW + dx;
    }

    if(direction.includes("s")){
        nextH = buildResizeStartH + dy;
    }

    if(direction.includes("w")){
        nextW = buildResizeStartW - dx;
        nextX = buildResizeStartItemX + dx;

        if(nextW < minW){
            nextX -= minW - nextW;
            nextW = minW;
        }
    }

    if(direction.includes("n")){
        nextH = buildResizeStartH - dy;
        nextY = buildResizeStartItemY + dy;

        if(nextH < minH){
            nextY -= minH - nextH;
            nextH = minH;
        }
    }

    item.x = Math.round(Math.max(0, nextX));
    item.y = Math.round(Math.max(0, nextY));
    resizeBuildItem(item, el, nextW, nextH);
    el.style.left = item.x + "px";
    el.style.top = item.y + "px";
}

function getBuildTextAlign(item){
    if(item && ["left", "center", "right"].includes(item.textAlign)){
        return item.textAlign;
    }

    return item && item.type === "shape" ? "center" : "left";
}

function getBuildTextVAlign(item){
    if(item && ["top", "middle", "bottom"].includes(item.textVAlign)){
        return item.textVAlign;
    }

    return item && item.type === "shape" ? "middle" : "top";
}

function applyBuildTextLayout(item, textEl){
    if(!textEl){
        return;
    }

    const align = getBuildTextAlign(item);
    const valign = getBuildTextVAlign(item);
    const horizontalMap = {
        left:"flex-start",
        center:"center",
        right:"flex-end"
    };
    const verticalMap = {
        top:"flex-start",
        middle:"center",
        bottom:"flex-end"
    };

    textEl.style.textAlign = align;

    if(item && item.type === "shape"){
        textEl.style.justifyContent = verticalMap[valign] || "center";
        textEl.style.alignItems = horizontalMap[align] || "center";
    }else{
        textEl.style.justifyContent = verticalMap[valign] || "flex-start";
        textEl.style.alignItems = "stretch";
    }
}

function finishBuildTextEdit(saveNow=true){
    if(!buildActiveTextEdit){
        return;
    }

    const active = buildActiveTextEdit;
    buildActiveTextEdit = null;
    buildTextEditCanFinish = false;

    active.item.text = active.textEl.innerText;
    active.item.updatedAt = new Date().toISOString();
    active.item.updatedByName = getCurrentDisplayName();
    active.textEl.contentEditable = "false";
    active.textEl.classList.remove("editing");
    active.textEl.onkeydown = null;
    applyBuildTextLayout(active.item, active.textEl);

    if(saveNow){
        saveBuildBoard(()=>{});
    }
}

function setBuildTextAlign(item, textEl, align, valign=null){
    if(!requireStoreEdit()){
        return;
    }

    item.textAlign = align || getBuildTextAlign(item);

    if(valign){
        item.textVAlign = valign;
    }

    item.updatedAt = new Date().toISOString();
    item.updatedByName = getCurrentDisplayName();
    applyBuildTextLayout(item, textEl);
    saveBuildBoard(()=>{});
}

function startBuildTextEdit(item, textEl, force=false){
    if(!requireStoreEdit()){
        return;
    }

    if(buildMode !== "text" && !force){
        alert("텍스트를 수정하려면 텍스트 모드를 켜세요.");
        return;
    }

    finishBuildTextEdit(true);
    buildActiveTextEdit = {
        item,
        textEl
    };
    buildTextEditCanFinish = false;
    textEl.contentEditable = "true";
    textEl.classList.add("editing");
    applyBuildTextLayout(item, textEl);
    textEl.focus();

    const range = document.createRange();
    range.selectNodeContents(textEl);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);

    textEl.onkeydown = (event)=>{
        if(event.key === "Escape"){
            event.preventDefault();
            finishBuildTextEdit(true);
        }

        if((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s"){
            event.preventDefault();
            finishBuildTextEdit(true);
        }
    };

    setTimeout(()=>{
        buildTextEditCanFinish = true;
    }, 0);
}

function renderBuildItem(item, canvas){
    const el = document.createElement("div");
    el.className = [
        "build-item",
        item.type === "text" ? "text-item" : "",
        item.type === "machine" ? "machine-item" : "",
        item.type === "image" ? "image-item" : "",
        item.type === "shape" ? "shape-item" : "",
        item.type === "shape" && item.shape === "ellipse" ? "ellipse-shape" : "",
        item.type === "shape" && item.shape === "line" ? "line-shape" : "",
        item.type === "group" ? "group-item" : "",
        item.type === "folder" ? "folder-item" : ""
    ].filter(Boolean).join(" ");
    el.dataset.buildItemId = item.id;
    el.style.left = (Number(item.x) || 0) + "px";
    el.style.top = (Number(item.y) || 0) + "px";
    el.style.width = (Number(item.w) || 150) + "px";
    el.style.height = (Number(item.h) || 58) + "px";
    el.style.zIndex = String(2 + (Number(item.z) || 1));
    el.style.transform = "";
    el.style.transformOrigin = "";


    if(item.id === buildSelectedItemId){
        el.classList.add("selected");
    }

    if(item.type === "image"){
        el.style.background = "white";
    }else if(item.type === "shape"){
        const shapeColor = item.color || "#4dabf7";
        el.style.setProperty("--build-shape-color", shapeColor);

        if(item.shape === "line"){
            el.style.background = "transparent";
            el.style.border = "none";
        }else{
            el.style.background = item.outlineOnly ? "transparent" : shapeColor;
            el.style.border = "3px solid " + shapeColor;
        }
    }else if(item.color){
        el.style.background = item.color;
    }

    let textEl = null;

    if(item.type === "shape"){
        textEl = document.createElement("span");
        textEl.className = "build-item-text";
        textEl.innerText = item.text || "";

        if(item.shape === "line"){
            const lineSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            const lineW = Number(item.w) || 1;
            const lineH = Number(item.h) || 1;
            const lineX1 = Number.isFinite(Number(item.lineX1)) ? Number(item.lineX1) : 0;
            const lineY1 = Number.isFinite(Number(item.lineY1)) ? Number(item.lineY1) : Math.max(1, lineH / 2);
            const lineX2 = Number.isFinite(Number(item.lineX2)) ? Number(item.lineX2) : lineW;
            const lineY2 = Number.isFinite(Number(item.lineY2)) ? Number(item.lineY2) : Math.max(1, lineH / 2);
            lineSvg.classList.add("build-line-svg");
            lineSvg.setAttribute("viewBox", "0 0 " + lineW + " " + lineH);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", String(lineX1));
            line.setAttribute("y1", String(lineY1));
            line.setAttribute("x2", String(lineX2));
            line.setAttribute("y2", String(lineY2));
            line.setAttribute("stroke", item.color || "#4dabf7");
            line.setAttribute("stroke-width", "3");
            line.setAttribute("stroke-linecap", "round");
            lineSvg.appendChild(line);
            el.appendChild(lineSvg);
        }

        el.appendChild(textEl);
    }else if(item.type === "image"){
        const photo = document.createElement("div");
        photo.className = "build-item-image";

        if(item.photo){
            const img = document.createElement("img");
            img.src = item.photo;
            img.alt = item.text || "빌드 사진";
            photo.appendChild(img);
        }else{
            photo.innerText = "사진 없음";
        }

        textEl = document.createElement("span");
        textEl.className = "build-item-text";
        textEl.innerText = item.text || "";
        textEl.style.display = "none";

        el.appendChild(photo);
        el.appendChild(textEl);
    }else if(item.type === "machine"){
        const currentMachineData =
            item.genre &&
            item.machine &&
            data.machines[item.genre] &&
            data.machines[item.genre][item.machine]
                ? data.machines[item.genre][item.machine]
                : null;
        const displayPhoto = item.photo || (currentMachineData ? currentMachineData.photo || "" : "");

        const photo = document.createElement("div");
        photo.className = "build-item-machine-photo";

        if(displayPhoto){
            const img = document.createElement("img");
            img.src = displayPhoto;
            img.alt = item.text || item.machine || "정답지";
            photo.appendChild(img);
        }else{
            photo.innerText = "사진 없음";
        }

        const title = document.createElement("span");
        title.className = "build-item-machine-title build-item-text";
        title.innerText = (item.genre ? item.genre + " · " : "") + (item.text || item.machine || "정답지");
        textEl = title;

        el.appendChild(photo);
        el.appendChild(title);
    }else{
        textEl = document.createElement("span");
        textEl.className = "build-item-text";
        textEl.innerText = item.text || item.genre || "항목";
        el.appendChild(textEl);
    }

    const meta = document.createElement("span");
    meta.className = "build-item-meta";
    meta.innerText = item.createdByName ? "by " + item.createdByName : "";

    if(meta.innerText){
        el.appendChild(meta);
    }

    applyBuildTextLayout(item, textEl);

    if(canEditCurrentStore()){
        const gearButton = createButton("build-item-gear", "⚙", (event)=>{
            event.preventDefault();
            event.stopPropagation();
            if(buildMode !== "edit"){
                return;
            }
            selectBuildItem(item.id);
            menu.classList.toggle("active");
        });
        gearButton.onpointerdown = (event)=>{
            event.preventDefault();
            event.stopPropagation();
        };
        el.appendChild(gearButton);

        const menu = document.createElement("div");
        menu.className = "build-item-menu";
        menu.onpointerdown = (event)=>{
            event.stopPropagation();
        };
        menu.onclick = (event)=>{
            event.stopPropagation();
        };

        menu.appendChild(createAdminButton("텍스트", (event)=>{
            event.preventDefault();
            event.stopPropagation();
            selectBuildItem(item.id);

            if(textEl){
                startBuildTextEdit(item, textEl, true);
                menu.classList.remove("active");
            }
        }));

        if(textEl){
            menu.appendChild(createBuildTextAlignControls(item, textEl));
        }

        const menuColor = document.createElement("input");
        menuColor.type = "color";
        menuColor.value = normalizeBuildColor(item.color || buildShapeColor || "#fff7c8") || "#fff7c8";
        menuColor.onpointerdown = (event)=>{
            event.stopPropagation();
        };
        menuColor.onclick = (event)=>{
            event.stopPropagation();
        };
        menuColor.oninput = (event)=>{
            event.stopPropagation();
            selectBuildItem(item.id);
            setBuildSelectedItemColor(menuColor.value, false);
        };
        menuColor.onchange = (event)=>{
            event.stopPropagation();
            selectBuildItem(item.id);
            setBuildSelectedItemColor(menuColor.value, true);
        };
        menu.appendChild(menuColor);

        menu.appendChild(createAdminButton("복제", (event)=>{
            event.stopPropagation();
            selectBuildItem(item.id);
            duplicateBuildItem();
        }));
        menu.appendChild(createAdminButton("앞으로", (event)=>{
            event.stopPropagation();
            selectBuildItem(item.id);
            bringBuildItemForward();
        }));
        menu.appendChild(createAdminButton("뒤로", (event)=>{
            event.stopPropagation();
            selectBuildItem(item.id);
            sendBuildItemBackward();
        }));
        menu.appendChild(createAdminButton("삭제", (event)=>{
            event.preventDefault();
            event.stopPropagation();
            deleteBuildItem(item.id);
        }));
        el.appendChild(menu);

        ["nw", "ne", "sw", "se"].forEach((direction)=>{
            const resizeHandle = document.createElement("span");
            resizeHandle.className = "build-resize-handle " + direction;
            resizeHandle.onpointerdown = (event)=>{
                if(buildMode !== "edit"){
                    return;
                }

                event.preventDefault();
                event.stopPropagation();
                selectBuildItem(item.id);
                buildResizeItemId = item.id;
                buildResizeStartX = event.clientX;
                buildResizeStartY = event.clientY;
                buildResizeStartW = Number(item.w) || 150;
                buildResizeStartH = Number(item.h) || 58;
                buildResizeStartItemX = Number(item.x) || 0;
                buildResizeStartItemY = Number(item.y) || 0;
                resizeHandle.dataset.direction = direction;
                resizeHandle.setPointerCapture(event.pointerId);
            };
            resizeHandle.onpointermove = (event)=>{
                if(buildResizeItemId !== item.id){
                    return;
                }

                resizeBuildItemFromHandle(item, el, resizeHandle.dataset.direction, event);
            };
            resizeHandle.onpointerup = (event)=>{
                if(buildResizeItemId !== item.id){
                    return;
                }

                buildResizeItemId = "";
                saveBuildBoard(()=>{});
                resizeHandle.releasePointerCapture(event.pointerId);
            };
            resizeHandle.onpointercancel = resizeHandle.onpointerup;
            el.appendChild(resizeHandle);
        });
    }

    el.ondblclick = (event)=>{
        event.stopPropagation();
        selectBuildItem(item.id);
    };

    el.onpointerdown = (event)=>{
        if(!canEditCurrentStore() || buildMode === "draw"){
            return;
        }

        if(event.target.closest(".build-item-text.editing")){
            return;
        }

        event.preventDefault();
        event.stopPropagation();
        const viewport = document.getElementById("build-viewport");
        if(viewport){
            viewport.focus();
        }
        selectBuildItem(item.id);

        if(buildMode !== "edit"){
            return;
        }

        const point = getBuildPoint(event, canvas);
        buildDragItemId = item.id;
        buildDragOffsetX = point.x - (Number(item.x) || 0);
        buildDragOffsetY = point.y - (Number(item.y) || 0);
        el.setPointerCapture(event.pointerId);
    };

    el.onpointermove = (event)=>{
        if(buildDragItemId !== item.id || buildResizeItemId){
            return;
        }

        const point = getBuildPoint(event, canvas);
        item.x = Math.round(Math.max(0, Math.min(canvas.offsetWidth - 40, point.x - buildDragOffsetX)));
        item.y = Math.round(Math.max(0, Math.min(canvas.offsetHeight - 30, point.y - buildDragOffsetY)));
        el.style.left = item.x + "px";
        el.style.top = item.y + "px";
    };

    el.onpointerup = (event)=>{
        if(buildDragItemId !== item.id){
            return;
        }

        buildDragItemId = "";
        item.updatedAt = new Date().toISOString();
        item.updatedByName = getCurrentDisplayName();
        saveBuildBoard(()=>{});
        el.releasePointerCapture(event.pointerId);
    };

    el.onpointercancel = el.onpointerup;

    canvas.appendChild(el);

    if(buildPendingTextEditItemId === item.id){
        buildPendingTextEditItemId = "";
        setTimeout(()=>{
            selectBuildItem(item.id);
            if(textEl){
                startBuildTextEdit(item, textEl, true);
            }
        }, 0);
    }
}

        layout.classList.add("sidebar-collapsed");
    }

    sidebar.className = "build-sidebar";

    const sidebarTitle = document.createElement("div");
    sidebarTitle.className = "build-sidebar-title";

    folderToggle.onpointerdown = (event)=>{
        buildFolderToggleDragging = true;
        buildFolderToggleMoved = false;
        buildFolderToggleStartY = event.clientY;
        buildFolderToggleStartTop = getBuildFolderToggleTop();
        sidebar.classList.add("dragging");
        folderToggle.setPointerCapture(event.pointerId);
    };
    folderToggle.onpointermove = (event)=>{
        if(!buildFolderToggleDragging){
            return;
        }

        const deltaY = event.clientY - buildFolderToggleStartY;

        if(Math.abs(deltaY) > 3){
            buildFolderToggleMoved = true;
        }

        if(buildFolderToggleMoved){
            event.preventDefault();
            setBuildFolderToggleTop(layout, buildFolderToggleStartTop + deltaY);
        }
    };
    folderToggle.onpointerup = (event)=>{
        if(!buildFolderToggleDragging){
            return;
        }

        buildFolderToggleDragging = false;
        sidebar.classList.remove("dragging");

        if(folderToggle.hasPointerCapture && folderToggle.hasPointerCapture(event.pointerId)){
            folderToggle.releasePointerCapture(event.pointerId);
        }

        if(buildFolderToggleMoved){
            event.preventDefault();
            setTimeout(()=>{
                buildFolderToggleMoved = false;
            }, 0);
        }
    };
    folderToggle.onpointercancel = folderToggle.onpointerup;
    folderToggle.onclick = ()=>{

    canvas.style.height = board.height + "px";

        event.preventDefault();
    };

    scroll.ondrop = (event)=>{
        event.preventDefault();

        if(buildMode !== "edit"){
            alert("자료를 배치하려면 편집 모드를 켜세요.");
            return;
        }

        const json = event.dataTransfer.getData("application/json");
        const genre = event.dataTransfer.getData("text/plain");
        let payload = null;

        if(json){
            try{
                payload = JSON.parse(json);
            }catch(err){
                payload = null;
            }
        }

        if(!payload && !genre){
            return;
        }

        const point = getBuildPoint(event, canvas);
        addBuildLibraryItem(payload || {
            type:"folder",
            genre:genre,
            text:genre,
            color:data.genreColors && data.genreColors[genre] ? data.genreColors[genre] : "#fff7c8"
        }, point.x, point.y);
    };

    scroll.ondblclick = (event)=>{
        return;
    };

    scroll.onwheel = (event)=>{
        event.preventDefault();
        const direction = event.deltaY > 0 ? 0.9 : 1.1;
        zoomBuildView(buildZoom * direction, event.clientX, event.clientY);
    };

    scroll.onpointerdown = (event)=>{
        if(buildMode === "draw" || event.button !== 0 || event.target.closest(".build-item")){
            return;
        }

        event.preventDefault();
        scroll.focus();
        selectBuildItem("");

        if(buildMode === "edit" && buildCreateTool){
            const point = getBuildPoint(event, canvas);
            buildCreating = true;
            buildCreateStartX = point.x;
            buildCreateStartY = point.y;
            updateBuildCreatePreview(
                canvas,
                getBuildCreateBox(buildCreateStartX, buildCreateStartY, point.x, point.y, buildCreateTool),
                buildCreateTool
            );
            scroll.setPointerCapture(event.pointerId);
            return;
        }

        buildPanning = true;
        buildPanStartX = event.clientX;
        buildPanStartY = event.clientY;
        buildPanOriginX = buildPanX;
        buildPanOriginY = buildPanY;
        scroll.classList.add("panning");
        scroll.setPointerCapture(event.pointerId);
    };

    scroll.onpointermove = (event)=>{
        if(buildCreating && buildCreateTool){
            event.preventDefault();
            const point = getBuildPoint(event, canvas);
            updateBuildCreatePreview(
                canvas,
                getBuildCreateBox(buildCreateStartX, buildCreateStartY, point.x, point.y, buildCreateTool),
                buildCreateTool
            );
            return;
        }

        if(!buildPanning){
            return;
        }

        event.preventDefault();
        buildPanX = buildPanOriginX + event.clientX - buildPanStartX;
        buildPanY = buildPanOriginY + event.clientY - buildPanStartY;
        applyBuildTransform();
    };

    scroll.onpointerup = (event)=>{
        if(buildCreating && buildCreateTool){
            event.preventDefault();
            const point = getBuildPoint(event, canvas);
            const tool = buildCreateTool;
            const box = getBuildCreateBox(buildCreateStartX, buildCreateStartY, point.x, point.y, tool);
            buildCreating = false;
            buildCreateTool = null;
            clearBuildCreatePreview();
            updateBuildCreateToolUI();
            scroll.releasePointerCapture(event.pointerId);
            addBuildCreatedItem(tool, box);
            return;
        }

        if(!buildPanning){
            return;
        }

        buildPanning = false;
        scroll.classList.remove("panning");
        scroll.releasePointerCapture(event.pointerId);
    };

    scroll.onpointercancel = (event)=>{
        if(buildCreating){
            buildCreating = false;
            clearBuildCreatePreview();
            if(scroll.hasPointerCapture && scroll.hasPointerCapture(event.pointerId)){
                scroll.releasePointerCapture(event.pointerId);
            }
            return;
        }

        scroll.onpointerup(event);
    };

    scroll.onkeydown = (event)=>{
        if(handleBuildUndoRedoShortcut(event)){
            return;
        }

        if(event.target.closest(".build-item-text.editing")){
            return;
        }

        if(!buildSelectedItemId){
            if((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "z"){
                event.preventDefault();
                redoBuildBoard();
                return;
            }

            if((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z"){
                event.preventDefault();
                undoBuildBoard();
                return;
            }

            if((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "y"){
                event.preventDefault();
                redoBuildBoard();
                return;
            }

            return;
        }

        const amount = event.shiftKey ? 10 : 1;

        if((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "z"){
            event.preventDefault();
            redoBuildBoard();
            return;
        }

        if((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z"){
            event.preventDefault();
            undoBuildBoard();
            return;
        }

        if((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "y"){
            event.preventDefault();
            redoBuildBoard();
            return;
        }

        if(event.key === "Delete" || event.key === "Backspace"){
            event.preventDefault();
            deleteSelectedBuildItem();
            return;
        }

        if(event.ctrlKey && event.key.toLowerCase() === "d"){
            event.preventDefault();
            duplicateBuildItem();
            return;
        }

        if(event.key === "ArrowLeft"){
            event.preventDefault();
            moveBuildSelectedItem(-amount, 0);
        }else if(event.key === "ArrowRight"){
            event.preventDefault();
            moveBuildSelectedItem(amount, 0);
        }else if(event.key === "ArrowUp"){
            event.preventDefault();
            moveBuildSelectedItem(0, -amount);
        }else if(event.key === "ArrowDown"){
            event.preventDefault();
            moveBuildSelectedItem(0, amount);
        }
    };

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.classList.add("build-drawing-layer");
    svg.setAttribute("viewBox", "0 0 " + board.width + " " + board.height);
    svg.setAttribute("preserveAspectRatio", "none");

    svg.onpointerdown = (event)=>{
        if(!canEditCurrentStore() || buildMode !== "draw"){
            return;
        }

        event.preventDefault();
        updateBuildDrawCursor(event, canvas);
        const point = getBuildPoint(event, canvas);
        buildDrawing = true;
        buildCurrentStroke = {
            id:createBuildItemId(),
            color:buildDrawColor,
            size:buildDrawSize,
            opacity:buildDrawOpacity,
            points:[{
                x:Math.round(point.x),
                y:Math.round(point.y)
            }],
            createdAt:new Date().toISOString(),
            createdByName:getCurrentDisplayName()
        };
        board.strokes.push(buildCurrentStroke);
        renderBuildStrokes(svg, board);
        svg.setPointerCapture(event.pointerId);
    };

    svg.onpointermove = (event)=>{
        updateBuildDrawCursor(event, canvas);

        if(!buildDrawing || !buildCurrentStroke){
            return;
        }

        event.preventDefault();
        const point = getBuildPoint(event, canvas);
        buildCurrentStroke.points.push({
            x:Math.round(point.x),
            y:Math.round(point.y)
        });
        renderBuildStrokes(svg, board);
    };

    svg.onpointerup = (event)=>{
        if(!buildDrawing){
            updateBuildDrawCursor(event, canvas);
            return;
        }

        buildDrawing = false;
        buildCurrentStroke = null;
        updateBuildDrawCursor(event, canvas);
        saveBuildBoard(()=>{});
        svg.releasePointerCapture(event.pointerId);
    };

    svg.onpointercancel = svg.onpointerup;
    svg.onpointerleave = ()=>{
        hideBuildDrawCursor(canvas);
    };
    svg.onpointerenter = (event)=>{
        updateBuildDrawCursor(event, canvas);
    };

    canvas.appendChild(svg);
    renderBuildStrokes(svg, board);

    [...board.items].sort((a,b)=>(Number(a.z) || 0) - (Number(b.z) || 0)).forEach((item)=>{
        renderBuildItem(item, canvas);
    });

    scroll.appendChild(canvas);
    main.appendChild(scroll);

    const help = document.createElement("p");
    help.className = "build-help";
    help.innerText = "폴더를 끌어다 놓고, 빈 공간을 더블클릭해 메모를 붙이고, 필요하면 그 위에 바로 그려보세요. 정리된 문서보다 회의용 자유 보드에 가깝게 쓰면 됩니다.";
    main.appendChild(help);

    layout.appendChild(main);
    root.appendChild(layout);

    if(!buildViewReady){
        buildViewReady = true;
        fitBuildView();
    }else{
        applyBuildTransform();
    }

    setBuildMode(buildMode);
    updateBuildHistoryButtons();
}

function createFigureFormField(form, key, labelText, value, placeholder, multiline = false){

function openFigureCatalogForm(entry, isNew){
    const { modal, panel } = createFolderModal(isNew ? "피규어 등록" : "피규어 정보 수정");

    const guide = document.createElement("p");
    guide.className = "sub-text";
    guide.innerText = "박스에 적힌 정보를 빈칸에 채워두면 나중에 N/W, G/W, 코드, 일본어 단서로 검색할 수 있습니다.";
    panel.appendChild(guide);

    const form = document.createElement("div");
    form.className = "figure-form-grid";

    createFigureFormField(form, "name", "피규어 이름", entry.name, "예: 루피 기어5, 미쿠, 렘");
    createFigureFormField(form, "code", "숫자 코드 / C/No", entry.code, "예: 349, 47, 116-01-...");
    createFigureFormField(form, "nw", "N/W", entry.nw, "예: 12.1 KGS");
    createFigureFormField(form, "gw", "G/W", entry.gw, "예: 16.3 KGS");
    createFigureFormField(form, "extraKeywords", "그 외 검색 단서", entry.extraKeywords || entry.keywords, "일본어 이름, 브랜드, 박스 문구, 작품명", true);
    createFigureFormField(form, "memo", "메모", entry.memo, "어떤 박스에서 들어왔는지, 구분 팁, 주의점", true);

    panel.appendChild(form);

    panel.appendChild(createButton("btn-save", "저장", ()=>{
        const values = {};

        form.querySelectorAll("[data-figure-field]").forEach((input)=>{
            values[input.dataset.figureField] = sanitizeText(input.value);
        });

        if(!values.name){
            alert("피규어 이름을 입력하세요.");
            return;
        }

        entry.name = values.name;
        entry.code = values.code;
        entry.nw = values.nw;
        entry.gw = values.gw;
        entry.extraKeywords = values.extraKeywords;
        entry.memo = values.memo;
        entry.keywords = [
            values.nw,
            values.gw,
            values.code,
            values.extraKeywords
        ].filter(Boolean).join(" ");

        updateFigureEntryAudit(entry);

        if(isNew){
            appData.figureCatalog.push(entry);
        }

        modal.remove();
        saveData(()=>render(false));
    }));

    panel.appendChild(createButton("btn-back", "닫기", ()=>modal.remove()));
}

function uploadFigureCatalogImage(entryId, field){
    if(!requireStoreEdit()){
        return;
    }

    const entry = getFigureEntry(entryId);

    if(!entry){
        return;
    }

    const input = createPhotoInput(0);

    const cleanupInput = ()=>{
        setTimeout(()=>{
            if(input.parentNode){
                input.parentNode.removeChild(input);
            }
        }, 500);
    };

    input.onchange = async(event)=>{
        const file = event.target.files && event.target.files[0];

        if(!file){
            cleanupInput();
            return;
        }

        const interval = showLoading("🎁 도감 사진 업로드 중...");

        try{
            entry[field] = await compressAndUploadImage(
                file,
                field === "boxPhoto" ? "figure_box" : "figure_answer"
            );
            updateFigureEntryAudit(entry);
            await saveData(()=>render(false));
        }catch(err){
            console.error(err);
            alert("도감 사진 업로드 실패: " + err.message);
        }finally{
            hideLoading(interval);
            cleanupInput();
        }
    };

    input.oncancel = cleanupInput;
    input.click();
}

function getAccountStoreNames(account){
    const storeIds = Array.isArray(account.storeIds) ? account.storeIds : [];

    if(storeIds.includes("*")){
        return "전체 지점";
    }

    return storeIds
    .map((storeId)=>appData.storeNames[storeId] || storeId)
    .join(", ") || "없음";
}

function getCollapsedAccountGroups(){
    try{
        const saved = JSON.parse(localStorage.getItem("collapsedAccountGroups") || "[]");
        return new Set(Array.isArray(saved) ? saved : []);
    }catch(err){
        return new Set();
    }
}

function setCollapsedAccountGroups(collapsed){
    localStorage.setItem("collapsedAccountGroups", JSON.stringify([...collapsed]));
}

function getAccountGroupKey(account){
    const storeIds = Array.isArray(account.storeIds) ? account.storeIds : [];

    if(storeIds.includes("*")){
        return "__all__";
    }

    return storeIds[0] || "__none__";
}

function getAccountGroupTitle(groupKey){
    if(groupKey === "__all__"){
        return "전체 지점";
    }

    if(groupKey === "__none__"){
        return "지점 미지정";
    }

    return appData.storeNames[groupKey] || groupKey;
}

function getGroupedAccounts(accounts){
    const order = ["__all__", ...appData.storeOrder, "__none__"];
    const groups = new Map();

    accounts.forEach((account)=>{
        const key = getAccountGroupKey(account);

        if(!groups.has(key)){
            groups.set(key, []);
        }

        groups.get(key).push(account);
    });

    return [...groups.entries()]
    .sort((a,b)=>{
        const ai = order.includes(a[0]) ? order.indexOf(a[0]) : order.length;
        const bi = order.includes(b[0]) ? order.indexOf(b[0]) : order.length;

        if(ai !== bi){
            return ai - bi;
        }

        return getAccountGroupTitle(a[0]).localeCompare(getAccountGroupTitle(b[0]), "ko-KR");
    })
    .map(([key, items])=>({
        key,
        title:getAccountGroupTitle(key),
        accounts:items.sort((a,b)=>String(a.displayName || a.loginId || "").localeCompare(String(b.displayName || b.loginId || ""), "ko-KR"))
    }));
}

            `;
            groupHeader.onclick = ()=>{

                    <th>아이디</th>

        });

function collectAccountRowUpdates(codes){
    const updates = [];
    const usedLoginIds = new Map();

    for(const code of codes){
        const account = appData.accounts[code];
        const values = getAccountRowValues(code);

        if(!account || !values){
            return {
                error:"계정 정보를 찾을 수 없습니다."
            };
        }

        if(!values.loginId){
            return {
                error:"아이디를 입력하세요."
            };
        }

        if(!values.displayName){
            return {
                error:"표시이름을 입력하세요. 예: 홍길동"
            };
        }

        if(values.loginId === DEFAULT_MASTER_ID){
            return {
                error:"기본 마스터 아이디는 사용할 수 없습니다."
            };
        }

        if(usedLoginIds.has(values.loginId)){
            return {
                error:"중복된 아이디가 있습니다: " + values.loginId
            };
        }

        usedLoginIds.set(values.loginId, code);

        if(values.storeIds.length === 0){
            return {
                error:"접속 지점을 1개 이상 선택하세요."
            };
        }

        if(!values.password && !account.passwordHash){
            return {
                error:"새 계정은 비밀번호를 입력해야 저장할 수 있습니다: " + values.loginId
            };
        }

        updates.push({
            code,
            account,
            values
        });
    }

    Object.keys(appData.accounts || {}).forEach((code)=>{
        if(codes.includes(code)){
            return;
        }

        const loginId = normalizeLoginId(appData.accounts[code] && appData.accounts[code].loginId);

        if(loginId){
            usedLoginIds.set(loginId, code);
        }
    });

    for(const update of updates){
        const existingCode = usedLoginIds.get(update.values.loginId);

        if(existingCode && existingCode !== update.code){
            return {
                error:"이미 사용 중인 아이디입니다: " + update.values.loginId
            };
        }
    }

    return {
        updates
    };
}

async function applyAccountRowUpdates(updates){
    for(const update of updates){
        const account = update.account;
        const values = update.values;

        account.loginId = values.loginId;
        account.displayName = values.displayName;
        account.memo = values.memo;
        account.role = values.role;
        account.storeIds = values.storeIds;

        if(values.password){
            account.passwordHash = await hashPassword(values.password);
        }
    }
}

async function saveAccountRow(code){
    const account = appData.accounts[code];

    if(!account){
        alert("계정 정보를 찾을 수 없습니다.");
        return;
    }

    const result = collectAccountRowUpdates([code]);

    if(result.error){
        alert(result.error);
        return;
    }

    await applyAccountRowUpdates(result.updates);

    await saveData(()=>{
        accountEditCodes.delete(code);
        render(false);
        alert("계정이 저장되었습니다.");
    });
}

async function saveAllAccountRows(){
    const codes = Array.from(document.querySelectorAll("[data-account-code]"))
    .map((row)=>row.dataset.accountCode)
    .filter((code)=>code && appData.accounts[code]);

    if(codes.length > 0){
        const result = collectAccountRowUpdates(codes);

        if(result.error){
            alert(result.error);
            return;
        }

        await applyAccountRowUpdates(result.updates);
    }

    await saveData(()=>{
        accountEditCodes.clear();
        render(false);
        updateAuthUI();
        alert("전체 계정이 저장되었습니다.");
    });
}

function deleteAccountRow(code){
    const account = appData.accounts[code];

    if(!account){
        return;
    }

    if(!confirm(account.loginId + " 계정을 삭제할까요?")){
        return;
    }

    delete appData.accounts[code];
    accountEditCodes.delete(code);

    if(currentAccountCode === code){
        currentAccountCode = "";
        currentLoginId = "";
    }

    const row = document.querySelector('[data-account-code="' + code + '"]');

    if(row){
        row.remove();
    }

    const title = document.querySelector("#content .header-row h2");

    if(title){
        title.innerText = "계정 관리 (" + Object.keys(appData.accounts || {}).length + "개)";
    }

    alert("삭제 표시되었습니다. 전체 저장을 누르면 반영됩니다.");
}

        "translate3d(" +
        modalTranslateX +
        "px," +
        modalTranslateY +
        "px,0) scale(" +
        modalScale +
        ")";

    modal.classList.toggle("zoomed", modalScale > 1);
}

function resetModalZoom(){
    modalScale = 1;
    modalTranslateX = 0;
    modalTranslateY = 0;
    modalStartScale = 1;
    modalStartDistance = 0;
    modalStartTranslateX = 0;
    modalStartTranslateY = 0;
    modalPanStartX = 0;
    modalPanStartY = 0;
    modalMoved = false;
    modalPointers.clear();
    applyModalTransform();
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
    resetModalZoom();
}

function getPointerDistance(){
    const points = Array.from(modalPointers.values());

    if(points.length < 2){
        return 0;
    }

    return Math.hypot(
        points[0].clientX - points[1].clientX,
        points[0].clientY - points[1].clientY
    );
}

function bindModalZoomEvents(){
    const modal = document.getElementById("modal");
    const img = document.getElementById("modal-img");

    if(!modal || !img){
        return;
    }

    modal.addEventListener("wheel", (event)=>{
        if(modal.style.display !== "flex"){
            return;
        }

        event.preventDefault();

        const nextScale = clampModalScale(
            modalScale * (event.deltaY < 0 ? 1.12 : 0.88)
        );

        modalScale = nextScale;
        applyModalTransform();
    }, { passive:false });

    img.addEventListener("dblclick", (event)=>{
        event.preventDefault();
        event.stopPropagation();

        modalScale = modalScale > 1 ? 1 : 2;
        applyModalTransform();
    });

    img.addEventListener("pointerdown", (event)=>{
        event.preventDefault();
        event.stopPropagation();

        modalMoved = false;
        modalPointers.set(event.pointerId, {
            clientX:event.clientX,
            clientY:event.clientY
        });

        if(img.setPointerCapture){
            img.setPointerCapture(event.pointerId);
        }

        if(modalPointers.size === 1){
            modalPanStartX = event.clientX;
            modalPanStartY = event.clientY;
            modalStartTranslateX = modalTranslateX;
            modalStartTranslateY = modalTranslateY;
        }else if(modalPointers.size === 2){
            modalStartDistance = getPointerDistance();
            modalStartScale = modalScale;
        }
    });

    img.addEventListener("pointermove", (event)=>{
        if(!modalPointers.has(event.pointerId)){
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        modalPointers.set(event.pointerId, {
            clientX:event.clientX,
            clientY:event.clientY
        });

        if(modalPointers.size >= 2 && modalStartDistance > 0){
            const nextDistance = getPointerDistance();
            modalScale = clampModalScale(
                modalStartScale * (nextDistance / modalStartDistance)
            );
            modalMoved = true;
            applyModalTransform();
            return;
        }

        if(modalScale > 1){
            const dx = event.clientX - modalPanStartX;
            const dy = event.clientY - modalPanStartY;

            if(Math.abs(dx) > 2 || Math.abs(dy) > 2){
                modalMoved = true;
            }

            modalTranslateX = modalStartTranslateX + dx;
            modalTranslateY = modalStartTranslateY + dy;
            applyModalTransform();
        }
    });

    const clearPointer = (event)=>{
        modalPointers.delete(event.pointerId);

        if(modalPointers.size < 2){
            modalStartDistance = 0;
            modalStartScale = modalScale;
        }
    };

    img.addEventListener("pointerup", clearPointer);
    img.addEventListener("pointercancel", clearPointer);
    img.addEventListener("lostpointercapture", clearPointer);

    if(!window.PointerEvent){
        img.addEventListener("touchstart", (event)=>{
            event.preventDefault();
            modalMoved = false;

            if(event.touches.length === 1){
                modalPanStartX = event.touches[0].clientX;
                modalPanStartY = event.touches[0].clientY;
                modalStartTranslateX = modalTranslateX;
                modalStartTranslateY = modalTranslateY;
            }else if(event.touches.length >= 2){
                modalStartDistance = Math.hypot(
                    event.touches[0].clientX - event.touches[1].clientX,
                    event.touches[0].clientY - event.touches[1].clientY
                );
                modalStartScale = modalScale;
            }
        }, { passive:false });

        img.addEventListener("touchmove", (event)=>{
            event.preventDefault();

            if(event.touches.length >= 2 && modalStartDistance > 0){
                const nextDistance = Math.hypot(
                    event.touches[0].clientX - event.touches[1].clientX,
                    event.touches[0].clientY - event.touches[1].clientY
                );

                modalScale = clampModalScale(
                    modalStartScale * (nextDistance / modalStartDistance)
                );
                modalMoved = true;
                applyModalTransform();
                return;
            }

            if(event.touches.length === 1 && modalScale > 1){
                const dx = event.touches[0].clientX - modalPanStartX;
                const dy = event.touches[0].clientY - modalPanStartY;

                modalTranslateX = modalStartTranslateX + dx;
                modalTranslateY = modalStartTranslateY + dy;
                modalMoved = true;
                applyModalTransform();
            }
        }, { passive:false });

        img.addEventListener("touchend", ()=>{
            modalStartDistance = 0;
            modalStartScale = modalScale;
        });
    }
}

function getDrawCanvasPoint(event){
    const canvas = document.getElementById("draw-canvas");
    const rect = canvas.getBoundingClientRect();

    return {
        x:(event.clientX - rect.left) * (canvas.width / rect.width),
        y:(event.clientY - rect.top) * (canvas.height / rect.height)
    };
}

function getDrawCursorPreview(){
    const wrap = document.querySelector(".draw-canvas-wrap");

    if(!wrap){
        return null;
    }

    let cursor = document.getElementById("draw-cursor-preview");

    if(!cursor){
        cursor = document.createElement("div");
        cursor.id = "draw-cursor-preview";
        cursor.className = "draw-cursor-preview";
        wrap.appendChild(cursor);
    }

    return cursor;
}

function updateDrawSizeLabel(){
    const input = document.getElementById("draw-size");
    const label = document.getElementById("draw-size-label");

    if(label && input){
        label.innerText = (Number(input.value) || 1) + "px";
    }
}

function updateDrawCursorPreview(event){
    const canvas = document.getElementById("draw-canvas");
    const wrap = document.querySelector(".draw-canvas-wrap");
    const cursor = getDrawCursorPreview();

    if(!canvas || !wrap || !cursor || !event){
        return;
    }

    const canvasRect = canvas.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    const size = Number(document.getElementById("draw-size").value) || 1;
    const displaySize = Math.max(2, size * (canvasRect.width / canvas.width));

    cursor.style.width = displaySize + "px";
    cursor.style.height = displaySize + "px";
    cursor.style.left = (event.clientX - wrapRect.left - displaySize / 2 + wrap.scrollLeft) + "px";
    cursor.style.top = (event.clientY - wrapRect.top - displaySize / 2 + wrap.scrollTop) + "px";
    cursor.classList.toggle("eraser", drawToolMode === "erase");
    cursor.style.display = "block";
}

function hideDrawCursorPreview(){
    const cursor = document.getElementById("draw-cursor-preview");

    if(cursor){
        cursor.style.display = "none";
    }
}

function redrawMainPhotoCanvas(){
    const canvas = document.getElementById("draw-canvas");
    const ctx = canvas.getContext("2d");

    if(!canvas || !ctx || !drawBaseImage){
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(drawBaseImage, 0, 0, canvas.width, canvas.height);

    const overlay = document.createElement("canvas");
    overlay.width = canvas.width;
    overlay.height = canvas.height;

    const overlayCtx = overlay.getContext("2d");

    if(!overlayCtx){
        return;
    }

    overlayCtx.lineCap = "round";
    overlayCtx.lineJoin = "round";

    drawStrokes.forEach((stroke)=>{
        if(!stroke.points || stroke.points.length === 0){
            return;
        }

        overlayCtx.globalCompositeOperation = stroke.mode === "erase"
            ? "destination-out"
            : "source-over";
        overlayCtx.strokeStyle = stroke.color;
        overlayCtx.lineWidth = stroke.size;
        overlayCtx.beginPath();
        overlayCtx.moveTo(stroke.points[0].x, stroke.points[0].y);

        if(stroke.points.length === 1){
            overlayCtx.lineTo(stroke.points[0].x + 0.1, stroke.points[0].y + 0.1);
        }else{
            stroke.points.slice(1).forEach((point)=>{
                overlayCtx.lineTo(point.x, point.y);
            });
        }

        overlayCtx.stroke();
    });

    ctx.drawImage(overlay, 0, 0);
}

function updateDrawToolButtons(){
    const brushBtn = document.getElementById("draw-brush-btn");
    const eraserBtn = document.getElementById("draw-eraser-btn");
    const canvas = document.getElementById("draw-canvas");

    if(brushBtn){
        brushBtn.classList.toggle("active", drawToolMode === "brush");
    }

    if(eraserBtn){
        eraserBtn.classList.toggle("active", drawToolMode === "erase");
    }

    if(canvas){
        canvas.style.cursor = "none";
    }

    updateDrawSizeLabel();
}

function setDrawToolMode(mode){
    drawToolMode = mode === "erase" ? "erase" : "brush";
    updateDrawToolButtons();
}

function cloneDrawStrokes(strokes){
    if(!Array.isArray(strokes)){
        return [];
    }

    return strokes
    .filter((stroke)=>stroke && Array.isArray(stroke.points))
    .map((stroke)=>({
        mode:stroke.mode === "erase" ? "erase" : "brush",
        color:typeof stroke.color === "string" ? stroke.color : "#ff2d2d",
        size:Number(stroke.size) || 7,
        points:stroke.points
        .filter((point)=>point && Number.isFinite(Number(point.x)) && Number.isFinite(Number(point.y)))
        .map((point)=>({
            x:Math.round(Number(point.x) * 10) / 10,
            y:Math.round(Number(point.y) * 10) / 10
        }))
    }));
}

function createPhotoDrawData(basePhoto, canvas){
    const auditUser = getCurrentAuditUser();

    return {
        basePhoto:basePhoto || "",
        strokes:cloneDrawStrokes(drawStrokes),
        canvasWidth:canvas ? canvas.width : 0,
        canvasHeight:canvas ? canvas.height : 0,
        updatedAt:new Date().toISOString(),
        updatedBy:auditUser.id,
        updatedByName:auditUser.name
    };
}

function getStoredDrawData(target){
    if(target && target.photoDrawData && typeof target.photoDrawData === "object"){
        return target.photoDrawData;
    }

    return null;
}

async function openMainPhotoDrawEditor(){
    if(!requireStoreEdit()){
        return;
    }

    const machine = data.machines[currentGenre] && data.machines[currentGenre][currentMachine];

    if(!machine || !machine.photo){
        alert("먼저 메인 사진을 등록하세요.");
        return;
    }

    const interval = showLoading("그림 편집 준비 중...");

    try{
        const storedDrawData = getStoredDrawData(machine);
        const basePhoto = storedDrawData && storedDrawData.basePhoto
            ? storedDrawData.basePhoto
            : machine.photo;

        drawBaseDataUrl = await imageSourceToDataUrl(basePhoto);
        drawStrokes = cloneDrawStrokes(storedDrawData && storedDrawData.strokes);
        currentDrawStroke = null;
        drawingActive = false;
        drawTarget = {
            type:"main",
            basePhoto:basePhoto
        };
        setDrawToolMode("brush");

        drawBaseImage = await new Promise((resolve, reject)=>{
            const img = new Image();
            img.onload = ()=>resolve(img);
            img.onerror = ()=>reject(new Error("사진을 불러오지 못했습니다."));
            img.src = drawBaseDataUrl;
        });

        const canvas = document.getElementById("draw-canvas");
        const maxSide = 1600;
        let width = drawBaseImage.width;
        let height = drawBaseImage.height;

        if(Math.max(width, height) > maxSide){
            const ratio = maxSide / Math.max(width, height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
        }

        canvas.width = width;
        canvas.height = height;
        redrawMainPhotoCanvas();
        document.getElementById("draw-modal").style.display = "flex";
    }catch(err){
        console.error(err);
        alert("그림 편집 준비 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}

    currentDrawStroke = null;
    drawingActive = false;
    drawTarget = null;
    setDrawToolMode("brush");
}

function startDraw(event){
    const canvas = document.getElementById("draw-canvas");

    if(!drawBaseImage){
        return;
    }

    event.preventDefault();
    updateDrawCursorPreview(event);
    canvas.setPointerCapture(event.pointerId);
    drawingActive = true;

    currentDrawStroke = {
        mode:drawToolMode,
        color:document.getElementById("draw-color").value || "#ff2d2d",
        size:Number(document.getElementById("draw-size").value) || 7,
        points:[getDrawCanvasPoint(event)]
    };

    drawStrokes.push(currentDrawStroke);
    redrawMainPhotoCanvas();
}

function moveDraw(event){
    updateDrawCursorPreview(event);

    if(!drawingActive || !currentDrawStroke){
        return;
    }

    event.preventDefault();
    currentDrawStroke.points.push(getDrawCanvasPoint(event));
    redrawMainPhotoCanvas();
}

function endDraw(event){
    if(event){
        event.preventDefault();
    }

    drawingActive = false;
    currentDrawStroke = null;

    if(event){
        updateDrawCursorPreview(event);
    }
}

async function saveDrawnMainPhoto(){
    if(!requireStoreEdit()){
        return;
    }

    const machine = data.machines[currentGenre] && data.machines[currentGenre][currentMachine];
    const canvas = document.getElementById("draw-canvas");

    if(!machine || !canvas || !drawBaseImage){
        return;
    }

    const interval = showLoading("그림 저장 중...");

    try{
        const quality = Math.max(0.75, getCompressionSettings().jpegQuality);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        const target = drawTarget || {
            type:"main"
        };

        if(target.type === "evidence"){
            const collectionKey = target.collectionKey === "adminEvidencePhotos"
                ? "adminEvidencePhotos"
                : "evidencePhotos";
            const photos = getEvidenceCollection(machine, collectionKey);
            const photoItem = photos[target.index];

            if(!photoItem){
                throw new Error("수정할 추가 사진을 찾을 수 없습니다.");
            }

            photoItem.photo = await uploadDataUrlToStorage(
                dataUrl,
                storageImagePath(collectionKey === "adminEvidencePhotos"
                    ? "admin_evidence_draw"
                    : "evidence_draw")
            );
            photoItem.photoDrawData = createPhotoDrawData(target.basePhoto || photoItem.photo, canvas);
            applyAuditFields(photoItem, "photoUpdated");
        }else{
            addMachineTimelineSnapshot(machine, "그림판 저장 전");
            machine.photo = await uploadDataUrlToStorage(dataUrl, storageImagePath("main_draw"));
            machine.photoDrawData = createPhotoDrawData(target.basePhoto || machine.photo, canvas);
            applyAuditFields(machine, "photoUpdated");
        }

        await saveData(()=>{
            closeDrawModal();
            render(false);
        });
    }catch(err){
        console.error(err);
        alert("그림 저장 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}

        fromIndex < 0 ||

function restoreTrashEntry(index, showAlerts = true){
    const item = data.trash[index];

    if(!item){
        return false;
    }

    if(item.type === "genre"){
        if(!data.genres.includes(item.name)){
            data.genres.push(item.name);
            data.machines[item.name] = item.data || {};
        }
    }else if(item.type === "machine"){
        if(!item.genre){
            if(showAlerts){
                alert("원본 폴더 정보 없음");
            }
            return false;
        }

        if(!data.genres.includes(item.genre)){
            data.genres.push(item.genre);
        }

        if(!data.machines[item.genre]){
            data.machines[item.genre] = {};
        }

        data.machines[item.genre][item.name] = item.data || {
            photo:"",
            photoUpdatedAt:"",
            photoUpdatedBy:"",
            photoUpdatedByName:"",
            photoDrawData:null,
            memo:"",
            memoUpdatedAt:"",
            memoUpdatedBy:"",
            memoUpdatedByName:"",
            adminMemo:"",
            adminMemoUpdatedAt:"",
            adminMemoUpdatedBy:"",
            adminMemoUpdatedByName:"",
            evidencePhotos:[],
            adminEvidencePhotos:[],
            timeline:[]
        };
    }else if(item.type === "photo"){
        if(!data.machines[item.genre] || !data.machines[item.genre][item.machine]){
            if(showAlerts){
                alert("원본 기계 없음");
            }
            return false;
        }

        const collectionKey = item.collectionKey === "adminEvidencePhotos"
            ? "adminEvidencePhotos"
            : "evidencePhotos";
        const photos = getEvidenceCollection(
            data.machines[item.genre][item.machine],
            collectionKey
        );

        photos.push(item.data);
    }

    data.trash.splice(index, 1);
    return true;

function restoreSelectedTrashItems(allItems){
    if(!requireStoreEdit()){

    const indices = getSelectedTrashIndices(allItems);

    if(indices.length === 0){
        alert("선택된 항목이 없습니다.");
        return;

    saveData(()=>{
        render(false);
        alert("복구 완료: " + successCount + "개" + (failCount ? "\n복구 실패: " + failCount + "개" : ""));

    }

    if(!confirm((allItems ? "휴지통 전체" : "선택한 항목") + "를 영구 삭제할까요?\n되돌릴 수 없습니다.")){
        return;
    }

    let successCount = 0;

    indices
    .sort((a,b)=>b-a)
    .forEach((index)=>{
        if(deleteTrashEntry(index)){
            successCount++;
        }
    });

    saveData(()=>{
        render(false);
        alert("영구 삭제 완료: " + successCount + "개");
    });
}

function createPhotoInput(type, sourceMode = "library"){
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.value = "";
    input.style.position = "fixed";
    input.style.left = "-9999px";
    input.style.top = "-9999px";
    input.style.width = "1px";
    input.style.height = "1px";
    input.style.opacity = "0";

    if(sourceMode === "camera"){
        input.capture = "environment";
        input.setAttribute("capture", "environment");
        input.multiple = false;
    }else{
        input.removeAttribute("capture");
        input.multiple = type !== 0;
    }

    document.body.appendChild(input);

    return input;
}

function uploadPhoto(type, sourceMode = "library"){
    if(!requireStoreEdit()){
        return;
    }

    if(!currentGenre || !currentMachine){
        alert("기계 정보 없음");
        return;
    }

    const machine = data.machines[currentGenre] && data.machines[currentGenre][currentMachine];

    if(!machine){
        alert("기계 데이터 없음");
        return;
    }

    const input = createPhotoInput(type, sourceMode);

    const cleanupInput = ()=>{
        setTimeout(()=>{
            if(input.parentNode){
                input.parentNode.removeChild(input);
            }
        }, 500);
    };

    input.onchange = async(event)=>{
        const files = Array.from(event.target.files || []);

        if(files.length === 0){
            cleanupInput();
            return;
        }

        const interval = showLoading("📤 이미지 업로드 중...");

        try{
            if(type === 0){
                addMachineTimelineSnapshot(machine, "메인 사진 변경 전");
                machine.photo = await compressAndUploadImage(files[0], "main");
                machine.photoDrawData = null;
                applyAuditFields(machine, "photoUpdated");
            }else{
                const collectionKey = type === 2 ? "adminEvidencePhotos" : "evidencePhotos";
                const storageKind = type === 2 ? "admin_evidence" : "evidence";
                const photos = getEvidenceCollection(machine, collectionKey);

                for(let i = 0; i < files.length; i++){
                    const url = await compressAndUploadImage(files[i], storageKind);
                    const auditUser = getCurrentAuditUser();
                    photos.push({
                        photo:url,
                        memo:"",
                        createdAt:new Date().toISOString(),
                        createdBy:auditUser.id,
                        createdByName:auditUser.name,
                        memoUpdatedAt:"",
                        photoUpdatedAt:"",
                        photoDrawData:null
                    });

                    const percent = Math.round(((i + 1) / files.length) * 100);
                    document.getElementById("progress-fill").style.width = percent + "%";
                    document.getElementById("loading-text").innerText = "📤 이미지 업로드 중... " + percent + "%";
                }
            }

            await saveData(()=>{
                render(false);
            });
        }catch(err){
            console.error(err);
            alert("업로드 실패: " + err.message);
        }finally{
            hideLoading(interval);
            cleanupInput();
        }
    };

    input.oncancel = ()=>{
        cleanupInput();
    };

    input.click();
}
