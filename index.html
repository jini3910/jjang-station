<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>짱오락실 정답지</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body.reorder-touch-lock,
body.reorder-touch-lock *{
    user-select:none !important;
    -webkit-user-select:none !important;
    -webkit-touch-callout:none !important;
}

body{
    margin:0;
    padding:15px;
    background:#f2f2f2;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color:#222;
}

.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
}

.container.build-container{
    max-width:none;
    min-height:calc(100vh - 30px);
    padding:10px;
    border-radius:12px;
}

.container.build-container .logo-wrap{
    display:none;
}

.container.build-container .top-bar{
    margin-bottom:6px;
}

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.hamburger{
    font-size:30px;
    cursor:pointer;
    user-select:none;
    padding:6px 12px;
    border-radius:10px;
}

.hamburger:active{
    background:#eee;
}

.storage-badge{
    flex-shrink:0;
    max-width:210px;
    padding:7px 10px;
    border:1px solid #ddd;
    border-radius:999px;
    background:#fafafa;
    color:#333;
    font-size:12px;
    font-weight:700;
    line-height:1.25;
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.storage-badge.warning{
    border-color:#ffb74d;
    background:#fff8e1;
    color:#a65b00;
}

.storage-badge.danger{
    border-color:#ef9a9a;
    background:#ffebee;
    color:#b71c1c;
}

.schedule-now-card{
    margin:-6px 0 10px;
    padding:8px 10px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fbfbfb;
}

.schedule-now-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:6px;
    color:#333;
    font-size:11px;
    font-weight:800;
}

.schedule-now-head span{
    color:#777;
    font-size:10px;
    font-weight:700;
}

.schedule-route{
    display:grid;
    grid-template-columns:1fr 1.1fr 1fr;
    align-items:center;
    gap:5px;
    position:relative;
}

.schedule-route:before{
    content:"";
    position:absolute;
    left:10%;
    right:10%;
    top:12px;
    height:2px;
    background:#d8d8d8;
}

.schedule-station{
    position:relative;
    z-index:1;
    display:grid;
    gap:2px;
    justify-items:center;
    min-width:0;
    color:#777;
    text-align:center;
}

.schedule-dot{
    width:10px;
    height:10px;
    border:2px solid #aaa;
    border-radius:50%;
    background:white;
}

.schedule-station.active{
    color:#111;
}

.schedule-station.active .schedule-dot{
    width:14px;
    height:14px;
    border-color:#2196F3;
    box-shadow:0 0 0 3px rgba(33,150,243,0.14);
}

.schedule-label{
    font-size:9px;
    font-weight:800;
}

.schedule-area{
    width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:11px;
    font-weight:900;
}

.schedule-time{
    color:#777;
    font-size:9px;
    font-weight:700;
}

.schedule-empty{
    color:#777;
    font-size:11px;
    line-height:1.35;
}

.schedule-editor{
    display:grid;
    gap:12px;
}

.schedule-image-preview{
    width:100%;
    max-height:260px;
    object-fit:contain;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
}

.schedule-table-wrap{
    overflow-x:auto;
}

.schedule-table{
    width:100%;
    min-width:620px;
    border-collapse:collapse;
    font-size:12px;
}

.schedule-table th,
.schedule-table td{
    padding:6px;
    border:1px solid #e3e3e3;
    background:white;
}

.schedule-table th{
    background:#f5f5f5;
    font-weight:900;
}

.schedule-table input{
    width:100%;
    min-width:0;
    padding:7px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:12px;
}

.schedule-table .btn-mini{
    padding:7px 9px;
    white-space:nowrap;
}

.schedule-workspace{
    display:grid;
    gap:12px;
}

.schedule-board-tools{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.schedule-palette{
    display:grid;
    gap:8px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
}

.schedule-palette h3{
    margin:0;
    font-size:13px;
}

.schedule-chip-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.schedule-chip-wrap{
    display:flex;
    align-items:center;
    gap:3px;
}

.schedule-chip{
    width:auto;
    margin:0;
    padding:7px 10px;
    border:1px solid #ccc;
    border-radius:999px;
    background:white;
    color:#222;
    font-size:12px;
    font-weight:800;
    cursor:grab;
}

.schedule-chip.selected{
    border-color:#2196F3;
    background:#eaf4ff;
    color:#0d47a1;
}

.schedule-chip:active{
    cursor:grabbing;
}

.schedule-chip-delete{
    width:24px;
    height:24px;
    margin:0;
    padding:0;
    border:1px solid #ddd;
    border-radius:50%;
    background:white;
    color:#d9534f;
    font-size:13px;
    font-weight:900;
    line-height:1;
}

.schedule-color-input{
    width:28px;
    height:28px;
    margin:0;
    padding:0;
    border:1px solid #ccc;
    border-radius:50%;
    background:white;
    cursor:pointer;
}

.schedule-block-size{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    padding:9px 10px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
    font-size:12px;
    font-weight:900;
}

.schedule-size-btn{
    width:auto;
    margin:0;
    padding:7px 10px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    color:#333;
    font-size:12px;
}

.schedule-size-btn.active{
    border-color:#2196F3;
    background:#eaf4ff;
    color:#0d47a1;
}

.schedule-size-btn.delete-active{
    border-color:#d9534f;
    background:#fff0f0;
    color:#b71c1c;
}

.schedule-zoom-control{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding:9px 10px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
    font-size:12px;
    font-weight:900;
}

.schedule-zoom-control input{
    width:160px;
}

.schedule-board-wrap{
    overflow:auto;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
}

.schedule-board{
    display:grid;
    min-width:1180px;
    font-size:12px;
}

.schedule-board-cell{
    min-height:42px;
    padding:7px 6px;
    border-right:1px solid #333;
    border-bottom:1px solid #333;
    background:white;
    text-align:center;
    font-weight:800;
}

.schedule-board-cell.slot{
    display:grid;
    grid-template-rows:1fr 1fr;
    min-height:76px;
    padding:0;
    background:#b8b8b8;
}

.schedule-board-cell.header{
    position:sticky;
    top:0;
    z-index:2;
    background:#fff3c4;
}

.schedule-board-cell.employee{
    position:sticky;
    left:0;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f7f7f7;
    box-shadow:2px 0 0 rgba(0,0,0,0.12);
}

.schedule-board-cell.header.employee{
    z-index:6;
}

.schedule-board-cell.drop-ready{
    outline:3px solid rgba(33,150,243,0.32);
    outline-offset:-3px;
}

.schedule-board-cell.filled{
    background:#fff5d8;
}

.schedule-board-cell.rest{
    background:#ddd;
}

.schedule-board-cell.empty{
    color:#aaa;
    font-weight:600;
}

.schedule-board-cell .cell-note{
    display:block;
    margin-top:3px;
    color:#777;
    font-size:10px;
    font-weight:600;
}

.schedule-half{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:38px;
    padding:4px;
    border-bottom:1px dashed #cfcfcf;
    background:#b8b8b8;
    color:#777;
    font-size:11px;
    font-weight:700;
    line-height:1.2;
    text-align:center;
    cursor:pointer;
}

.schedule-half:last-child{
    border-bottom:none;
}

.schedule-half.filled{
    color:#222;
    font-weight:900;
}

.schedule-half.rest{
    background:#ddd;
}

.schedule-half.drop-ready{
    outline:3px solid rgba(33,150,243,0.32);
    outline-offset:-3px;
}

.schedule-board-cell.slot.full-block .schedule-half:first-child{
    grid-row:1 / 3;
    min-height:76px;
    border-bottom:none;
    font-size:12px;
}

.schedule-board-cell.slot.full-block .schedule-half:last-child{
    display:none;
}

.schedule-board-cell input{
    width:100%;
    padding:6px;
    border:1px solid #ccc;
    border-radius:7px;
    text-align:center;
    font-size:12px;
    font-weight:800;
}

.schedule-board-guide{
    color:#666;
    font-size:12px;
    line-height:1.5;
}

.schedule-selected-tool{
    min-height:28px;
    color:#0d47a1;
    font-size:12px;
    font-weight:800;
}

@media(max-width:600px){
    .schedule-board-tools{
        grid-template-columns:1fr;
    }
}

.top-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    min-width:0;
}

.store-select{
    max-width:120px;
    padding:7px 8px;
    font-size:12px;
    font-weight:700;
    border-radius:999px;
}

.logo-wrap{
    width:100%;
    text-align:center;
    margin-bottom:20px;
    cursor:pointer;
}

.logo-img{
    width:100%;
    max-width:340px;
    border-radius:12px;
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.header-row h2{
    margin:0;
    font-size:18px;
    min-width:0;
}

.header-title{
    max-width:45%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

select{
    border:1px solid #ccc;
    border-radius:8px;
    padding:8px;
    font-size:13px;
    background:white;
}

.grid-1{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.grid-tile{
    display:grid;
    gap:10px;
}

.grid-cols-2{
    grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-cols-3{
    grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-cols-4{
    grid-template-columns:repeat(4,minmax(0,1fr));
}

.grid-tile .item-wrapper{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.grid-tile .item-wrapper>.item{
    height:100%;
}

.view-options{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}

.view-options select{
    max-width:150px;
}

.memo-expand-option{
    display:flex;
    align-items:center;
    gap:5px;
    padding:7px 8px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    cursor:pointer;
}

.memo-expand-option input{
    width:14px;
    height:14px;
    margin:0;
}

.item-wrapper{
    position:relative;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.item{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    transition:0.15s;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-user-drag:none;
    touch-action:manipulation;
}

.item *,
.settings-btn,
.admin-menu,
.btn-mini,
.folder-create-btn,
.thumb-box,
.info-box,
.machine-card,
.reorder-ghost{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-user-drag:none;
}

.item:active{
    transform:scale(0.98);
}

.list-mode{
    flex-direction:row;
    align-items:center;
    padding:10px;
    gap:12px;
}

.thumb-box{
    width:100%;
    padding-top:125%;
    background:#fafafa;
    position:relative;
    flex-shrink:0;
}

.list-mode .thumb-box{
    width:60px;
    height:75px;
    padding-top:0;
}

.thumb-box img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

.photo-empty{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fafafa;
    color:#999;
    font-size:13px;
    font-weight:700;
    text-align:center;
}

.thumb-box .photo-empty{
    position:absolute;
    inset:0;
}

.main-photo-empty{
    width:100%;
    min-height:240px;
    border:1px solid #ddd;
    border-radius:12px;
}

.info-box{
    padding:10px;
    flex-grow:1;
    min-width:0;
}

.info-box b{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14px;
}

.info-box p{
    margin:5px 0 0;
    color:#666;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.info-box p.memo-preview{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    line-height:1.45;
    min-height:36px;
    max-height:36px;
    overflow:hidden;
    text-overflow:clip;
    white-space:normal;
    word-break:break-word;
}

.info-box p.memo-preview.expanded{
    display:block;
    -webkit-line-clamp:unset;
    max-height:none;
    white-space:pre-wrap;
}

.machine-card.memo-card:not(.memo-expanded) .info-box{
    min-height:70px;
}

.no-photo .thumb-box{
    display:none;
}

.settings-btn{
    position:absolute;
    top:4px;
    right:4px;
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    opacity:0.25;
    transition:0.2s;
    z-index:5;
    cursor:pointer;
}

.settings-btn:hover{
    opacity:1;
}

.settings-btn:active{
    background:#eee;
}

.item-wrapper.reorder-enabled>.item{
    cursor:grab;
}

.item-wrapper.reorder-enabled>.item:active{
    cursor:grabbing;
}

@keyframes reorderJiggle{
    0%{
        transform:rotate(-0.45deg);
    }

    50%{
        transform:rotate(0.45deg);
    }

    100%{
        transform:rotate(-0.45deg);
    }
}

.reorder-jiggle .item-wrapper[data-reorder-type]>.item,
.reorder-ghost>.item{
    animation:reorderJiggle 0.14s infinite;
    transform-origin:center;
}

.item-wrapper.dragging{
    visibility:hidden;
}

.item-wrapper.drag-over-before .item{
    box-shadow:0 -4px 0 #2196F3;
}

.item-wrapper.drag-over-after .item{
    box-shadow:0 4px 0 #2196F3;
}

.reorder-ghost{
    position:fixed;
    left:0;
    top:0;
    z-index:50000;
    pointer-events:none;
    opacity:0.92;
    transform:translate3d(0,0,0);
    filter:drop-shadow(0 14px 24px rgba(0,0,0,0.2));
}

.reorder-ghost .admin-menu{
    display:none !important;
}

.admin-menu{
    display:none;
    flex-wrap:wrap;
    gap:6px;
    padding:8px;
    margin-top:5px;
    border-radius:10px;
    background:#fafafa;
    border:1px solid #ddd;
}

.admin-menu.active{
    display:flex;
}

.folder-modal{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:rgba(0,0,0,0.45);
    z-index:36000;
}

.folder-panel{
    width:100%;
    max-width:420px;
    max-height:88vh;
    overflow-y:auto;
    padding:16px;
    border-radius:12px;
    background:white;
    box-shadow:0 8px 24px rgba(0,0,0,0.22);
}

.folder-panel h3{
    margin:0 0 12px;
    font-size:17px;
}

.folder-panel input[type="text"]{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

.folder-checks{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    margin-top:12px;
}

.folder-checks label{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px;
    border:1px solid #eee;
    border-radius:8px;
    background:#fafafa;
    font-size:13px;
}

.folder-checks input{
    width:16px;
    height:16px;
    flex:0 0 16px;
    margin:0;
}

.color-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:10px;
}

.color-swatch{
    height:42px;
    border:2px solid transparent;
    border-radius:10px;
    cursor:pointer;
}

.color-swatch.active{
    border-color:#222;
}

.admin-only-toggle{
    width:auto;
    margin-top:0;
    padding:8px 10px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    color:#333;
    font-size:12px;
    font-weight:700;
}

.admin-only-toggle.active{
    border-color:#d9534f;
    background:#fff0f0;
    color:#b71c1c;
}

.admin-only-item{
    box-shadow:inset 0 0 0 2px rgba(217,83,79,0.35);
}

.admin-only-badge{
    display:inline-block;
    width:max-content;
    margin-top:6px;
    padding:3px 7px;
    border-radius:999px;
    background:rgba(80,80,80,0.58);
    color:white;
    font-size:11px;
    line-height:1.25;
}

.btn-mini{
    width:auto;
    margin-top:0;
    border-radius:8px;
    padding:8px 12px;
    background:white;
    border:1px solid #ccc;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

button{
    border:none;
    width:100%;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
}

.btn-add{
    background:#4CAF50;
    color:white;
}

.btn-save{
    background:#2196F3;
    color:white;
}

.folder-create-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:12px;
}

.folder-create-actions .folder-create-btn{
    width:auto;
    min-width:96px;
    margin-top:0;
    padding:9px 12px;
    border-radius:8px;
    font-size:12px;
    line-height:1.2;
}

.btn-back{
    background:#777;
    color:white;
}

.main-img{
    width:100%;
    min-height:240px;
    max-height:560px;
    object-fit:contain;
    background:#fafafa;
    border-radius:12px;
    border:1px solid #ddd;
    cursor:pointer;
}

.main-photo-frame{
    position:relative;
}

.main-photo-frame .main-img{
    display:block;
}

.action-time{
    display:inline-block;
    padding:3px 6px;
    border-radius:6px;
    background:rgba(80,80,80,0.24);
    color:rgba(255,255,255,0.74);
    font-size:10px;
    line-height:1.35;
    pointer-events:none;
}

.action-time:hover{
    background:rgba(80,80,80,0.45);
    color:white;
}

.floating-time{
    position:absolute;
    top:8px;
    left:8px;

.build-layout{
    position:relative;

    grid-template-columns:190px minmax(0,1fr);
    gap:12px;
    align-items:start;

    margin-bottom:6px;

    margin:0;
    color:#666;
    font-size:13px;
    font-weight:800;
}

    grid-template-columns:minmax(0,1fr);
}

    border:1px solid rgba(0,0,0,0.08);
    border-radius:14px;
    background:rgba(255,255,255,0.72);

.build-sidebar-title{
    display:flex;
    align-items:center;
    gap:6px;
    padding:11px 12px;

    font-weight:800;

.build-folder-toggle{

    height:22px;

    padding:0;

    border-radius:50%;
    background:rgba(255,255,255,0.86);
    cursor:pointer;
    font-size:12px;
    line-height:22px;
    flex-shrink:0;
    touch-action:none;
    user-select:none;

function sanitizeText(text){
    return String(text || "")
    .replace(/[\uFE0E\uFE0F]/g,"")
    .replace(/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"")
    .trim();
}

function isValidDataKey(text){

}

function naturalMachineCompare(a, b){
    const left = String(a).match(/\d+|\D+/g) || [String(a)];
    const right = String(b).match(/\d+|\D+/g) || [String(b)];
    const length = Math.max(left.length, right.length);

    for(let i = 0; i < length; i++){
        if(left[i] === undefined){
            return -1;
        }

        if(right[i] === undefined){
            return 1;
        }

        const leftIsNumber = /^\d+$/.test(left[i]);
        const rightIsNumber = /^\d+$/.test(right[i]);

        if(leftIsNumber && rightIsNumber){
            const diff = Number(left[i]) - Number(right[i]);

            if(diff !== 0){
                return diff;
            }

            const lengthDiff = left[i].length - right[i].length;

            if(lengthDiff !== 0){
                return lengthDiff;
            }
        }else{
            const diff = left[i].localeCompare(right[i], "ko-KR", {
                numeric:true,
                sensitivity:"base"
            });

            if(diff !== 0){
                return diff;
            }
        }
    }

    return String(a).localeCompare(String(b), "ko-KR", {
        numeric:true,
        sensitivity:"base"
    });
}

function hasLegacyStoreShape(value){
    return value &&
        typeof value === "object" &&
        (
            Array.isArray(value.genres) ||
            value.machines ||
            value.trash ||
            Object.prototype.hasOwnProperty.call(value, "siteLogo")
        ) &&
        !value.stores;
}

                    ...createEmptyStore(),
                    ...raw
                }
            },

                ? raw.storageUsageBytes
                : Number(raw.storageUsageBytes) || 0,

            figureCatalog:[],
            boardCategories:[],
            boardPosts:[],
            buildBoards:{},

            siteLogo:typeof raw.siteLogo === "string" ? raw.siteLogo : null,
            compressionSettings:raw.compressionSettings && typeof raw.compressionSettings === "object"
                ? raw.compressionSettings
                : {...DEFAULT_COMPRESSION_SETTINGS},
            storageUsageBytes:typeof raw.storageUsageBytes === "number"
                ? raw.storageUsageBytes
                : Number(raw.storageUsageBytes) || 0,

            figureCatalog:Array.isArray(raw.figureCatalog) ? raw.figureCatalog : [],
            boardCategories:Array.isArray(raw.boardCategories) ? raw.boardCategories : [],
            boardPosts:Array.isArray(raw.boardPosts) ? raw.boardPosts : [],
            buildBoards:raw.buildBoards && typeof raw.buildBoards === "object" ? raw.buildBoards : {},
            accounts:raw.accounts && typeof raw.accounts === "object" ? raw.accounts : {},
            userRoles:raw.userRoles && typeof raw.userRoles === "object" ? raw.userRoles : {},
            userPasswords:raw.userPasswords && typeof raw.userPasswords === "object" ? raw.userPasswords : {}
        };
    }

    if(!appData.stores || typeof appData.stores !== "object"){
        appData.stores = {};
    }

    if(!Array.isArray(appData.storeOrder)){
        appData.storeOrder = Object.keys(appData.stores);
    }

    if(!appData.storeNames || typeof appData.storeNames !== "object"){
        appData.storeNames = {};
    }

    if(typeof appData.siteLogo !== "string"){
        appData.siteLogo = null;
    }

    if(!appData.compressionSettings || typeof appData.compressionSettings !== "object"){
        appData.compressionSettings = {...DEFAULT_COMPRESSION_SETTINGS};
    }

    if(typeof appData.storageUsageBytes !== "number" || !Number.isFinite(appData.storageUsageBytes)){
        appData.storageUsageBytes = Object.values(appData.stores || {}).reduce((sum, store)=>{
            return sum + (Number(store && store.storageUsageBytes) || 0);
        }, 0);
    }

    appData.compressionSettings.maxWidth = Math.min(
        2400,
        Math.max(
            100,
            Number(appData.compressionSettings.maxWidth) || DEFAULT_COMPRESSION_SETTINGS.maxWidth
        )
    );

    appData.compressionSettings.jpegQuality = Math.min(
        0.9,
        Math.max(
            0.01,
            Number(appData.compressionSettings.jpegQuality) || DEFAULT_COMPRESSION_SETTINGS.jpegQuality
        )
    );

    if(!Array.isArray(appData.storeTrash)){
        appData.storeTrash = [];
    }

    if(!appData.buildBoards || typeof appData.buildBoards !== "object" || Array.isArray(appData.buildBoards)){
        appData.buildBoards = {};
    }

    if(!Array.isArray(appData.figureCatalog)){
        appData.figureCatalog = [];
    }

    if(!Array.isArray(appData.boardCategories)){
        appData.boardCategories = [];
    }

    const defaultBoardCategories = [
        {
            id:"notice",
            name:"공지"
        },
        {
            id:"daily",
            name:"일일공지"
        }
    ];

    const normalizedBoardCategories = appData.boardCategories
    .filter((category)=>category && typeof category === "object")
    .map((category, index)=>{
        const id = typeof category.id === "string" && category.id
            ? category.id
            : "board_" + Date.now() + "_" + index;

        return {
            id:id,
            name:typeof category.name === "string" && category.name
                ? category.name
                : id,
            locked:id === "notice" || id === "daily"
        };
    });

    defaultBoardCategories.forEach((defaultCategory)=>{
        const existing = normalizedBoardCategories.find((category)=>category.id === defaultCategory.id);

        if(existing){
            existing.name = existing.name || defaultCategory.name;
            existing.locked = true;
        }else{
            normalizedBoardCategories.push({
                ...defaultCategory,
                locked:true
            });
        }
    });

    appData.boardCategories = normalizedBoardCategories;

    appData.figureCatalog = appData.figureCatalog
    .filter((entry)=>entry && typeof entry === "object")
    .map((entry, index)=>{
        if(typeof entry.id !== "string" || !entry.id){
            entry.id = "figure_" + Date.now() + "_" + index;
        }

        [
            "name",
            "keywords",
            "nw",
            "gw",
            "code",
            "extraKeywords",
            "memo",
            "boxPhoto",
            "figurePhoto",
            "createdAt",
            "updatedAt",
            "updatedBy",
            "updatedByName",
            "updatedRole",
            "updatedStoreId",
            "updatedStoreName"
        ].forEach((key)=>{
            if(typeof entry[key] !== "string"){
                entry[key] = "";
            }
        });

        return entry;
    });

    if(!Array.isArray(appData.boardPosts)){
        appData.boardPosts = [];
    }

    appData.boardPosts = appData.boardPosts
    .filter((post)=>post && typeof post === "object")
    .map((post, index)=>{
        if(typeof post.id !== "string" || !post.id){
            post.id = "post_" + Date.now() + "_" + index;
        }

        if(
            typeof post.category !== "string" ||
            !appData.boardCategories.some((category)=>category.id === post.category)
        ){
            post.category = "notice";
        }

        if(post.scope !== "all"){
            post.scope = "store";
        }

        [
            "storeId",
            "title",
            "body",
            "createdAt",
            "updatedAt",
            "authorId",
            "authorName",
            "updatedBy",
            "updatedByName",
            "authorRole",
            "authorStoreId",
            "authorStoreName"
        ].forEach((key)=>{
            if(typeof post[key] !== "string"){
                post[key] = "";
            }
        });

        post.adminOnly = post.adminOnly === true;

        if(!Array.isArray(post.images)){
            post.images = [];
        }

        post.images = post.images
        .filter((image)=>image)
        .map((image)=>{
            if(typeof image === "string"){
                return {
                    url:image,
                    createdAt:""
                };
            }

            if(typeof image !== "object"){
                return {
                    url:"",
                    createdAt:""
                };
            }

            if(typeof image.url !== "string"){
                image.url = "";
            }

            if(typeof image.createdAt !== "string"){
                image.createdAt = "";
            }

            return image;
        })
        .filter((image)=>image.url);

        return post;
    });

    if(!appData.accounts || typeof appData.accounts !== "object"){
        appData.accounts = {};
    }

    Object.values(appData.accounts).forEach((account)=>{
        if(account && typeof account.memo !== "string"){
            account.memo = "";
        }

        if(account && typeof account.displayName !== "string"){
            account.displayName = account.loginId || "";
        }
    });

    if(!appData.userRoles || typeof appData.userRoles !== "object"){
        appData.userRoles = {};
    }

    if(!appData.userPasswords || typeof appData.userPasswords !== "object"){
        appData.userPasswords = {};
    }

    Object.keys(appData.userRoles || {}).forEach((loginId)=>{
        const legacyCode = "legacy_" + normalizeLoginId(loginId);

        if(appData.accounts[legacyCode]){
            return;
        }

        const legacyRole = appData.userRoles[loginId] || {};

        appData.accounts[legacyCode] = {
            code:legacyCode,
            memo:"",
            displayName:normalizeLoginId(loginId),
            loginId:normalizeLoginId(loginId),
            passwordHash:appData.userPasswords[loginId] || "",
            role:legacyRole.role === "master" ? "master" : legacyRole.role === "manager" ? "manager" : "staff",
            storeIds:legacyRole.role === "manager" && legacyRole.storeId
                ? [legacyRole.storeId]
                : Object.keys(appData.stores || {}),
            createdAt:new Date().toISOString()
        };
    });

    if(!appData.stores[DEFAULT_STORE_ID] && appData.storeOrder.length === 0){
        appData.stores[DEFAULT_STORE_ID] = createEmptyStore();
        appData.storeOrder.push(DEFAULT_STORE_ID);
        appData.storeNames[DEFAULT_STORE_ID] = DEFAULT_STORE_NAME;
    }

    Object.keys(appData.stores).forEach((storeId)=>{
        if(!appData.storeOrder.includes(storeId)){
            appData.storeOrder.push(storeId);
        }

        if(!appData.storeNames[storeId]){
            appData.storeNames[storeId] = storeId === DEFAULT_STORE_ID ? DEFAULT_STORE_NAME : storeId;
        }
    });

    if(!appData.siteLogo){
        const yongsanStore = appData.stores[DEFAULT_STORE_ID];
        const firstStore = appData.stores[appData.storeOrder[0]];

        if(yongsanStore && typeof yongsanStore.siteLogo === "string" && yongsanStore.siteLogo){
            appData.siteLogo = yongsanStore.siteLogo;
        }else if(firstStore && typeof firstStore.siteLogo === "string" && firstStore.siteLogo){
            appData.siteLogo = firstStore.siteLogo;
        }
    }

    if(!appData.stores[currentStoreId]){
        currentStoreId = appData.storeOrder[0] || DEFAULT_STORE_ID;
        localStorage.setItem("currentStoreId", currentStoreId);
    }

    data = appData.stores[currentStoreId] || createEmptyStore();
    initializeData();
    appData.stores[currentStoreId] = data;
}

function normalizeLoginId(id){
    return sanitizeText(id)
    .toLowerCase()
    .replace(/\s+/g,"_");
}

async function hashPassword(password){
    if(!window.crypto || !crypto.subtle){
        let hash = 5381;

        for(let i = 0; i < password.length; i++){
            hash = ((hash << 5) + hash) + password.charCodeAt(i);
            hash = hash >>> 0;
        }

        return "fallback:" + hash.toString(16);
    }

    const bytes = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", bytes);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return "sha256:" + hashArray.map((byte)=>byte.toString(16).padStart(2,"0")).join("");
}

    const role = getCurrentUserRole();
    const storeIds = Array.isArray(role.storeIds) ? role.storeIds : [];

    if(role.role === "master"){
        return true;
    }

    return storeIds.includes("*") || storeIds.includes(storeId);
}

function canEditCurrentStore(){
    const role = getCurrentUserRole();

    if(role.role === "master"){
        return true;
    }

    if(role.role === "manager" || role.role === "staff"){
        return role.storeIds.includes("*") || role.storeIds.includes(currentStoreId);
    }

    return false;
}

}

            ? displayName + "\n" + roleName + "\n@" + loginId
            : "로그인하지 않음\n보기 전용";
    }

    if(loginMenu){
        loginMenu.innerText = getLoginId() ? "계정 정보" : "로그인";
    }

    if(logoutButton){
        logoutButton.style.display = getLoginId() ? "block" : "none";
    }

    [
        "migrate-menu",
        "recount-storage-menu"
    ].forEach((id)=>{
        const element = document.getElementById(id);

        if(element){
            element.style.display = canEditCurrentStore() ? "block" : "none";
        }
    });

    [
        "logo-menu",
        "rename-store-menu",
        "delete-store-menu",
        "restore-store-menu",
        "compression-menu",
        "manage-role-menu"
    ].forEach((id)=>{
        const element = document.getElementById(id);

        if(element){
            element.style.display = canManageStores() ? "block" : "none";
        }
    });

    const adminMenuToggle = document.getElementById("admin-menu-toggle");
    const adminSubmenu = document.getElementById("admin-submenu");
    const showAdminMenu = canEditCurrentStore() || canManageStores();

    if(adminMenuToggle){
        adminMenuToggle.style.display = showAdminMenu ? "block" : "none";
    }

    if(adminSubmenu){
        adminSubmenu.style.display = showAdminMenu ? "" : "none";

        if(!showAdminMenu){
            adminSubmenu.classList.remove("active");
        }
    }

    document.body.classList.toggle("auth-locked", !getLoginId());
}

function applySavedLoginOptions(){
    const remember = localStorage.getItem("rememberLogin") === "true";
    const auto = localStorage.getItem("autoLogin") === "true";
    const savedId = localStorage.getItem("savedLoginId") || "";
    const savedPassword = localStorage.getItem("savedLoginPassword") || "";
    const idInput = document.getElementById("login-id");
    const passwordInput = document.getElementById("login-password");
    const centerIdInput = document.getElementById("center-login-id");
    const centerPasswordInput = document.getElementById("center-login-password");
    const rememberInput = document.getElementById("remember-login");
    const autoInput = document.getElementById("auto-login");
    const centerRememberInput = document.getElementById("center-remember-login");
    const centerAutoInput = document.getElementById("center-auto-login");

    if(rememberInput){
        rememberInput.checked = remember;
    }

    if(centerRememberInput){
        centerRememberInput.checked = remember;
    }

    if(autoInput){
        autoInput.checked = auto;
    }

    if(centerAutoInput){
        centerAutoInput.checked = auto;
    }

    if((remember || auto) && idInput){
        idInput.value = savedId;
    }

    if((remember || auto) && centerIdInput){
        centerIdInput.value = savedId;
    }

    if((remember || auto) && passwordInput){
        passwordInput.value = savedPassword;
    }

    if((remember || auto) && centerPasswordInput){
        centerPasswordInput.value = savedPassword;
    }
}

function saveLoginOptions(loginId, password){
    const rememberInput = document.getElementById("remember-login");
    const autoInput = document.getElementById("auto-login");
    const centerRememberInput = document.getElementById("center-remember-login");
    const centerAutoInput = document.getElementById("center-auto-login");
    const remember = !!(
        (rememberInput && rememberInput.checked) ||
        (centerRememberInput && centerRememberInput.checked)
    );
    const auto = !!(
        (autoInput && autoInput.checked) ||
        (centerAutoInput && centerAutoInput.checked)
    );
    const shouldSaveCredentials = remember || auto;

    localStorage.setItem("rememberLogin", remember ? "true" : "false");
    localStorage.setItem("autoLogin", auto ? "true" : "false");

    if(rememberInput){
        rememberInput.checked = remember;
    }

    if(centerRememberInput){
        centerRememberInput.checked = remember;
    }

    if(autoInput){
        autoInput.checked = auto;
    }

    if(centerAutoInput){
        centerAutoInput.checked = auto;
    }

    if(shouldSaveCredentials){
        localStorage.setItem("savedLoginId", loginId);
        localStorage.setItem("savedLoginPassword", password);
    }else{
        localStorage.removeItem("savedLoginId");
        localStorage.removeItem("savedLoginPassword");
    }
}

function updateLoginAvailability(){

function markAppDataLoaded(){

        updateLoginAvailability();
        return;
    }

    appDataLoaded = true;

    if(appDataReadyResolver){
        appDataReadyResolver();
        appDataReadyResolver = null;
    }

    updateLoginAvailability();
}

async function waitForAppDataLoaded(){
    if(appDataLoaded){
        return;
    }

    await withTimeout(
        appDataReadyPromise,
        15000,
        "계정 데이터를 아직 불러오는 중입니다. 잠시 후 다시 시도하세요."
    );
}

async function validateLogin(loginId, password){
    const isDefaultMaster =
        loginId === DEFAULT_MASTER_ID &&
        password === DEFAULT_MASTER_PASSWORD;

    if(isDefaultMaster){
        return "__default_master";
    }

    await waitForAppDataLoaded();

    const accountCode = findAccountCodeByLoginId(loginId);
    const account = accountCode ? appData.accounts[accountCode] : null;
    const savedPassword = account && account.passwordHash;
    const passwordHash = await hashPassword(password);
    const hasSavedAccount =
        account &&
        savedPassword &&
        (
            savedPassword === passwordHash ||
            savedPassword === password
        );

    if(!hasSavedAccount){
        throw new Error("아이디 또는 비밀번호가 올바르지 않습니다.");
    }

    return accountCode;
}

async function tryAutoLogin(){
    if(autoLoginAttempted || currentLoginId){
        return;
    }

    autoLoginAttempted = true;

    if(localStorage.getItem("autoLogin") !== "true"){
        return;
    }

    const savedId = normalizeLoginId(localStorage.getItem("savedLoginId") || "");
    const savedPassword = localStorage.getItem("savedLoginPassword") || "";

    if(!savedId || !savedPassword){
        return;
    }

    try{
        const accountCode = await validateLogin(savedId, savedPassword);
        currentLoginId = savedId;
        currentAccountCode = accountCode;
        updateAuthUI();
        render(false);
    }catch(err){
        console.error(err);
        localStorage.setItem("autoLogin", "false");
        const autoInput = document.getElementById("auto-login");

        if(autoInput){
            autoInput.checked = false;
        }
    }
}

async function loginWithId(){
    const idInput = document.getElementById("login-id");
    const passwordInput = document.getElementById("login-password");
    const centerIdInput = document.getElementById("center-login-id");
    const centerPasswordInput = document.getElementById("center-login-password");
    const rawId =
        idInput && idInput.value
            ? idInput.value
            : centerIdInput
                ? centerIdInput.value
                : "";
    const rawPassword =
        passwordInput && passwordInput.value
            ? passwordInput.value
            : centerPasswordInput
                ? centerPasswordInput.value
                : "";
    const loginId = normalizeLoginId(rawId);
    const password = rawPassword;

    if(!loginId || !password){
        alert("아이디와 비밀번호를 입력하세요.");
        return;
    }

    const interval = showLoading("로그인 중...");

    try{
        const accountCode = await validateLogin(loginId, password);
        currentLoginId = loginId;
        currentAccountCode = accountCode;
        saveLoginOptions(loginId, password);

        if(passwordInput){
            const shouldKeepPassword =
                localStorage.getItem("rememberLogin") === "true" ||
                localStorage.getItem("autoLogin") === "true";

            if(!shouldKeepPassword){
                passwordInput.value = "";
            }
        }

        if(centerPasswordInput){
            const shouldKeepPassword =
                localStorage.getItem("rememberLogin") === "true" ||
                localStorage.getItem("autoLogin") === "true";

            if(!shouldKeepPassword){
                centerPasswordInput.value = "";
            }
        }

        updateAuthUI();
        render(false);
        alert("로그인되었습니다.");
    }catch(err){
        console.error(err);
        alert("로그인 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}

async function logoutUser(){
    const interval = showLoading("로그아웃 중...");

function getStoreSelectionPrompt(){
    return appData.storeOrder
    .filter((storeId)=>appData.stores[storeId])
    .map((storeId, index)=>{
        return (index + 1) + ". " + (appData.storeNames[storeId] || storeId);
    })
    .join("\n");
}

function parseStoreSelection(input){
    const activeStoreIds = appData.storeOrder.filter((storeId)=>appData.stores[storeId]);

    if(String(input).trim().toLowerCase() === "all"){
        return activeStoreIds;
    }

    const selected = String(input)
    .split(",")
    .map((value)=>Number(value.trim()) - 1)
    .filter((index)=>Number.isInteger(index) && index >= 0 && index < activeStoreIds.length)
    .map((index)=>activeStoreIds[index]);

    return Array.from(new Set(selected));
}

function describeAccount(account){
    const roleName =
        account.role === "master"
            ? "본사 게임마스터"
            : account.role === "manager"
                ? "지점 관리자"
                : "일반 직원";
    const storeNames = account.storeIds && account.storeIds.includes("*")
        ? "전체 지점"
        : (account.storeIds || []).map((storeId)=>appData.storeNames[storeId] || storeId).join(", ");

    const memoText = account.memo ? " / " + account.memo : "";

    return account.code +
        memoText +
        " / " +
        (account.displayName || account.loginId || "이름 없음") +
        " / " +
        account.loginId +
        " / " +
        roleName +
        " / " +
        (storeNames || "접속 지점 없음");
}

async function createManagedAccount(){
    let loginId = prompt("새 계정 아이디를 입력하세요.");

    if(loginId === null){
        return;
    }

    loginId = normalizeLoginId(loginId);

    if(!loginId){
        alert("아이디를 입력하세요.");
        return;
    }

    if(loginId === DEFAULT_MASTER_ID || findAccountCodeByLoginId(loginId)){
        alert("이미 사용 중인 아이디입니다.");
        return;
    }

    let displayName = prompt("표시이름을 입력하세요.\n예: 홍길동, 용산 오전 관리자");

    if(displayName === null){
        return;
    }

    displayName = sanitizeText(displayName);

    if(!displayName){
        alert("표시이름을 입력하세요.");
        return;
    }

    let password = prompt("비밀번호를 입력하세요.");

    if(password === null){
        return;
    }

    password = password.trim();

    if(!password){
        alert("비밀번호를 입력하세요.");
        return;
    }

    const roleChoice = prompt(
        "권한을 선택하세요.\n" +
        "1. 지점 관리자 (수정 가능)\n" +
        "2. 일반 직원 (보기 가능)"
    );

    if(roleChoice === null){
        return;
    }

    const role = roleChoice === "1" ? "manager" : "staff";
    const storeInput = prompt(
        "접속 가능한 지점 번호를 입력하세요.\n" +
        "여러 지점은 쉼표로 구분, 전체는 all 입력\n\n" +
        getStoreSelectionPrompt()
    );

    if(storeInput === null){
        return;
    }

    const storeIds = parseStoreSelection(storeInput);

    if(storeIds.length === 0){
        alert("접속 가능한 지점을 1개 이상 선택하세요.");
        return;
    }

    const code = generateAccountCode();

    appData.accounts[code] = {
        code:code,
        loginId:loginId,
        displayName:displayName,
        passwordHash:await hashPassword(password),
        role:role,
        storeIds:storeIds,
        createdAt:new Date().toISOString()
    };

    await saveData(()=>{
        alert("계정이 생성되었습니다.\n식별 코드: " + code);
    });
}

async function editManagedAccount(){
    const accounts = Object.values(appData.accounts || {});

    if(accounts.length === 0){
        alert("관리할 계정이 없습니다.");
        return;
    }

    const list = accounts.map((account, index)=>{
        return (index + 1) + ". " + describeAccount(account);
    }).join("\n");
    const input = prompt("수정할 계정 번호 또는 식별 코드를 입력하세요.\n\n" + list);

    if(input === null){
        return;
    }

    const byIndex = accounts[Number(input) - 1];
    const account = appData.accounts[input] || byIndex;

    if(!account){
        alert("계정을 찾을 수 없습니다.");
        return;
    }

    const action = prompt(
        "수정 항목을 선택하세요.\n" +
        "1. 아이디 변경\n" +
        "2. 표시이름 변경\n" +
        "3. 비밀번호 변경\n" +
        "4. 권한 변경\n" +
        "5. 접속 지점 변경\n" +
        "6. 계정 삭제"
    );

    if(action === null){
        return;
    }

    if(action === "1"){
        let newLoginId = prompt("새 아이디를 입력하세요.", account.loginId);

        if(newLoginId === null){
            return;
        }

        newLoginId = normalizeLoginId(newLoginId);

        if(!newLoginId){
            alert("아이디를 입력하세요.");
            return;
        }

        const existingCode = findAccountCodeByLoginId(newLoginId);

        if(newLoginId === DEFAULT_MASTER_ID || (existingCode && existingCode !== account.code)){
            alert("이미 사용 중인 아이디입니다.");
            return;
        }

        account.loginId = newLoginId;
    }else if(action === "2"){
        let newDisplayName = prompt("새 표시이름을 입력하세요.", account.displayName || account.loginId || "");

        if(newDisplayName === null){
            return;
        }

        newDisplayName = sanitizeText(newDisplayName);

        if(!newDisplayName){
            alert("표시이름을 입력하세요.");
            return;
        }

        account.displayName = newDisplayName;
    }else if(action === "3"){
        let newPassword = prompt("새 비밀번호를 입력하세요.");

        if(newPassword === null){
            return;
        }

        newPassword = newPassword.trim();

        if(!newPassword){
            alert("비밀번호를 입력하세요.");
            return;
        }

        account.passwordHash = await hashPassword(newPassword);
    }else if(action === "4"){
        const roleChoice = prompt(
            "권한을 선택하세요.\n" +
            "1. 지점 관리자 (수정 가능)\n" +
            "2. 일반 직원 (보기 가능)",
            account.role === "manager" ? "1" : "2"
        );

        if(roleChoice === null){
            return;
        }

        account.role = roleChoice === "1" ? "manager" : "staff";
    }else if(action === "5"){
        const storeInput = prompt(
            "접속 가능한 지점 번호를 입력하세요.\n" +
            "여러 지점은 쉼표로 구분, 전체는 all 입력\n\n" +
            getStoreSelectionPrompt()
        );

        if(storeInput === null){
            return;
        }

        const storeIds = parseStoreSelection(storeInput);

        if(storeIds.length === 0){
            alert("접속 가능한 지점을 1개 이상 선택하세요.");
            return;
        }

        account.storeIds = storeIds;
    }else if(action === "6"){
        if(!confirm(account.loginId + " 계정을 삭제할까요?")){
            return;
        }

        delete appData.accounts[account.code];

        if(currentAccountCode === account.code){
            currentAccountCode = "";
            currentLoginId = "";
        }
    }else{
        alert("번호를 올바르게 입력하세요.");
        return;
    }

    await saveData(()=>{
        updateAuthUI();
        renderStoreSelector();
        render(false);
        alert("계정 정보가 저장되었습니다.");
    });
}

function renderStoreSelector(){
    const select = document.getElementById("store-select");

    if(!select){
        return;
    }

    select.innerHTML = "";

    const visibleStoreIds = appData.storeOrder.filter((storeId)=>{
        return appData.stores[storeId] && (!getLoginId() || canAccessStore(storeId));
    });

    if(getLoginId() && visibleStoreIds.length > 0 && !visibleStoreIds.includes(currentStoreId)){
        currentStoreId = visibleStoreIds[0];
        data = appData.stores[currentStoreId];
    }

    appData.storeOrder.forEach((storeId)=>{
        if(!appData.stores[storeId]){
            return;
        }

        if(getLoginId() && !canAccessStore(storeId)){
            return;
        }

        const option = document.createElement("option");
        option.value = storeId;
        option.innerText = appData.storeNames[storeId] || storeId;
        select.appendChild(option);
    });

    if(canManageStores()){
        const addOption = document.createElement("option");
        addOption.value = "__add_store__";
        addOption.innerText = "+ 지점 추가";
        select.appendChild(addOption);
    }

    select.value = currentStoreId;
}

function createStoreId(name){
    const cleaned = sanitizeText(name)
    .toLowerCase()
    .replace(/\s+/g, "_")
    .replace(/[^a-z0-9가-힣_-]/g, "_")
    .replace(/_+/g, "_")
    .replace(/^_+|_+$/g, "");

    return cleaned || "store_" + Date.now();
}

function addStore(){
    if(!requireStoreManage()){
        renderStoreSelector();
        return;
    }

    let storeName = prompt("추가할 지점명 입력");

    if(storeName === null){
        renderStoreSelector();
        return;
    }

    storeName = sanitizeText(storeName);

    if(!storeName){
        alert("지점명을 입력하세요.");
        renderStoreSelector();
        return;
    }

    if(!isValidDataKey(storeName)){
        alert("지점명에는 . # $ / [ ] 문자를 사용할 수 없습니다.");
        renderStoreSelector();
        return;
    }

    let storeId = createStoreId(storeName);
    let suffix = 2;

    while(appData.stores[storeId]){
        storeId = createStoreId(storeName) + "_" + suffix;
        suffix++;
    }

    appData.stores[storeId] = createEmptyStore();
    appData.storeOrder.push(storeId);
    appData.storeNames[storeId] = storeName;

    currentStoreId = storeId;
    localStorage.setItem("currentStoreId", currentStoreId);
    data = appData.stores[currentStoreId];
    currentView = "genres";
    currentGenre = null;
    currentGenreGroup = null;
    currentMachine = null;

    saveData(()=>{
        renderStoreSelector();
        loadLogo();
        render(false);
    });
}

function switchStore(storeId){
    if(storeId === "__add_store__"){
        addStore();
        return;
    }

    if(!appData.stores[storeId]){
        renderStoreSelector();
        return;
    }

    if(getLoginId() && !canAccessStore(storeId)){
        alert("이 지점에 접속할 권한이 없습니다.");
        renderStoreSelector();
        return;
    }

    syncCurrentStoreData();
    currentStoreId = storeId;
    localStorage.setItem("currentStoreId", currentStoreId);
    data = appData.stores[currentStoreId];
    initializeData();
    currentView = "genres";
    currentGenre = null;
    currentGenreGroup = null;
    currentMachine = null;
    loadLogo();
    renderStoreSelector();
    render(false);
}

function getActiveStoreCount(){
    return appData.storeOrder.filter((storeId)=>appData.stores[storeId]).length;
}

function deleteCurrentStore(){
    if(!requireStoreManage()){
        return;
    }

    if(getActiveStoreCount() <= 1){
        alert("지점은 최소 1개 이상 필요합니다.");
        return;
    }

    const storeId = currentStoreId;
    const storeName = getCurrentStoreName();

    if(!confirm(
        storeName +
        " 지점을 삭제하시겠습니까?\n지점 복구 메뉴에서 되살릴 수 있습니다."
    )){
        return;
    }

    appData.storeTrash.push({
        storeId:storeId,
        name:storeName,
        data:appData.stores[storeId],
        deletedAt:new Date().toISOString()
    });

    delete appData.stores[storeId];
    delete appData.storeNames[storeId];
    appData.storeOrder = appData.storeOrder.filter((id)=>id !== storeId);

    currentStoreId = appData.storeOrder.find((id)=>appData.stores[id]) || DEFAULT_STORE_ID;
    localStorage.setItem("currentStoreId", currentStoreId);
    data = appData.stores[currentStoreId] || createEmptyStore();
    currentView = "genres";
    currentGenre = null;
    currentGenreGroup = null;
    currentMachine = null;

    saveData(()=>{
        loadLogo();
        renderStoreSelector();
        render(false);
        toggleMenu(false);
        alert("지점이 삭제되었습니다.");
    });
}

function restoreDeletedStore(){
    if(!requireStoreManage()){
        return;
    }

    if(!Array.isArray(appData.storeTrash) || appData.storeTrash.length === 0){
        alert("복구할 지점이 없습니다.");
        return;
    }

    const list = appData.storeTrash
    .map((item, index)=>{
        return (index + 1) + ". " + item.name + " (" + new Date(item.deletedAt).toLocaleString("ko-KR") + ")";
    })
    .join("\n");

    const input = prompt("복구할 지점 번호를 입력하세요.\n\n" + list);

    if(input === null){
        return;
    }

    const index = Number(input) - 1;

    if(!Number.isInteger(index) || index < 0 || index >= appData.storeTrash.length){
        alert("번호를 올바르게 입력하세요.");
        return;
    }

    const item = appData.storeTrash[index];
    let storeId = item.storeId || createStoreId(item.name);
    let suffix = 2;

    while(appData.stores[storeId]){
        storeId = (item.storeId || createStoreId(item.name)) + "_" + suffix;
        suffix++;
    }

    appData.stores[storeId] = item.data || createEmptyStore();
    appData.storeNames[storeId] = item.name || storeId;
    appData.storeOrder.push(storeId);
    appData.storeTrash.splice(index, 1);

    currentStoreId = storeId;
    localStorage.setItem("currentStoreId", currentStoreId);
    data = appData.stores[currentStoreId];
    currentView = "genres";
    currentGenre = null;
    currentGenreGroup = null;
    currentMachine = null;

    saveData(()=>{
        loadLogo();
        renderStoreSelector();
        render(false);
        toggleMenu(false);
        alert("지점이 복구되었습니다.");
    });
}

function getJsonSizeBytes(value){
    const json = JSON.stringify(value);

    if(window.TextEncoder){
        return new TextEncoder().encode(json).length;
    }

    return new Blob([json]).size;
}

function formatBytes(bytes){
    if(bytes >= 1024 * 1024){
        return (bytes / 1024 / 1024).toFixed(1) + "MB";
    }

    if(bytes >= 1024){
        return (bytes / 1024).toFixed(1) + "KB";
    }

    return bytes + "B";
}

function addStorageUsage(bytes){
    appData.storageUsageBytes =
        (Number(appData.storageUsageBytes) || 0) +
        bytes;
    updateStorageBadge();
}

function updateStorageBadge(){
    const badge = document.getElementById("storage-badge");

    if(!badge){
        return;
    }

    const used = Math.max(0, appData.storageUsageBytes || 0);
    const ratio = used / SUPABASE_FREE_STORAGE_BYTES;
    const remaining = Math.max(0, SUPABASE_FREE_STORAGE_BYTES - used);
    const dbSize = getJsonSizeBytes(appData);

    badge.classList.toggle("warning", ratio >= 0.7 && ratio < 0.9);
    badge.classList.toggle("danger", ratio >= 0.9);

    badge.innerText =
        "사진 " +
        formatBytes(used) +
        " / " +
        formatBytes(SUPABASE_FREE_STORAGE_BYTES);

    badge.title =
        "Supabase Storage 전체 사용량: " +
        formatBytes(used) +
        " 사용, " +
        formatBytes(remaining) +
        " 남음\nFirebase DB 크기: " +
        formatBytes(dbSize) +
        "\n이 값은 이 앱에서 업로드/정리한 사진 기준의 예상치입니다.";
}

function getSupabaseFileSize(file){
    if(!file || !file.metadata){
        return 0;
    }

    if(typeof file.metadata.size === "number"){
        return file.metadata.size;
    }

    if(typeof file.metadata.contentLength === "number"){
        return file.metadata.contentLength;
    }

    return 0;
}

function isSupabaseFolder(file){
    return file && !file.metadata;
}

async function getSupabaseStorageUsage(prefix = ""){
    let total = 0;
    let offset = 0;
    const limit = 1000;

    while(true){
        const { data:files, error } = await supabase
        .storage
        .from(supabaseBucket)
        .list(prefix, {
            limit:limit,
            offset:offset,
            sortBy:{
                column:"name",
                order:"asc"
            }
        });

        if(error){
            throw error;
        }

        if(!files || files.length === 0){
            break;
        }

        for(const file of files){
            if(isSupabaseFolder(file)){
                const childPrefix = prefix ? prefix + "/" + file.name : file.name;
                total += await getSupabaseStorageUsage(childPrefix);
            }else{
                total += getSupabaseFileSize(file);
            }
        }

        if(files.length < limit){
            break;
        }

        offset += limit;
    }

    return total;
}

function withTimeout(promise, milliseconds, message){
    let timeoutId = null;

    const timeout = new Promise((_, reject)=>{
        timeoutId = setTimeout(()=>{
            reject(new Error(message));
        }, milliseconds);
    });

    return Promise.race([promise, timeout])
    .finally(()=>{
        clearTimeout(timeoutId);
    });
}

function cleanUndefinedValues(value){
    if(Array.isArray(value)){
        value.forEach((item, index)=>{
            if(item === undefined){
                value[index] = "";
            }else{
                cleanUndefinedValues(item);
            }
        });
        return value;
    }

    if(value && typeof value === "object"){
        Object.keys(value).forEach((key)=>{
            if(value[key] === undefined){
                value[key] = "";
            }else if(typeof value[key] === "number" && !Number.isFinite(value[key])){
                value[key] = 0;
            }else{
                cleanUndefinedValues(value[key]);
            }
        });
    }

    return value;
}

async function saveData(callback, options = {}){
    if(callback){
        queuedCallbacks.push(callback);
    }

    if(saving){
        saveQueued = true;
        return;
    }

    saving = true;
    const silent = options && options.silent === true;
    const interval = silent ? null : showLoading("💾 저장 중...");

    try{
        syncCurrentStoreData();
        cleanUndefinedValues(appData);

        const dataSize = getJsonSizeBytes(appData);

        if(dataSize > SAFE_WRITE_LIMIT_BYTES){
            throw new Error(
                "데이터가 너무 큽니다. 현재 " +
                formatBytes(dataSize) +
                " / SDK 1회 저장 제한 " +
                formatBytes(SDK_WRITE_LIMIT_BYTES) +
                " 입니다. 오래된 사진을 줄이거나 Supabase Storage로 분리해야 합니다."
            );
        }

        await withTimeout(
            set(ref(database, "dollCraneData"), appData),
            SAVE_TIMEOUT_MS,
            "저장 응답이 30초 이상 없습니다. 인터넷 연결, Firebase 권한, 데이터 용량을 확인하세요."
        );

        if(!silent){
            hideLoading(interval);
        }
        updateStorageBadge();

        const callbacks = queuedCallbacks.splice(0);
        callbacks.forEach((fn)=>{
            try{
                fn();
            }catch(err){
                console.error(err);
            }
        });
    }catch(err){
        if(!silent){
            hideLoading(interval);
        }
        console.error(err);
        alert("저장 실패: " + err.message);
    }finally{
        saving = false;

        if(saveQueued){
            saveQueued = false;
            saveData();
        }
    }
}

function compressImage(file){
    return new Promise((resolve, reject)=>{
        const reader = new FileReader();

        reader.onerror = ()=>{
            reject(new Error("파일 읽기 실패"));
        };

        reader.onload = (event)=>{
            const img = new Image();

            img.onerror = ()=>{
                reject(new Error("이미지 로드 실패"));
            };

            img.onload = ()=>{
                try{
                    const settings = getCompressionSettings();
                    const canvas = document.createElement("canvas");

                    let width = img.width;
                    let height = img.height;

                    if(width > settings.maxWidth){
                        height *= settings.maxWidth / width;
                        width = settings.maxWidth;
                    }

                    canvas.width = Math.round(width);
                    canvas.height = Math.round(height);

                    const ctx = canvas.getContext("2d");

                    if(!ctx){
                        reject(new Error("Canvas 오류"));
                        return;
                    }

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    resolve(canvas.toDataURL("image/jpeg", settings.jpegQuality));
                }catch(err){
                    reject(err);
                }
            };

            img.src = event.target.result;
        };

        reader.readAsDataURL(file);
    });
}

function compressDataUrl(dataUrl, overrideSettings){
    return new Promise((resolve, reject)=>{
        const img = new Image();

        img.onerror = ()=>{
            reject(new Error("이미지 로드 실패"));
        };

        img.onload = ()=>{
            try{
                const settings = overrideSettings || getCompressionSettings();
                const canvas = document.createElement("canvas");
                let width = img.width;
                let height = img.height;

                if(width > settings.maxWidth){
                    height *= settings.maxWidth / width;
                    width = settings.maxWidth;
                }

                canvas.width = Math.round(width);
                canvas.height = Math.round(height);

                const ctx = canvas.getContext("2d");

                if(!ctx){
                    reject(new Error("Canvas 오류"));
                    return;
                }

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                resolve(canvas.toDataURL("image/jpeg", settings.jpegQuality));
            }catch(err){
                reject(err);
            }
        };

        img.src = dataUrl;
    });
}

function isDataUrl(value){
    return typeof value === "string" && /^data:image\/[a-zA-Z0-9.+-]+;base64,/.test(value);
}

function readFileAsDataUrl(file){
    return new Promise((resolve, reject)=>{
        const reader = new FileReader();

        reader.onerror = ()=>{
            reject(new Error("파일 읽기 실패"));
        };

        reader.onload = (event)=>{
            resolve(event.target.result);
        };

        reader.readAsDataURL(file);
    });
}

async function getDataUrlSizeBytes(dataUrl){

    const blob = await response.blob();
    return blob.size;
}

async function generateCompressionPreview(){
    const input = document.getElementById("compression-test-file");
    const originalImg = document.getElementById("compression-original-img");
    const previewImg = document.getElementById("compression-preview-img");
    const originalInfo = document.getElementById("compression-original-info");
    const previewInfo = document.getElementById("compression-preview-info");
    const file = input && input.files && input.files[0];

    if(!file){
        alert("테스트 사진을 선택하세요.");
        return;
    }

    const interval = showLoading("압축 미리보기 생성 중...");

    try{
        const originalDataUrl = await readFileAsDataUrl(file);
        const settings = getCompressionControlsSettings();
        const compressedDataUrl = await compressDataUrl(originalDataUrl, settings);
        const compressedBytes = await getDataUrlSizeBytes(compressedDataUrl);
        const savedRatio = file.size > 0
            ? Math.round((1 - (compressedBytes / file.size)) * 100)
            : 0;

        if(originalImg){
            originalImg.src = originalDataUrl;
        }

        if(previewImg){
            previewImg.src = compressedDataUrl;
        }

        if(originalInfo){
            originalInfo.innerText =
                "원본: " +
                formatBytes(file.size) +
                "\n파일명: " +
                file.name;
        }

        if(previewInfo){
            previewInfo.innerText =
                "압축 후: " +
                formatBytes(compressedBytes) +
                "\n절감: " +
                Math.max(0, savedRatio) +
                "%\n설정: " +
                settings.maxWidth +
                "px / " +
                Math.round(settings.jpegQuality * 100) +
                "%";
        }
    }catch(err){
        console.error(err);
        alert("압축 미리보기 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}

function safeStorageSegment(value){
    return String(value || "item")
    .replace(/[^a-zA-Z0-9_-]/g, "_")
    .replace(/_+/g, "_")
    .slice(0, 80) || "item";
}

function storageImagePath(kind){
    const genre = safeStorageSegment(currentGenre || "common");
    const machine = safeStorageSegment(currentMachine || "common");
    const random = Math.random().toString(36).slice(2, 10);

    if(kind === "logo"){
        return "global/logo_" +
            Date.now() + "_" +
            random +
            ".jpg";
    }

    if(String(kind).startsWith("figure_")){
        return "global/figureCatalog/" +
            kind +
            "_" +
            Date.now() + "_" +
            random +
            ".jpg";
    }

    if(String(kind).startsWith("schedule_original")){
        return "stores/" +
            safeStorageSegment(currentStoreId) +
            "/schedules/" +
            kind +
            "_" +
            Date.now() + "_" +
            random;
    }

    return "stores/" +
        safeStorageSegment(currentStoreId) +
        "/dollCraneImages/" +
        genre + "/" +
        machine + "/" +
        kind + "_" +
        Date.now() + "_" +
        random +
        ".jpg";
}

async function uploadDataUrlToStorage(dataUrl, path, options = {}){
    const response = await fetch(dataUrl);
    const blob = await response.blob();

    const { error } = await supabase
    .storage
    .from(supabaseBucket)
    .upload(path, blob, {
        contentType:"image/jpeg",
        cacheControl:"31536000",
        upsert:false
    });

    if(error){
        throw error;
    }

    const { data:publicData } = supabase
    .storage
    .from(supabaseBucket)
    .getPublicUrl(path);

    if(!publicData || !publicData.publicUrl){
        throw new Error("Supabase 공개 URL을 만들 수 없습니다. 버킷 공개 설정을 확인하세요.");
    }

    if(options.trackUsage !== false){
        addStorageUsage(blob.size);
    }

    return publicData.publicUrl;
}

async function uploadOriginalFileToStorage(file, path){
    const { error } = await supabase
    .storage
    .from(supabaseBucket)
    .upload(path, file, {
        contentType:file.type || "application/octet-stream",
        cacheControl:"31536000",
        upsert:false
    });

    if(error){
        throw error;
    }

    const { data:publicData } = supabase
    .storage
    .from(supabaseBucket)
    .getPublicUrl(path);

    if(!publicData || !publicData.publicUrl){
        throw new Error("Storage URL 생성 실패");
    }

    return publicData.publicUrl;
}

function isImageUrl(value){
    return typeof value === "string" &&
        /^https?:\/\//.test(value) &&
        (
            value.includes(supabaseUrl) ||
            value.includes("supabase.co/storage/v1/object/public")
        );
}

function getSupabaseObjectPath(url){
    try{
        const parsed = new URL(url);
        const marker = "/storage/v1/object/public/" + supabaseBucket + "/";
        const index = parsed.pathname.indexOf(marker);

        if(index === -1){
            return "";
        }

        return decodeURIComponent(parsed.pathname.slice(index + marker.length));
    }catch(err){
        return "";
    }
}

async function removeSupabaseObjectPaths(paths){
    const uniquePaths = Array.from(new Set(paths.filter(Boolean)));

    if(uniquePaths.length === 0){
        return;
    }

    const { error } = await supabase
    .storage
    .from(supabaseBucket)
    .remove(uniquePaths);

    if(error){
        throw error;
    }
}

async function listSupabaseObjectPaths(prefix = ""){
    let paths = [];
    let offset = 0;
    const limit = 1000;

    while(true){
        const { data:files, error } = await supabase
        .storage
        .from(supabaseBucket)
        .list(prefix, {
            limit:limit,
            offset:offset,
            sortBy:{
                column:"name",
                order:"asc"
            }
        });

        if(error){
            throw error;
        }

        if(!files || files.length === 0){
            break;
        }

        for(const file of files){
            const childPath = prefix ? prefix + "/" + file.name : file.name;

            if(isSupabaseFolder(file)){
                paths = paths.concat(await listSupabaseObjectPaths(childPath));
            }else{
                paths.push(childPath);
            }
        }

        if(files.length < limit){
            break;
        }

        offset += limit;
    }

    return paths;
}

function collectReferencedSupabasePaths(targetData){
    const paths = collectPhotoReferences(targetData)
    .map((refItem)=>getSupabaseObjectPath(refItem.parent[refItem.key]))
    .filter(Boolean);

    (appData.boardPosts || []).forEach((post)=>{
        getBoardPostImages(post).forEach((image)=>{
            const path = getSupabaseObjectPath(image.url);

            if(path){
                paths.push(path);
            }
        });
    });

    return new Set(paths);
}

async function removeUnreferencedCurrentStoreFiles(){
    const referencedPaths = collectReferencedSupabasePaths(data);
    let allPaths = await listSupabaseObjectPaths(
        "stores/" + safeStorageSegment(currentStoreId)
    );

    if(currentStoreId === DEFAULT_STORE_ID){
        allPaths = allPaths.concat(await listSupabaseObjectPaths("dollCraneImages"));
    }

    const unusedPaths = allPaths.filter((path)=>!referencedPaths.has(path));

    await removeSupabaseObjectPaths(unusedPaths);

    return unusedPaths.length;
}

function collectPhotoReferences(targetData){
    const refs = [];

    if(targetData.siteLogo){
        refs.push({
            parent:targetData,
            key:"siteLogo",
            kind:"legacy-logo"
        });
    }

    Object.keys(targetData.machines || {}).forEach((genre)=>{
        const machines = targetData.machines[genre] || {};

        Object.keys(machines).forEach((machineId)=>{
            const machine = machines[machineId];

            if(!machine || typeof machine !== "object"){
                return;
            }

            if(machine.photo){
                refs.push({
                    parent:machine,
                    key:"photo",
                    kind:"main"
                });
            }

            (machine.evidencePhotos || []).forEach((photoItem)=>{
                if(photoItem && photoItem.photo){
                    refs.push({
                        parent:photoItem,
                        key:"photo",
                        kind:"evidence"
                    });
                }
            });

            (machine.adminEvidencePhotos || []).forEach((photoItem)=>{
                if(photoItem && photoItem.photo){
                    refs.push({
                        parent:photoItem,
                        key:"photo",
                        kind:"admin-evidence"
                    });
                }
            });
        });
    });

    (targetData.trash || []).forEach((item)=>{
        if(item && item.type === "photo" && item.data && item.data.photo){
            refs.push({
                parent:item.data,
                key:"photo",
                kind:"trash"
            });
        }

        if(item && item.type === "machine" && item.data){
            if(item.data.photo){
                refs.push({
                    parent:item.data,
                    key:"photo",
                    kind:"trash-main"
                });
            }

            (item.data.evidencePhotos || []).forEach((photoItem)=>{
                if(photoItem && photoItem.photo){
                    refs.push({
                        parent:photoItem,
                        key:"photo",
                        kind:"trash-evidence"
                    });
                }
            });

            (item.data.adminEvidencePhotos || []).forEach((photoItem)=>{
                if(photoItem && photoItem.photo){
                    refs.push({
                        parent:photoItem,
                        key:"photo",
                        kind:"trash-admin-evidence"
                    });
                }
            });
        }

        if(item && item.type === "genre" && item.data){
            Object.keys(item.data || {}).forEach((machineId)=>{
                const machine = item.data[machineId];

                if(!machine || typeof machine !== "object"){
                    return;
                }

                if(machine.photo){
                    refs.push({
                        parent:machine,
                        key:"photo",
                        kind:"trash-genre-main"
                    });
                }

                (machine.evidencePhotos || []).forEach((photoItem)=>{
                    if(photoItem && photoItem.photo){
                        refs.push({
                            parent:photoItem,
                            key:"photo",
                            kind:"trash-genre-evidence"
                        });
                    }
                });

                (machine.adminEvidencePhotos || []).forEach((photoItem)=>{
                    if(photoItem && photoItem.photo){
                        refs.push({
                            parent:photoItem,
                            key:"photo",
                            kind:"trash-genre-admin-evidence"
                        });
                    }
                });
            });
        }
    });

    return refs.filter((refItem)=>{
        return isDataUrl(refItem.parent[refItem.key]) || isImageUrl(refItem.parent[refItem.key]);
    });
}

async function imageSourceToDataUrl(source){
    if(isDataUrl(source)){
        return source;
    }

    const response = await fetch(source);

    if(!response.ok){
        throw new Error("이미지 다운로드 실패: " + response.status);
    }

    const blob = await response.blob();

    return new Promise((resolve, reject)=>{
        const reader = new FileReader();

        reader.onerror = ()=>{
            reject(new Error("이미지 읽기 실패"));
        };

        reader.onload = (event)=>{
            resolve(event.target.result);
        };

        reader.readAsDataURL(blob);
    });
}

async function recompressPhotoReference(refItem, state){
    const source = refItem.parent[refItem.key];
    const oldPath = isImageUrl(source) ? getSupabaseObjectPath(source) : "";
    const sourceDataUrl = await imageSourceToDataUrl(source);
    const compressed = await compressDataUrl(sourceDataUrl);

    refItem.parent[refItem.key] = await uploadDataUrlToStorage(
        compressed,
        "stores/" +
        safeStorageSegment(currentStoreId) +
        "/dollCraneImages/recompressed/" +
        Date.now() + "_" +
        state.done +
        "_" +
        Math.random().toString(36).slice(2, 10) +
        ".jpg",
        {
            trackUsage:false
        }
    );

    if(oldPath){
        state.oldPaths.push(oldPath);
    }
}

async function migrateDataUrlsInPlace(value, state){
    if(Array.isArray(value)){
        for(let i = 0; i < value.length; i++){
            if(isDataUrl(value[i])){
                state.done++;
                document.getElementById("loading-text").innerText =
                    "사진 용량 정리 중... " + state.done + "/" + state.total;
                document.getElementById("progress-fill").style.width =
                    Math.round((state.done / state.total) * 90) + "%";

                const compressed = await compressDataUrl(value[i]);

                value[i] = await uploadDataUrlToStorage(
                    compressed,
                    "stores/" +
                    safeStorageSegment(currentStoreId) +
                    "/dollCraneImages/migration/" +
                    Date.now() + "_" +
                    state.done +
                    "_" +
                    Math.random().toString(36).slice(2, 10) +
                    ".jpg"
                );
            }else{
                await migrateDataUrlsInPlace(value[i], state);
            }
        }

        return;
    }

    if(value && typeof value === "object"){
        const keys = Object.keys(value);

        for(const key of keys){
            if(isDataUrl(value[key])){
                state.done++;
                document.getElementById("loading-text").innerText =
                    "사진 용량 정리 중... " + state.done + "/" + state.total;
                document.getElementById("progress-fill").style.width =
                    Math.round((state.done / state.total) * 90) + "%";

                const compressed = await compressDataUrl(value[key]);

                value[key] = await uploadDataUrlToStorage(
                    compressed,
                    "stores/" +
                    safeStorageSegment(currentStoreId) +
                    "/dollCraneImages/migration/" +
                    Date.now() + "_" +
                    state.done +
                    "_" +
                    Math.random().toString(36).slice(2, 10) +
                    ".jpg"
                );
            }else{
                await migrateDataUrlsInPlace(value[key], state);
            }
        }
    }
}

async function migratePhotosToStorage(){
    if(!requireStoreEdit()){
        return;
    }

    initializeData();

    const photoRefs = collectPhotoReferences(data);
    const total = photoRefs.length;

    if(total === 0){
        alert("정리할 사진 데이터가 없습니다.");
        toggleMenu(false);
        return;
    }

    if(!confirm(
        "저장된 사진 " +
        total +
        "개를 현재 압축 설정으로 다시 압축합니다.\n새 파일로 다시 업로드하고 DB의 사진 URL을 교체합니다.\n진행 중에는 화면을 닫지 마세요."
    )){
        return;
    }

    toggleMenu(false);

    const interval = showLoading("사진 용량 정리 중... 0/" + total);

    try{
        const state = {
            total:total,
            done:0,
            oldPaths:[]
        };

        for(const photoRef of photoRefs){
            state.done++;

            document.getElementById("loading-text").innerText =
                "사진 용량 정리 중... " + state.done + "/" + state.total;
            document.getElementById("progress-fill").style.width =
                Math.round((state.done / state.total) * 90) + "%";

            await recompressPhotoReference(photoRef, state);
        }

        await saveData(()=>{
            loadLogo();
            render(false);
        });

        if(state.oldPaths.length > 0){
            document.getElementById("loading-text").innerText =
                "이전 사진 파일 삭제 중...";

            await removeSupabaseObjectPaths(state.oldPaths);
        }

        document.getElementById("loading-text").innerText =
            "안 쓰는 사진 파일 정리 중...";

        const removedUnusedCount =
            await removeUnreferencedCurrentStoreFiles();

        document.getElementById("loading-text").innerText =
            "사진 용량 다시 계산 중...";

        appData.storageUsageBytes = await calculateTotalStorageUsage();

        await saveData(()=>{
            updateStorageBadge();
            render(false);
        });

        alert(
            "사진 용량 정리가 완료되었습니다.\n" +
            "안 쓰는 이전 파일 " +
            removedUnusedCount +
            "개를 정리했습니다."
        );
    }catch(err){
        console.error(err);
        alert("사진 용량 정리 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}
