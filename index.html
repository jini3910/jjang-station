<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>짱오락실 정답지</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:15px;
    background:#f2f2f2;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color:#222;
}

.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
}

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.hamburger{
    font-size:30px;
    cursor:pointer;
    user-select:none;
    padding:6px 12px;
    border-radius:10px;
}

.hamburger:active{
    background:#eee;
}

.storage-badge{
    flex-shrink:0;
    max-width:210px;
    padding:7px 10px;
    border:1px solid #ddd;
    border-radius:999px;
    background:#fafafa;
    color:#333;
    font-size:12px;
    font-weight:700;
    line-height:1.25;
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.storage-badge.warning{
    border-color:#ffb74d;
    background:#fff8e1;
    color:#a65b00;
}

.storage-badge.danger{
    border-color:#ef9a9a;
    background:#ffebee;
    color:#b71c1c;
}

.top-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    min-width:0;
}

.store-select{
    max-width:120px;
    padding:7px 8px;
    font-size:12px;
    font-weight:700;
    border-radius:999px;
}

.logo-wrap{
    width:100%;
    text-align:center;
    margin-bottom:20px;
    cursor:pointer;
}

.logo-img{
    width:100%;
    max-width:340px;
    border-radius:12px;
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.header-row h2{
    margin:0;
    font-size:18px;
    min-width:0;
}

.header-title{
    max-width:45%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

select{
    border:1px solid #ccc;
    border-radius:8px;
    padding:8px;
    font-size:13px;
    background:white;
}

.grid-1{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.item-wrapper{
    position:relative;
}

.item{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    transition:0.15s;
}

.item:active{
    transform:scale(0.98);
}

.list-mode{
    flex-direction:row;
    align-items:center;
    padding:10px;
    gap:12px;
}

.thumb-box{
    width:100%;
    padding-top:125%;
    background:#fafafa;
    position:relative;
    flex-shrink:0;
}

.list-mode .thumb-box{
    width:60px;
    height:75px;
    padding-top:0;
}

.thumb-box img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

.info-box{
    padding:10px;
    flex-grow:1;
    min-width:0;
}

.info-box b{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14px;
}

.info-box p{
    margin:5px 0 0;
    color:#666;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.no-photo .thumb-box{
    display:none;
}

.settings-btn{
    position:absolute;
    top:4px;
    right:4px;
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    opacity:0.25;
    transition:0.2s;
    z-index:5;
}

.settings-btn:hover{
    opacity:1;
}

.admin-menu{
    display:none;
    flex-wrap:wrap;
    gap:6px;
    padding:8px;
    margin-top:5px;
    border-radius:10px;
    background:#fafafa;
    border:1px solid #ddd;
}

.admin-menu.active{
    display:flex;
}

.btn-mini{
    width:auto;
    margin-top:0;
    border-radius:8px;
    padding:8px 12px;
    background:white;
    border:1px solid #ccc;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

button{
    border:none;
    width:100%;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
}

.btn-add{
    background:#4CAF50;
    color:white;
}

.btn-save{
    background:#2196F3;
    color:white;
}

.btn-back{
    background:#777;
    color:white;
}

.main-img{
    width:100%;
    min-height:240px;
    max-height:560px;
    object-fit:contain;
    background:#fafafa;
    border-radius:12px;
    border:1px solid #ddd;
    cursor:pointer;
}

textarea{
    width:100%;
    min-height:150px;
    border-radius:14px;
    border:1px solid #ddd;
    padding:16px;
    resize:none;
    font-size:15px;
    line-height:1.7;
    background:#fafafa;
    transition:0.15s;
}

textarea:focus{
    outline:none;
    border:1px solid #4CAF50;
    background:white;
}

textarea[readonly]{
    pointer-events:none;
}

textarea.expanded-mode{
    max-height:none;
    height:auto;
    overflow-y:hidden;
}

textarea.scroll-mode{
    height:300px;
    max-height:300px;
    overflow-y:auto;
}

.evidence-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.evidence-item{
    position:relative;
    padding-top:100%;
    border:1px solid #ddd;
    border-radius:12px;
    overflow:hidden;
    background:#fafafa;
}

.evidence-item img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    cursor:pointer;
}

.evidence-delete{
    position:absolute;
    top:4px;
    right:4px;
    width:28px;
    height:28px;
    margin:0;
    padding:0;
    background:rgba(0,0,0,0.65);
    color:white;
    border-radius:50%;
    line-height:28px;
}

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.92);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:40000;
}

.modal img{
    max-width:95%;
    max-height:92%;
    object-fit:contain;
}

.settings-modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:31000;
    padding:16px;
}

.settings-panel{
    width:100%;
    max-width:680px;
    max-height:92vh;
    overflow-y:auto;
    background:white;
    border-radius:12px;
    padding:18px;
}

.settings-panel h3{
    margin:0 0 12px;
}

.setting-row{
    margin-top:12px;
}

.setting-row label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:700;
}

.setting-row input[type="number"],
.setting-row input[type="file"]{
    width:100%;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
}

.setting-row input[type="range"]{
    width:100%;
}

.preview-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}

.preview-box{
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    background:#fafafa;
}

.preview-box img{
    width:100%;
    min-height:160px;
    max-height:260px;
    object-fit:contain;
    background:white;
    border:1px solid #eee;
    border-radius:8px;
    cursor:pointer;
}

.preview-box div{
    margin-top:8px;
    color:#555;
    font-size:12px;
    line-height:1.5;
}

.settings-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.settings-actions button{
    margin-top:0;
}

#loading{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
    z-index:20000;
    display:none;
    min-width:240px;
    text-align:center;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#ddd;
    border-radius:999px;
    overflow:hidden;
    margin-top:14px;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#4CAF50;
    transition:0.2s;
}

#side-menu{
    position:fixed;
    top:0;
    left:-260px;
    width:240px;
    height:100%;
    background:white;
    z-index:30000;
    transition:0.2s;
    overflow-y:auto;
    box-shadow:4px 0 12px rgba(0,0,0,0.2);
}

#side-menu.active{
    left:0;
}

#side-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    z-index:29999;
    display:none;
}

#side-overlay.active{
    display:block;
}

.menu-header{
    padding:20px;
    font-size:20px;
    font-weight:700;
    border-bottom:1px solid #eee;
}

.menu-item{
    padding:18px 20px;
    border-bottom:1px solid #f3f3f3;
    cursor:pointer;
}

.menu-item:active{
    background:#f5f5f5;
}

.login-panel{
    display:none;
    padding:14px;
    border-bottom:1px solid #eee;
    background:#fafafa;
}

.login-panel.active{
    display:block;
}

.login-panel input,
.login-panel select{
    width:100%;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
    font-size:13px;
}

.login-checks{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:10px;
    font-size:12px;
    color:#333;
}

.login-checks label{
    display:flex;
    align-items:center;
    gap:7px;
}

.login-checks input{
    width:auto;
    margin:0;
}

.login-panel button{
    padding:10px;
    margin-top:8px;
    font-size:13px;
}

.login-status{
    padding:12px 20px;
    border-bottom:1px solid #eee;
    color:#666;
    font-size:12px;
    line-height:1.4;
}

.auth-locked #content{
    filter:blur(9px);
    pointer-events:none;
    user-select:none;
}

.center-login{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(255,255,255,0.68);
    z-index:25000;
}

.auth-locked .center-login{
    display:flex;
}

.center-login-card{
    width:100%;
    max-width:340px;
    background:white;
    border:1px solid #ddd;
    border-radius:14px;
    padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
}

.center-login-card h3{
    margin:0 0 12px;
    font-size:18px;
}

.center-login-card input{
    width:100%;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:11px;
    font-size:14px;
}

.center-login-card button{
    margin-top:10px;
}

.memo-section{
    margin-top:20px;
    position:relative;
}

.memo-toggle{
    position:absolute;
    top:-36px;
    right:0;
    width:auto;
    margin-top:0;
    padding:7px 10px;
    font-size:12px;
    border-radius:8px;
    background:#f2f2f2;
    color:#222;
    border:1px solid #ccc;
    cursor:pointer;
}

.detail-section{
    margin-top:20px;
    border-top:1px solid #eee;
    padding-top:15px;
}

.section-title{
    font-weight:bold;
    font-size:13px;
}

.trash-item{
    background:#fff7df;
    border:1px solid #ffd54f;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.trash-title{
    font-weight:700;
    font-size:14px;
    margin-bottom:6px;
}

.trash-date{
    font-size:12px;
    color:#666;
    margin-bottom:6px;
}

.trash-dday{
    font-size:12px;
    color:#d9534f;
}

.trash-buttons{
    display:flex;
    flex-shrink:0;
    gap:6px;
}

.empty-message{
    text-align:center;
    color:#999;
    padding:40px 0;
}

.sub-text{
    font-size:13px;
    color:#666;
    margin-bottom:15px;
}

.account-table-wrap{
    width:100%;
    overflow-x:auto;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
}

.account-table{
    width:100%;
    min-width:760px;
    border-collapse:collapse;
    font-size:13px;
}

.account-table th,
.account-table td{
    padding:9px;
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:top;
}

.account-table th{
    background:#fafafa;
    font-weight:700;
}

.account-table input,
.account-table select{
    width:100%;
    min-width:90px;
    padding:7px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:12px;
}

.store-checks{
    display:grid;
    grid-template-columns:repeat(2,minmax(120px,1fr));
    gap:5px 8px;
}

.store-checks label{
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
}

.store-checks input{
    width:auto;
    min-width:0;
}

.account-actions{
    display:flex;
    gap:6px;
}

.account-actions .btn-mini{
    padding:7px 9px;
}

@media(max-width:600px){
    .grid-3{
        grid-template-columns:repeat(2,1fr);
    }

    .trash-item{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

</div>

<div class="center-login" id="center-login">

            <label>
                <input type="checkbox" id="center-remember-login">

            <label>
                <input type="checkbox" id="center-auto-login">
                자동 로그인

<div class="modal" id="modal">

            <button class="btn-back" id="compression-close-btn">닫기</button>

    </div>
</div>

function sanitizeText(text){
    return String(text || "")
    .replace(/[\uFE0E\uFE0F]/g,"")
    .replace(/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"")
    .trim();
}

function isValidDataKey(text){
    return !/[.#$/[\]]/.test(text);
}

function naturalMachineCompare(a, b){
    const left = String(a).match(/\d+|\D+/g) || [String(a)];
    const right = String(b).match(/\d+|\D+/g) || [String(b)];
    const length = Math.max(left.length, right.length);

    for(let i = 0; i < length; i++){
        if(left[i] === undefined){
            return -1;
        }

        if(right[i] === undefined){
            return 1;
        }

        const leftIsNumber = /^\d+$/.test(left[i]);
        const rightIsNumber = /^\d+$/.test(right[i]);

        if(leftIsNumber && rightIsNumber){
            const diff = Number(left[i]) - Number(right[i]);

            if(diff !== 0){
                return diff;
            }

            const lengthDiff = left[i].length - right[i].length;

            if(lengthDiff !== 0){
                return lengthDiff;
            }
        }else{
            const diff = left[i].localeCompare(right[i], "ko-KR", {
                numeric:true,
                sensitivity:"base"
            });

            if(diff !== 0){
                return diff;
            }
        }
    }

    return String(a).localeCompare(String(b), "ko-KR", {
        numeric:true,
        sensitivity:"base"
    });
}

function hasLegacyStoreShape(value){
    return value &&

        (
            Array.isArray(value.genres) ||
            value.machines ||
            value.trash ||
            Object.prototype.hasOwnProperty.call(value, "siteLogo")
        ) &&
        !value.stores;
}

function initializeAppData(raw){
    if(hasLegacyStoreShape(raw)){
        appData = {
            stores:{
                [DEFAULT_STORE_ID]:{
                    ...createEmptyStore(),
                    ...raw
                }
            },
            storeOrder:[DEFAULT_STORE_ID],
            storeNames:{
                [DEFAULT_STORE_ID]:DEFAULT_STORE_NAME
            },
            siteLogo:typeof raw.siteLogo === "string" ? raw.siteLogo : null,
            compressionSettings:{...DEFAULT_COMPRESSION_SETTINGS},
            storageUsageBytes:typeof raw.storageUsageBytes === "number"
                ? raw.storageUsageBytes
                : Number(raw.storageUsageBytes) || 0,
            storeTrash:[],
            accounts:{},
            userRoles:{},
            userPasswords:{}
        };
    }else if(raw && typeof raw === "object" && raw.stores){
        appData = {
            stores:raw.stores || {},
            storeOrder:Array.isArray(raw.storeOrder) ? raw.storeOrder : Object.keys(raw.stores || {}),
            storeNames:raw.storeNames && typeof raw.storeNames === "object" ? raw.storeNames : {},
            siteLogo:typeof raw.siteLogo === "string" ? raw.siteLogo : null,
            compressionSettings:raw.compressionSettings && typeof raw.compressionSettings === "object"
                ? raw.compressionSettings
                : {...DEFAULT_COMPRESSION_SETTINGS},
            storageUsageBytes:typeof raw.storageUsageBytes === "number"
                ? raw.storageUsageBytes
                : Number(raw.storageUsageBytes) || 0,
            storeTrash:Array.isArray(raw.storeTrash) ? raw.storeTrash : [],
            accounts:raw.accounts && typeof raw.accounts === "object" ? raw.accounts : {},
            userRoles:raw.userRoles && typeof raw.userRoles === "object" ? raw.userRoles : {},
            userPasswords:raw.userPasswords && typeof raw.userPasswords === "object" ? raw.userPasswords : {}
        };
    }

    if(!appData.stores || typeof appData.stores !== "object"){
        appData.stores = {};
    }

    if(!Array.isArray(appData.storeOrder)){
        appData.storeOrder = Object.keys(appData.stores);
    }

    if(!appData.storeNames || typeof appData.storeNames !== "object"){
        appData.storeNames = {};
    }

    if(typeof appData.siteLogo !== "string"){
        appData.siteLogo = null;
    }

    if(!appData.compressionSettings || typeof appData.compressionSettings !== "object"){
        appData.compressionSettings = {...DEFAULT_COMPRESSION_SETTINGS};
    }

    if(typeof appData.storageUsageBytes !== "number" || !Number.isFinite(appData.storageUsageBytes)){
        appData.storageUsageBytes = Object.values(appData.stores || {}).reduce((sum, store)=>{
            return sum + (Number(store && store.storageUsageBytes) || 0);
        }, 0);
    }

    appData.compressionSettings.maxWidth = Math.min(
        2400,
        Math.max(
            100,
            Number(appData.compressionSettings.maxWidth) || DEFAULT_COMPRESSION_SETTINGS.maxWidth
        )
    );

    appData.compressionSettings.jpegQuality = Math.min(
        0.9,
        Math.max(
            0.01,
            Number(appData.compressionSettings.jpegQuality) || DEFAULT_COMPRESSION_SETTINGS.jpegQuality
        )
    );

    if(!Array.isArray(appData.storeTrash)){
        appData.storeTrash = [];
    }

    if(!appData.accounts || typeof appData.accounts !== "object"){
        appData.accounts = {};
    }

    if(!appData.userRoles || typeof appData.userRoles !== "object"){
        appData.userRoles = {};
    }

    if(!appData.userPasswords || typeof appData.userPasswords !== "object"){
        appData.userPasswords = {};
    }

    Object.keys(appData.userRoles || {}).forEach((loginId)=>{
        const legacyCode = "legacy_" + normalizeLoginId(loginId);

        if(appData.accounts[legacyCode]){
            return;
        }

        const legacyRole = appData.userRoles[loginId] || {};

        appData.accounts[legacyCode] = {
            code:legacyCode,
            loginId:normalizeLoginId(loginId),
            passwordHash:appData.userPasswords[loginId] || "",
            role:legacyRole.role === "master" ? "master" : legacyRole.role === "manager" ? "manager" : "staff",
            storeIds:legacyRole.role === "manager" && legacyRole.storeId
                ? [legacyRole.storeId]
                : Object.keys(appData.stores || {}),
            createdAt:new Date().toISOString()
        };
    });

    if(!appData.stores[DEFAULT_STORE_ID] && appData.storeOrder.length === 0){
        appData.stores[DEFAULT_STORE_ID] = createEmptyStore();
        appData.storeOrder.push(DEFAULT_STORE_ID);
        appData.storeNames[DEFAULT_STORE_ID] = DEFAULT_STORE_NAME;
    }

    Object.keys(appData.stores).forEach((storeId)=>{
        if(!appData.storeOrder.includes(storeId)){
            appData.storeOrder.push(storeId);
        }

        if(!appData.storeNames[storeId]){
            appData.storeNames[storeId] = storeId === DEFAULT_STORE_ID ? DEFAULT_STORE_NAME : storeId;
        }
    });

    if(!appData.siteLogo){
        const yongsanStore = appData.stores[DEFAULT_STORE_ID];
        const firstStore = appData.stores[appData.storeOrder[0]];

        if(yongsanStore && typeof yongsanStore.siteLogo === "string" && yongsanStore.siteLogo){
            appData.siteLogo = yongsanStore.siteLogo;
        }else if(firstStore && typeof firstStore.siteLogo === "string" && firstStore.siteLogo){
            appData.siteLogo = firstStore.siteLogo;
        }
    }

    if(!appData.stores[currentStoreId]){
        currentStoreId = appData.storeOrder[0] || DEFAULT_STORE_ID;
        localStorage.setItem("currentStoreId", currentStoreId);
    }

    data = appData.stores[currentStoreId] || createEmptyStore();
    initializeData();
    appData.stores[currentStoreId] = data;
}

function normalizeLoginId(id){

async function hashPassword(password){
    if(!window.crypto || !crypto.subtle){
        let hash = 5381;

        for(let i = 0; i < password.length; i++){
            hash = ((hash << 5) + hash) + password.charCodeAt(i);
            hash = hash >>> 0;
        }

        return "fallback:" + hash.toString(16);
    }

    const bytes = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", bytes);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return "sha256:" + hashArray.map((byte)=>byte.toString(16).padStart(2,"0")).join("");
}

    const centerRememberInput = document.getElementById("center-remember-login");
    const centerAutoInput = document.getElementById("center-auto-login");

    if(rememberInput){
        rememberInput.checked = remember;
    }

    if(centerRememberInput){
        centerRememberInput.checked = remember;
    }

    if(autoInput){
        autoInput.checked = auto;
    }

    if(centerAutoInput){
        centerAutoInput.checked = auto;
    }

    if((remember || auto) && idInput){
        idInput.value = savedId;
    }

    if((remember || auto) && centerIdInput){
        centerIdInput.value = savedId;
    }

    if((remember || auto) && passwordInput){
        passwordInput.value = savedPassword;
    }

    if((remember || auto) && centerPasswordInput){
        centerPasswordInput.value = savedPassword;
    }
}

function saveLoginOptions(loginId, password){
    const rememberInput = document.getElementById("remember-login");
    const autoInput = document.getElementById("auto-login");
    const centerRememberInput = document.getElementById("center-remember-login");
    const centerAutoInput = document.getElementById("center-auto-login");
    const remember = !!(
        (rememberInput && rememberInput.checked) ||
        (centerRememberInput && centerRememberInput.checked)
    );
    const auto = !!(
        (autoInput && autoInput.checked) ||
        (centerAutoInput && centerAutoInput.checked)
    );
    const shouldSaveCredentials = remember || auto;

    localStorage.setItem("rememberLogin", remember ? "true" : "false");
    localStorage.setItem("autoLogin", auto ? "true" : "false");

    if(rememberInput){
        rememberInput.checked = remember;
    }

    if(centerRememberInput){
        centerRememberInput.checked = remember;
    }

    if(autoInput){
        autoInput.checked = auto;
    }

    if(centerAutoInput){
        centerAutoInput.checked = auto;
    }

    if(shouldSaveCredentials){
        localStorage.setItem("savedLoginId", loginId);
        localStorage.setItem("savedLoginPassword", password);
    }else{
        localStorage.removeItem("savedLoginId");
        localStorage.removeItem("savedLoginPassword");
    }
}

async function validateLogin(loginId, password){
    const isDefaultMaster =
        loginId === DEFAULT_MASTER_ID &&
        password === DEFAULT_MASTER_PASSWORD;

    if(isDefaultMaster){
        return "__default_master";
    }

    const accountCode = findAccountCodeByLoginId(loginId);
    const account = accountCode ? appData.accounts[accountCode] : null;
    const savedPassword = account && account.passwordHash;
    const passwordHash = await hashPassword(password);
    const hasSavedAccount =
        account &&
        savedPassword &&
        (
            savedPassword === passwordHash ||
            savedPassword === password
        );

    if(!hasSavedAccount){
        throw new Error("아이디 또는 비밀번호가 올바르지 않습니다.");
    }

    return accountCode;
}

async function tryAutoLogin(){
    if(autoLoginAttempted || currentLoginId){
        return;
    }

    autoLoginAttempted = true;

    if(localStorage.getItem("autoLogin") !== "true"){
        return;
    }

    const savedId = normalizeLoginId(localStorage.getItem("savedLoginId") || "");
    const savedPassword = localStorage.getItem("savedLoginPassword") || "";

    if(!savedId || !savedPassword){
        return;
    }

    try{
        const accountCode = await validateLogin(savedId, savedPassword);
        currentLoginId = savedId;
        currentAccountCode = accountCode;
        updateAuthUI();
        render(false);
    }catch(err){
        console.error(err);
        localStorage.setItem("autoLogin", "false");
        const autoInput = document.getElementById("auto-login");

        if(autoInput){
            autoInput.checked = false;
        }
    }
}

async function loginWithId(){
    const idInput = document.getElementById("login-id");
    const passwordInput = document.getElementById("login-password");
    const centerIdInput = document.getElementById("center-login-id");
    const centerPasswordInput = document.getElementById("center-login-password");
    const rawId =
        idInput && idInput.value
            ? idInput.value
            : centerIdInput
                ? centerIdInput.value
                : "";
    const rawPassword =
        passwordInput && passwordInput.value
            ? passwordInput.value
            : centerPasswordInput
                ? centerPasswordInput.value
                : "";
    const loginId = normalizeLoginId(rawId);
    const password = rawPassword;

    if(!loginId || !password){
        alert("아이디와 비밀번호를 입력하세요.");
        return;
    }

    const interval = showLoading("로그인 중...");

    try{
        const accountCode = await validateLogin(loginId, password);
        currentLoginId = loginId;
        currentAccountCode = accountCode;
        saveLoginOptions(loginId, password);

        if(passwordInput){
            const shouldKeepPassword =
                localStorage.getItem("rememberLogin") === "true" ||
                localStorage.getItem("autoLogin") === "true";

            if(!shouldKeepPassword){
                passwordInput.value = "";
            }
        }

        if(centerPasswordInput){
            const shouldKeepPassword =
                localStorage.getItem("rememberLogin") === "true" ||
                localStorage.getItem("autoLogin") === "true";

            if(!shouldKeepPassword){
                centerPasswordInput.value = "";
            }
        }

        updateAuthUI();
        render(false);
        alert("로그인되었습니다.");
    }catch(err){
        console.error(err);
        alert("로그인 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}

async function logoutUser(){

function getStoreSelectionPrompt(){
    return appData.storeOrder
    .filter((storeId)=>appData.stores[storeId])
    .map((storeId, index)=>{
        return (index + 1) + ". " + (appData.storeNames[storeId] || storeId);
    })
    .join("\n");
}

function parseStoreSelection(input){
    const activeStoreIds = appData.storeOrder.filter((storeId)=>appData.stores[storeId]);

    if(String(input).trim().toLowerCase() === "all"){
        return activeStoreIds;
    }

    const selected = String(input)
    .split(",")
    .map((value)=>Number(value.trim()) - 1)
    .filter((index)=>Number.isInteger(index) && index >= 0 && index < activeStoreIds.length)
    .map((index)=>activeStoreIds[index]);

    return Array.from(new Set(selected));
}

function describeAccount(account){
    const roleName =
        account.role === "master"
            ? "본사 게임마스터"
            : account.role === "manager"
                ? "지점 관리자"
                : "일반 직원";
    const storeNames = account.storeIds && account.storeIds.includes("*")
        ? "전체 지점"
        : (account.storeIds || []).map((storeId)=>appData.storeNames[storeId] || storeId).join(", ");

    return account.code + " / " + account.loginId + " / " + roleName + " / " + (storeNames || "접속 지점 없음");
}

async function createManagedAccount(){
    let loginId = prompt("새 계정 아이디를 입력하세요.");

    if(loginId === null){
        return;
    }

    loginId = normalizeLoginId(loginId);

    if(!loginId){
        alert("아이디를 입력하세요.");
        return;
    }

    if(loginId === DEFAULT_MASTER_ID || findAccountCodeByLoginId(loginId)){
        alert("이미 사용 중인 아이디입니다.");
        return;
    }

    let password = prompt("비밀번호를 입력하세요.");

    if(password === null){
        return;
    }

    password = password.trim();

    if(!password){
        alert("비밀번호를 입력하세요.");

function renderStoreSelector(){
    const select = document.getElementById("store-select");

    if(!select){
        return;
    }

    select.innerHTML = "";

    const visibleStoreIds = appData.storeOrder.filter((storeId)=>{
        return appData.stores[storeId] && (!getLoginId() || canAccessStore(storeId));
    });

    if(getLoginId() && visibleStoreIds.length > 0 && !visibleStoreIds.includes(currentStoreId)){
        currentStoreId = visibleStoreIds[0];
        data = appData.stores[currentStoreId];
    }

    appData.storeOrder.forEach((storeId)=>{
        if(!appData.stores[storeId]){
            return;
        }

        }

        option.value = storeId;
        option.innerText = appData.storeNames[storeId] || storeId;
        select.appendChild(option);

        const addOption = document.createElement("option");

        addOption.innerText = "+ 지점 추가";
        select.appendChild(addOption);
    }

function createStoreId(name){
    const cleaned = sanitizeText(name)
    .toLowerCase()
    .replace(/\s+/g, "_")
    .replace(/[^a-z0-9가-힣_-]/g, "_")
    .replace(/_+/g, "_")
    .replace(/^_+|_+$/g, "");

    return cleaned || "store_" + Date.now();
}

function addStore(){
    if(!requireStoreManage()){
        renderStoreSelector();
        return;
    }

    let storeName = prompt("추가할 지점명 입력");

    if(storeName === null){
        renderStoreSelector();
        return;
    }

    storeName = sanitizeText(storeName);

    if(!storeName){
        alert("지점명을 입력하세요.");
        renderStoreSelector();
        return;
    }

    if(!isValidDataKey(storeName)){
        alert("지점명에는 . # $ / [ ] 문자를 사용할 수 없습니다.");
        renderStoreSelector();
        return;
    }

    let storeId = createStoreId(storeName);
    let suffix = 2;

    while(appData.stores[storeId]){
        storeId = createStoreId(storeName) + "_" + suffix;
        suffix++;
    }

    appData.stores[storeId] = createEmptyStore();
    appData.storeOrder.push(storeId);

function initializeData(){
    if(!data || typeof data !== "object"){
        data = {};
    }

    if(!Array.isArray(data.genres)){
        data.genres = [];
    }

    if(!data.machines || typeof data.machines !== "object" || Array.isArray(data.machines)){
        data.machines = {};
    }

    if(!Array.isArray(data.trash)){
        data.trash = [];
    }

    if(typeof data.siteLogo !== "string"){
        data.siteLogo = null;
    }

    if(typeof data.storageUsageBytes !== "number" || !Number.isFinite(data.storageUsageBytes)){
        data.storageUsageBytes = 0;
    }

    data.genres.forEach((genre)=>{
        if(!data.machines[genre] || typeof data.machines[genre] !== "object"){
            data.machines[genre] = {};
        }

        Object.keys(data.machines[genre]).forEach((machine)=>{
            const machineData = data.machines[genre][machine];

            if(!machineData || typeof machineData !== "object" || Array.isArray(machineData)){
                data.machines[genre][machine] = {
                    photo:"",
                    memo:"",
                    evidencePhotos:[]
                };
                return;
            }

            if(typeof machineData.photo !== "string"){
                machineData.photo = "";
            }

            if(typeof machineData.memo !== "string"){
                machineData.memo = "";
            }

            if(!Array.isArray(machineData.evidencePhotos)){
                machineData.evidencePhotos = [];
            }
        });
    });
}

function autoTrashClean(){
    if(!Array.isArray(data.trash)){
        data.trash = [];
    }

    const now = Date.now();

    data.trash = data.trash.filter((item)=>{
        const deletedTime = new Date(item.deletedAt).getTime();
        return Number.isFinite(deletedTime) && now - deletedTime < TRASH_LIMIT_MS;
    });
}

function getJsonSizeBytes(value){
    const json = JSON.stringify(value);

    if(window.TextEncoder){
        return new TextEncoder().encode(json).length;
    }

    return new Blob([json]).size;
}

function formatBytes(bytes){
    if(bytes >= 1024 * 1024){
        return (bytes / 1024 / 1024).toFixed(1) + "MB";
    }

    if(bytes >= 1024){
        return (bytes / 1024).toFixed(1) + "KB";
    }

    return bytes + "B";
}

function addStorageUsage(bytes){
    appData.storageUsageBytes =
        (Number(appData.storageUsageBytes) || 0) +
        bytes;
    updateStorageBadge();
}

function updateStorageBadge(){
    const badge = document.getElementById("storage-badge");

    if(!badge){
        return;
    }

    const used = Math.max(0, appData.storageUsageBytes || 0);
    const ratio = used / SUPABASE_FREE_STORAGE_BYTES;
    const remaining = Math.max(0, SUPABASE_FREE_STORAGE_BYTES - used);
    const dbSize = getJsonSizeBytes(appData);

    badge.classList.toggle("warning", ratio >= 0.7 && ratio < 0.9);
    badge.classList.toggle("danger", ratio >= 0.9);

    badge.innerText =
        "사진 " +
        formatBytes(used) +
        " / " +
        formatBytes(SUPABASE_FREE_STORAGE_BYTES);

    badge.title =
        "Supabase Storage 전체 사용량: " +
        formatBytes(used) +
        " 사용, " +
        formatBytes(remaining) +
        " 남음\nFirebase DB 크기: " +
        formatBytes(dbSize) +
        "\n이 값은 이 앱에서 업로드/정리한 사진 기준의 예상치입니다.";
}

function getSupabaseFileSize(file){
    if(!file || !file.metadata){
        return 0;
    }

    if(typeof file.metadata.size === "number"){
        return file.metadata.size;
    }

    if(typeof file.metadata.contentLength === "number"){
        return file.metadata.contentLength;
    }

    return 0;
}

function isSupabaseFolder(file){
    return file && !file.metadata;
}

async function getSupabaseStorageUsage(prefix = ""){
    let total = 0;
    let offset = 0;
    const limit = 1000;

    while(true){
        const { data:files, error } = await supabase
        .storage
        .from(supabaseBucket)
        .list(prefix, {
            limit:limit,
            offset:offset,
            sortBy:{
                column:"name",
                order:"asc"
            }
        });

        if(error){
            throw error;
        }

        if(!files || files.length === 0){
            break;
        }

        for(const file of files){
            if(isSupabaseFolder(file)){
                const childPrefix = prefix ? prefix + "/" + file.name : file.name;
                total += await getSupabaseStorageUsage(childPrefix);
            }else{
                total += getSupabaseFileSize(file);
            }
        }

        if(files.length < limit){
            break;
        }

        offset += limit;
    }

    return total;
}

function withTimeout(promise, milliseconds, message){
    let timeoutId = null;

    const timeout = new Promise((_, reject)=>{
        timeoutId = setTimeout(()=>{
            reject(new Error(message));
        }, milliseconds);
    });

    return Promise.race([promise, timeout])
    .finally(()=>{
        clearTimeout(timeoutId);
    });
}

function showLoading(text = "저장 중..."){

    const loadingText = document.getElementById("loading-text");

    loading.style.display = "block";

        if(percent > 90){

        fill.style.width = percent + "%";

    return interval;
}

function hideLoading(interval){
    clearInterval(interval);

    const fill = document.getElementById("progress-fill");
    fill.style.width = "100%";

    setTimeout(()=>{
        document.getElementById("loading").style.display = "none";

async function saveData(callback){
    if(callback){
        queuedCallbacks.push(callback);
    }

    if(saving){
        saveQueued = true;
        return;
    }

    saving = true;
    const interval = showLoading("💾 저장 중...");

    try{
        syncCurrentStoreData();

        const dataSize = getJsonSizeBytes(appData);

        if(dataSize > SAFE_WRITE_LIMIT_BYTES){
            throw new Error(
                "데이터가 너무 큽니다. 현재 " +
                formatBytes(dataSize) +
                " / SDK 1회 저장 제한 " +
                formatBytes(SDK_WRITE_LIMIT_BYTES) +
                " 입니다. 오래된 사진을 줄이거나 Supabase Storage로 분리해야 합니다."
            );
        }

        await withTimeout(
            set(ref(database, "dollCraneData"), appData),
            SAVE_TIMEOUT_MS,
            "저장 응답이 30초 이상 없습니다. 인터넷 연결, Firebase 권한, 데이터 용량을 확인하세요."
        );

        hideLoading(interval);
        updateStorageBadge();

        const callbacks = queuedCallbacks.splice(0);
        callbacks.forEach((fn)=>{
            try{
                fn();
            }catch(err){
                console.error(err);
            }
        });
    }catch(err){
        hideLoading(interval);
        console.error(err);
        alert("저장 실패: " + err.message);
    }finally{
        saving = false;

        if(saveQueued){
            saveQueued = false;
            saveData();
        }
    }
}

function compressImage(file){
    return new Promise((resolve, reject)=>{
        const reader = new FileReader();

        reader.onerror = ()=>{
            reject(new Error("파일 읽기 실패"));
        };

        reader.onload = (event)=>{
            const img = new Image();

            img.onerror = ()=>{
                reject(new Error("이미지 로드 실패"));
            };

            img.onload = ()=>{
                try{
                    const settings = getCompressionSettings();
                    const canvas = document.createElement("canvas");

                    let width = img.width;
                    let height = img.height;

                    if(width > settings.maxWidth){
                        height *= settings.maxWidth / width;
                        width = settings.maxWidth;
                    }

                    canvas.width = Math.round(width);
                    canvas.height = Math.round(height);

                    const ctx = canvas.getContext("2d");

                    if(!ctx){
                        reject(new Error("Canvas 오류"));
                        return;
                    }

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    resolve(canvas.toDataURL("image/jpeg", settings.jpegQuality));
                }catch(err){
                    reject(err);
                }
            };

            img.src = event.target.result;
        };

        reader.readAsDataURL(file);
    });
}

function compressDataUrl(dataUrl, overrideSettings){
    return new Promise((resolve, reject)=>{
        const img = new Image();

        img.onerror = ()=>{
            reject(new Error("이미지 로드 실패"));
        };

        img.onload = ()=>{
            try{
                const settings = overrideSettings || getCompressionSettings();
                const canvas = document.createElement("canvas");
                let width = img.width;
                let height = img.height;

                if(width > settings.maxWidth){
                    height *= settings.maxWidth / width;
                    width = settings.maxWidth;
                }

                canvas.width = Math.round(width);
                canvas.height = Math.round(height);

                const ctx = canvas.getContext("2d");

                if(!ctx){
                    reject(new Error("Canvas 오류"));
                    return;
                }

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                resolve(canvas.toDataURL("image/jpeg", settings.jpegQuality));
            }catch(err){
                reject(err);
            }
        };

        img.src = dataUrl;
    });
}

function isDataUrl(value){
    return typeof value === "string" && /^data:image\/[a-zA-Z0-9.+-]+;base64,/.test(value);
}

function readFileAsDataUrl(file){
    return new Promise((resolve, reject)=>{
        const reader = new FileReader();

        reader.onerror = ()=>{
            reject(new Error("파일 읽기 실패"));
        };

        reader.onload = (event)=>{
            resolve(event.target.result);
        };

        reader.readAsDataURL(file);
    });
}

async function getDataUrlSizeBytes(dataUrl){
    const response = await fetch(dataUrl);
    const blob = await response.blob();
    return blob.size;
}

async function generateCompressionPreview(){
    const input = document.getElementById("compression-test-file");
    const originalImg = document.getElementById("compression-original-img");
    const previewImg = document.getElementById("compression-preview-img");
    const originalInfo = document.getElementById("compression-original-info");
    const previewInfo = document.getElementById("compression-preview-info");
    const file = input && input.files && input.files[0];

    if(!file){
        alert("테스트 사진을 선택하세요.");
        return;
    }

    const interval = showLoading("압축 미리보기 생성 중...");

    try{
        const originalDataUrl = await readFileAsDataUrl(file);
        const settings = getCompressionControlsSettings();
        const compressedDataUrl = await compressDataUrl(originalDataUrl, settings);
        const compressedBytes = await getDataUrlSizeBytes(compressedDataUrl);
        const savedRatio = file.size > 0
            ? Math.round((1 - (compressedBytes / file.size)) * 100)
            : 0;

        if(originalImg){
            originalImg.src = originalDataUrl;
        }

        if(previewImg){
            previewImg.src = compressedDataUrl;
        }

        if(originalInfo){
            originalInfo.innerText =
                "원본: " +
                formatBytes(file.size) +
                "\n파일명: " +
                file.name;
        }

        if(previewInfo){
            previewInfo.innerText =
                "압축 후: " +
                formatBytes(compressedBytes) +
                "\n절감: " +
                Math.max(0, savedRatio) +
                "%\n설정: " +
                settings.maxWidth +
                "px / " +
                Math.round(settings.jpegQuality * 100) +
                "%";
        }
    }catch(err){
        console.error(err);
        alert("압축 미리보기 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}

function safeStorageSegment(value){
    return String(value || "item")
    .replace(/[^a-zA-Z0-9_-]/g, "_")
    .replace(/_+/g, "_")
    .slice(0, 80) || "item";
}

function storageImagePath(kind){

async function uploadDataUrlToStorage(dataUrl, path, options = {}){
    const response = await fetch(dataUrl);
    const blob = await response.blob();

    const { error } = await supabase
    .storage
    .from(supabaseBucket)
    .upload(path, blob, {
        contentType:"image/jpeg",
        cacheControl:"31536000",
        upsert:false
    });

    if(error){
        throw error;
    }

    const { data:publicData } = supabase
    .storage
    .from(supabaseBucket)
    .getPublicUrl(path);

    if(!publicData || !publicData.publicUrl){
        throw new Error("Supabase 공개 URL을 만들 수 없습니다. 버킷 공개 설정을 확인하세요.");
    }

    if(options.trackUsage !== false){
        addStorageUsage(blob.size);
    }

    return publicData.publicUrl;
}

async function compressAndUploadImage(file, kind){
    const compressed = await compressImage(file);

}

function isImageUrl(value){
    return typeof value === "string" &&
        /^https?:\/\//.test(value) &&
        (
            value.includes(supabaseUrl) ||
            value.includes("supabase.co/storage/v1/object/public")
        );
}

function getSupabaseObjectPath(url){
    try{
        const parsed = new URL(url);
        const marker = "/storage/v1/object/public/" + supabaseBucket + "/";
        const index = parsed.pathname.indexOf(marker);

        if(index === -1){
            return "";
        }

        return decodeURIComponent(parsed.pathname.slice(index + marker.length));
    }catch(err){
        return "";
    }
}

async function removeSupabaseObjectPaths(paths){
    const uniquePaths = Array.from(new Set(paths.filter(Boolean)));

    if(uniquePaths.length === 0){
        return;
    }

    const { error } = await supabase
    .storage
    .from(supabaseBucket)
    .remove(uniquePaths);

    if(error){
        throw error;
    }
}

async function listSupabaseObjectPaths(prefix = ""){
    let paths = [];
    let offset = 0;
    const limit = 1000;

    while(true){
        const { data:files, error } = await supabase
        .storage
        .from(supabaseBucket)
        .list(prefix, {
            limit:limit,
            offset:offset,
            sortBy:{
                column:"name",
                order:"asc"
            }
        });

        if(error){
            throw error;
        }

        if(!files || files.length === 0){
            break;
        }

        for(const file of files){
            const childPath = prefix ? prefix + "/" + file.name : file.name;

            if(isSupabaseFolder(file)){
                paths = paths.concat(await listSupabaseObjectPaths(childPath));
            }else{
                paths.push(childPath);
            }
        }

        if(files.length < limit){
            break;
        }

        offset += limit;
    }

    return paths;
}

function collectReferencedSupabasePaths(targetData){
    return new Set(
        collectPhotoReferences(targetData)
        .map((refItem)=>getSupabaseObjectPath(refItem.parent[refItem.key]))
        .filter(Boolean)
    );
}

async function removeUnreferencedCurrentStoreFiles(){
    const referencedPaths = collectReferencedSupabasePaths(data);
    let allPaths = await listSupabaseObjectPaths(
        "stores/" + safeStorageSegment(currentStoreId)
    );

    if(currentStoreId === DEFAULT_STORE_ID){
        allPaths = allPaths.concat(await listSupabaseObjectPaths("dollCraneImages"));
    }

    const unusedPaths = allPaths.filter((path)=>!referencedPaths.has(path));

    await removeSupabaseObjectPaths(unusedPaths);

    return unusedPaths.length;
}

function collectPhotoReferences(targetData){
    const refs = [];

    if(targetData.siteLogo){
        refs.push({
            parent:targetData,
            key:"siteLogo",
            kind:"legacy-logo"
        });
    }

    Object.keys(targetData.machines || {}).forEach((genre)=>{
        const machines = targetData.machines[genre] || {};

        Object.keys(machines).forEach((machineId)=>{
            const machine = machines[machineId];

            if(!machine || typeof machine !== "object"){
                return;
            }

            if(machine.photo){
                refs.push({
                    parent:machine,
                    key:"photo",
                    kind:"main"
                });
            }

            (machine.evidencePhotos || []).forEach((photoItem)=>{
                if(photoItem && photoItem.photo){
                    refs.push({
                        parent:photoItem,
                        key:"photo",
                        kind:"evidence"
                    });
                }
            });
        });
    });

    (targetData.trash || []).forEach((item)=>{
        if(item && item.type === "photo" && item.data && item.data.photo){
            refs.push({
                parent:item.data,
                key:"photo",
                kind:"trash"
            });
        }

        if(item && item.type === "machine" && item.data){
            if(item.data.photo){
                refs.push({
                    parent:item.data,
                    key:"photo",
                    kind:"trash-main"
                });
            }

            (item.data.evidencePhotos || []).forEach((photoItem)=>{
                if(photoItem && photoItem.photo){
                    refs.push({
                        parent:photoItem,
                        key:"photo",
                        kind:"trash-evidence"
                    });
                }
            });
        }

        if(item && item.type === "genre" && item.data){
            Object.keys(item.data || {}).forEach((machineId)=>{
                const machine = item.data[machineId];

                if(!machine || typeof machine !== "object"){
                    return;
                }

                if(machine.photo){
                    refs.push({
                        parent:machine,
                        key:"photo",
                        kind:"trash-genre-main"
                    });
                }

                (machine.evidencePhotos || []).forEach((photoItem)=>{
                    if(photoItem && photoItem.photo){
                        refs.push({
                            parent:photoItem,
                            key:"photo",
                            kind:"trash-genre-evidence"
                        });
                    }
                });
            });
        }
    });

    return refs.filter((refItem)=>{
        return isDataUrl(refItem.parent[refItem.key]) || isImageUrl(refItem.parent[refItem.key]);
    });
}

async function imageSourceToDataUrl(source){
    if(isDataUrl(source)){
        return source;
    }

    const response = await fetch(source);

    if(!response.ok){
        throw new Error("이미지 다운로드 실패: " + response.status);
    }

    const blob = await response.blob();

    return new Promise((resolve, reject)=>{
        const reader = new FileReader();

        reader.onerror = ()=>{
            reject(new Error("이미지 읽기 실패"));
        };

        reader.onload = (event)=>{
            resolve(event.target.result);
        };

        reader.readAsDataURL(blob);
    });
}

async function recompressPhotoReference(refItem, state){
    const source = refItem.parent[refItem.key];
    const oldPath = isImageUrl(source) ? getSupabaseObjectPath(source) : "";
    const sourceDataUrl = await imageSourceToDataUrl(source);
    const compressed = await compressDataUrl(sourceDataUrl);

    refItem.parent[refItem.key] = await uploadDataUrlToStorage(
        compressed,
        "stores/" +
        safeStorageSegment(currentStoreId) +
        "/dollCraneImages/recompressed/" +
        Date.now() + "_" +
        state.done +
        "_" +
        Math.random().toString(36).slice(2, 10) +
        ".jpg",
        {
            trackUsage:false
        }
    );

    if(oldPath){
        state.oldPaths.push(oldPath);
    }
}

async function migrateDataUrlsInPlace(value, state){
    if(Array.isArray(value)){
        for(let i = 0; i < value.length; i++){
            if(isDataUrl(value[i])){
                state.done++;
                document.getElementById("loading-text").innerText =
                    "사진 용량 정리 중... " + state.done + "/" + state.total;
                document.getElementById("progress-fill").style.width =
                    Math.round((state.done / state.total) * 90) + "%";

                const compressed = await compressDataUrl(value[i]);

                value[i] = await uploadDataUrlToStorage(
                    compressed,
                    "stores/" +
                    safeStorageSegment(currentStoreId) +
                    "/dollCraneImages/migration/" +
                    Date.now() + "_" +
                    state.done +
                    "_" +
                    Math.random().toString(36).slice(2, 10) +
                    ".jpg"
                );
            }else{
                await migrateDataUrlsInPlace(value[i], state);
            }
        }

        return;
    }

    if(value && typeof value === "object"){
        const keys = Object.keys(value);

        for(const key of keys){
            if(isDataUrl(value[key])){
                state.done++;
                document.getElementById("loading-text").innerText =
                    "사진 용량 정리 중... " + state.done + "/" + state.total;
                document.getElementById("progress-fill").style.width =
                    Math.round((state.done / state.total) * 90) + "%";

                const compressed = await compressDataUrl(value[key]);

                value[key] = await uploadDataUrlToStorage(
                    compressed,
                    "stores/" +
                    safeStorageSegment(currentStoreId) +
                    "/dollCraneImages/migration/" +
                    Date.now() + "_" +
                    state.done +
                    "_" +
                    Math.random().toString(36).slice(2, 10) +
                    ".jpg"
                );
            }else{
                await migrateDataUrlsInPlace(value[key], state);
            }
        }
    }
}

async function migratePhotosToStorage(){
    if(!requireStoreEdit()){
        return;
    }

    initializeData();

    const photoRefs = collectPhotoReferences(data);
    const total = photoRefs.length;

    if(total === 0){
        alert("정리할 사진 데이터가 없습니다.");
        toggleMenu(false);
        return;
    }

    if(!confirm(
        "저장된 사진 " +
        total +
        "개를 현재 압축 설정으로 다시 압축합니다.\n새 파일로 다시 업로드하고 DB의 사진 URL을 교체합니다.\n진행 중에는 화면을 닫지 마세요."
    )){
        return;
    }

    toggleMenu(false);

    const interval = showLoading("사진 용량 정리 중... 0/" + total);

    try{
        const state = {
            total:total,
            done:0,
            oldPaths:[]
        };

        for(const photoRef of photoRefs){
            state.done++;

            document.getElementById("loading-text").innerText =
                "사진 용량 정리 중... " + state.done + "/" + state.total;
            document.getElementById("progress-fill").style.width =
                Math.round((state.done / state.total) * 90) + "%";

            await recompressPhotoReference(photoRef, state);
        }

        await saveData(()=>{
            loadLogo();
            render(false);
        });

        if(state.oldPaths.length > 0){
            document.getElementById("loading-text").innerText =
                "이전 사진 파일 삭제 중...";

            await removeSupabaseObjectPaths(state.oldPaths);
        }

        document.getElementById("loading-text").innerText =
            "안 쓰는 사진 파일 정리 중...";

        const removedUnusedCount =
            await removeUnreferencedCurrentStoreFiles();

        document.getElementById("loading-text").innerText =
            "사진 용량 다시 계산 중...";

        appData.storageUsageBytes = await calculateTotalStorageUsage();

        await saveData(()=>{
            updateStorageBadge();
            render(false);
        });

        alert(
            "사진 용량 정리가 완료되었습니다.\n" +
            "안 쓰는 이전 파일 " +
            removedUnusedCount +
            "개를 정리했습니다."
        );
    }catch(err){
        console.error(err);
        alert("사진 용량 정리 실패: " + err.message);
    }finally{
        hideLoading(interval);
    }
}

            }

            newName = sanitizeText(newName);

            if(!newName){
                alert("기계 번호를 입력하세요.");

            if(!isValidDataKey(newName)){
                alert("기계 번호에는 . # $ / [ ] 문자를 사용할 수 없습니다.");
                return;
            }

                alert("이미 존재합니다.");
                return;
            }

            data.machines[currentGenre][newName] = data.machines[currentGenre][machine];

            if(newName !== machine){
                delete data.machines[currentGenre][machine];
            }

            if(currentMachine === machine){
                currentMachine = newName;
            }

            saveData(()=>render(false));
        }));

        admin.appendChild(createAdminButton("삭제", (event)=>{

                name:machine,
                data:data.machines[currentGenre][machine],
                deletedAt:new Date().toISOString()
            });

            delete data.machines[currentGenre][machine];

            saveData(()=>render(false));
        }));

        wrap.appendChild(item);

            wrap.appendChild(admin);
        }

            return;
        }

            alert("기계 번호에는 . # $ / [ ] 문자를 사용할 수 없습니다.");
            return;
        }

        if(data.machines[currentGenre][number]){

    root.appendChild(createButton("btn-back", "뒤로가기", ()=>{

function renderTrash(root){
    const now = Date.now();

    const title = document.createElement("h2");
    title.innerText = "🗑️ 휴지통";
    root.appendChild(title);

    const guide = document.createElement("p");
    guide.className = "sub-text";
    guide.innerText = "30일 후 자동 삭제";
    root.appendChild(guide);

    if(!data.trash || data.trash.length === 0){
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.innerText = "휴지통 비어있음";
        root.appendChild(empty);
    }else{
        const trashContainer = document.createElement("div");

        data.trash.forEach((item, index)=>{
            const deletedTime = new Date(item.deletedAt).getTime();
            const daysLeft = Math.max(0, Math.ceil((TRASH_LIMIT_MS - (now - deletedTime)) / (24 * 60 * 60 * 1000)));

            let itemType = "📸 사진";

            if(item.type === "genre"){
                itemType = "📁 폴더";
            }else if(item.type === "machine"){
                itemType = "🤖 기계";
            }

            const trashItem = document.createElement("div");
            trashItem.className = "trash-item";

            const info = document.createElement("div");

            const itemTitle = document.createElement("div");
            itemTitle.className = "trash-title";
            itemTitle.innerText = itemType + " - " + (item.name || "");

            const date = document.createElement("div");
            date.className = "trash-date";
            date.innerText = "삭제: " + new Date(item.deletedAt).toLocaleString("ko-KR");

            const dday = document.createElement("div");
            dday.className = "trash-dday";
            dday.innerText = daysLeft + "일 후 자동 삭제";

            info.appendChild(itemTitle);
            info.appendChild(date);
            info.appendChild(dday);

            const buttons = document.createElement("div");
            buttons.className = "trash-buttons";

            buttons.appendChild(createAdminButton("복구", ()=>{
                restoreTrashItem(index);
            }));

            const deleteButton = createAdminButton("영구삭제", ()=>{
                deleteTrashItem(index);
            });
            deleteButton.style.background = "#d9534f";
            deleteButton.style.color = "white";
            buttons.appendChild(deleteButton);

            trashItem.appendChild(info);
            if(canEditCurrentStore()){
                trashItem.appendChild(buttons);
            }
            trashContainer.appendChild(trashItem);
        });

        root.appendChild(trashContainer);
    }

    root.appendChild(createButton("btn-back", "뒤로가기", ()=>{
        history.back();
    }));
}

function getAccountRowValues(code){
    const row = document.querySelector('[data-account-code="' + code + '"]');

    if(!row){
        return null;
    }

    const loginId = normalizeLoginId(row.querySelector(".account-login-id").value);
    const password = row.querySelector(".account-password").value.trim();
    const role = row.querySelector(".account-role").value;
    const storeIds = Array.from(row.querySelectorAll(".account-store-check:checked"))
    .map((checkbox)=>checkbox.value);

    return {
        loginId,
        password,
        role,
        storeIds
    };
}

async function saveAccountRow(code){
    const account = appData.accounts[code];
    const values = getAccountRowValues(code);

    if(!account || !values){
        alert("계정 정보를 찾을 수 없습니다.");
        return;
    }

    if(!values.loginId){
        alert("아이디를 입력하세요.");
        return;
    }

    if(values.loginId === DEFAULT_MASTER_ID){
        alert("기본 마스터 아이디는 사용할 수 없습니다.");
        return;
    }

    const existingCode = findAccountCodeByLoginId(values.loginId);

    if(existingCode && existingCode !== code){
        alert("이미 사용 중인 아이디입니다.");
        return;
    }

    if(values.storeIds.length === 0){
        alert("접속 지점을 1개 이상 선택하세요.");
        return;
    }

    account.loginId = values.loginId;
    account.role = values.role;
    account.storeIds = values.storeIds;

    if(values.password){
        account.passwordHash = await hashPassword(values.password);
    }

    if(!account.passwordHash){
        alert("새 계정은 비밀번호를 입력해야 저장할 수 있습니다.");
        return;
    }

    await saveData(()=>{
        render(false);
        alert("계정이 저장되었습니다.");
    });
}

function deleteAccountRow(code){
    const account = appData.accounts[code];

    if(!account){
        return;
    }

    if(!confirm(account.loginId + " 계정을 삭제할까요?")){
        return;
    }

    delete appData.accounts[code];

    if(currentAccountCode === code){
        currentAccountCode = "";
        currentLoginId = "";
    }

    saveData(()=>{
        render(false);
        updateAuthUI();
    });
}

function adjustMemoHeight(){
    const textarea = document.getElementById("memo");

    if(!textarea || textarea.classList.contains("scroll-mode")){
        return;
    }

    textarea.style.height = "auto";
    textarea.style.height = textarea.scrollHeight + "px";
}

function applyMemoDisplayMode(){
    setTimeout(()=>{
        const textarea = document.getElementById("memo");
        const button = document.getElementById("memo-mode-toggle");

        if(!textarea){
            return;
        }

        const savedMode = localStorage.getItem("memoDisplayMode") || "expanded";

        if(savedMode === "scroll"){
            textarea.classList.remove("expanded-mode");
            textarea.classList.add("scroll-mode");

            if(button){
                button.innerText = "📖 펼침 모드";
            }
        }else{
            textarea.classList.remove("scroll-mode");
            textarea.classList.add("expanded-mode");

            if(button){
                button.innerText = "📋 스크롤 모드";
            }

            adjustMemoHeight();
        }
    }, 0);
}

function toggleMemoMode(){
    const textarea = document.getElementById("memo");
    const button = document.getElementById("memo-mode-toggle");

    if(!textarea){
        return;
    }

    const isExpanded = textarea.classList.contains("expanded-mode");

    if(isExpanded){
        textarea.classList.remove("expanded-mode");
        textarea.classList.add("scroll-mode");
        textarea.style.height = "";
        localStorage.setItem("memoDisplayMode", "scroll");

        if(button){
            button.innerText = "📖 펼침 모드";
        }
    }else{
        textarea.classList.remove("scroll-mode");
        textarea.classList.add("expanded-mode");
        localStorage.setItem("memoDisplayMode", "expanded");

        if(button){
            button.innerText = "📋 스크롤 모드";
        }

        adjustMemoHeight();
    }
}

function toggleMemoEdit(){
    if(!requireStoreEdit()){
        return;
    }

    const textarea = document.getElementById("memo");
    const button = document.getElementById("memo-btn");

    if(!textarea || !button){
        return;
    }

    if(!memoEditMode){
        memoEditMode = true;
        textarea.readOnly = false;
        textarea.style.pointerEvents = "auto";
        textarea.focus();
        button.innerText = "💾 저장";

        memoInputListener = ()=>{
            adjustMemoHeight();
        };

        textarea.addEventListener("input", memoInputListener);
        adjustMemoHeight();
        return;
    }

    if(memoInputListener){
        textarea.removeEventListener("input", memoInputListener);
        memoInputListener = null;
    }

    if(!data.machines[currentGenre] || !data.machines[currentGenre][currentMachine]){
        alert("데이터 오류");
        return;
    }

    data.machines[currentGenre][currentMachine].memo = textarea.value;

    saveData(()=>{
        textarea.readOnly = true;
        textarea.style.pointerEvents = "none";
        button.innerText = "✏️ 메모 수정";
        memoEditMode = false;
        adjustMemoHeight();
        alert("메모 저장 완료");
    });
}

function restoreTrashItem(index){
    if(!requireStoreEdit()){
        return;
    }

    if(!confirm("복구하시겠습니까?")){
        return;
    }

    const item = data.trash[index];

    if(!item){
        return;
    }

    if(item.type === "genre"){
        if(!data.genres.includes(item.name)){
            data.genres.push(item.name);
            data.machines[item.name] = item.data || {};
        }
    }else if(item.type === "machine"){
        if(!item.genre){
            alert("원본 폴더 정보 없음");
            return;
        }

        if(!data.genres.includes(item.genre)){
            data.genres.push(item.genre);
        }

        if(!data.machines[item.genre]){
            data.machines[item.genre] = {};
        }

        data.machines[item.genre][item.name] = item.data || {
            photo:"",
            memo:"",
            evidencePhotos:[]
        };
    }else if(item.type === "photo"){
        if(!data.machines[item.genre] || !data.machines[item.genre][item.machine]){
            alert("원본 기계 없음");
            return;
        }

        if(!Array.isArray(data.machines[item.genre][item.machine].evidencePhotos)){
            data.machines[item.genre][item.machine].evidencePhotos = [];
        }

        data.machines[item.genre][item.machine].evidencePhotos.push(item.data);
    }

    data.trash.splice(index, 1);

    saveData(()=>{
        render(false);
        alert("복구 완료");
    });
}

function deleteTrashItem(index){

function uploadPhoto(type){
    if(!requireStoreEdit()){
        return;
    }

    if(!currentGenre || !currentMachine){
        alert("기계 정보 없음");
        return;
    }

    const machine = data.machines[currentGenre] && data.machines[currentGenre][currentMachine];

    if(!machine){
        alert("기계 데이터 없음");
        return;
    }

    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.multiple = type === 1;

    input.onchange = async(event)=>{
        const files = Array.from(event.target.files || []);

        if(files.length === 0){
            return;
        }

        const interval = showLoading("📤 이미지 업로드 중...");

        try{
            if(type === 0){
                machine.photo = await compressAndUploadImage(files[0], "main");
            }else{
                if(!Array.isArray(machine.evidencePhotos)){
                    machine.evidencePhotos = [];
                }

                for(let i = 0; i < files.length; i++){
                    const url = await compressAndUploadImage(files[i], "evidence");
                    machine.evidencePhotos.push({ photo:url });

                    const percent = Math.round(((i + 1) / files.length) * 100);
                    document.getElementById("progress-fill").style.width = percent + "%";
                    document.getElementById("loading-text").innerText = "📤 이미지 업로드 중... " + percent + "%";
                }
            }

            await saveData(()=>{
                render(false);
            });
        }catch(err){
            console.error(err);
            alert("업로드 실패: " + err.message);
        }finally{
            hideLoading(interval);
        }
    };

    input.click();
}

function toggleMenu(force){
    const menu = document.getElementById("side-menu");
    const overlay = document.getElementById("side-overlay");
    const active = typeof force === "boolean" ? force : !menu.classList.contains("active");

    menu.classList.toggle("active", active);
    overlay.classList.toggle("active", active);
}

}

document.getElementById("logo-upload").onchange = async(event)=>{
    if(!requireStoreManage()){
        event.target.value = "";
        return;
    }

    const file = event.target.files && event.target.files[0];

    if(!file){
        return;
    }

    const interval = showLoading("📤 타이틀 이미지 업로드 중...");

    try{
        appData.siteLogo = await compressAndUploadImage(file, "logo");

        await saveData(()=>{
            loadLogo();
            toggleMenu(false);
            alert("타이틀 변경 완료");
        });
    }catch(err){
        console.error(err);
        alert("타이틀 업로드 실패: " + err.message);
    }finally{
        hideLoading(interval);
        event.target.value = "";
    }
};

window.addEventListener("popstate", (event)=>{
    if(event.state){
        if(event.state.store && appData.stores[event.state.store]){
            currentStoreId = event.state.store;
            localStorage.setItem("currentStoreId", currentStoreId);
            data = appData.stores[currentStoreId];
        }

        currentView = event.state.view || "genres";
        currentGenre = event.state.genre || null;
        currentMachine = event.state.machine || null;
    }else{
        currentView = "genres";
        currentGenre = null;
        currentMachine = null;
    }

    render(false);
});
